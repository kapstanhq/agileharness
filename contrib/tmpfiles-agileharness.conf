# AgileHarness — a raiz própria de scratch efêmero.
#
# INSTALAR: copie para /etc/tmpfiles.d/agileharness.conf e rode `systemd-tmpfiles --create`.
#
# ⚠️ ESTE ARQUIVO É O BACKSTOP, NÃO A GARANTIA. A garantia portátil é o helper `withHarnessTempDir`
# (packages/storymap-ui/src/lib/storymap/runner/temp.ts), que remove no `finally`, mais a varredura
# que roda no boot do serviço. Este drop-in só vale onde `os.tmpdir()` É `/tmp` e existe systemd —
# num host que não seja Linux ele simplesmente não participa. Dizer "temos ceifador" sem essa frase é
# alegar uma cobertura que não existe.
#
# IDADE = 1d, e o número é MEDIDO, não escolhido:
#   • teto duro de um run: 1h (runner/config.ts, UNIVERSAL_TIMEOUT_MS)
#   • observado em 402 runs: p50 4,3min · p90 14,5min · p99 41,8min · MÁXIMO 1,17h
#   • o timer de limpeza do systemd dispara UMA VEZ POR DIA
#   ⇒ 1d é ~20x o máximo observado e 24x o teto duro.
#
# A IDADE SOZINHA NÃO É PROVA DE SEGURANÇA: o operador pode subir o teto de um run por configuração.
# Quem garante "processo vivo ⇒ nunca ceifado" é o helper, não esta linha.
#
# `d` e não `D`: o `/tmp` da distro já é `D` (wipe no boot), então isso é herdado — e uma segunda
# declaração de wipe apagaria scratch de um serviço que sobe ANTES desta limpeza rodar.
d /tmp/agileharness 0700 root root 1d
