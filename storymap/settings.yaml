version: 1
economyMode: false
autorun:
  enabled: true
  resumeOnBoot: true
  maxConcurrent: 6
  noProgressMax: 3
  # DISJUNTOR DE CUSTO POR RUN — todo run headless nasce com `claude --max-budget-usd <n>`
  # (runner/run-budget.ts). Ausente ⇒ a tabela por skill, max(2×p90, p99) do custo histórico
  # (harness-do 23.8 … harness-capture 2.6; qualquer outra 8). Um número vale para toda skill, um mapa
  # sobrescreve só as skills nomeadas, 0 desliga. Env AGILEHARNESS_AUTORUN_MAX_BUDGET_USD vence.
  # NÃO é ritmo: é contra run desembestado. Um run cortado vira `budget-cut` (árvore preservada, sem
  # resume, finding no card); dois cortes seguidos retêm o card para decisão humana.
  # maxBudgetUSD: { harness-do: 30 }
  # O mesmo disjuntor nas superfícies autônomas FORA do engine (defaults 2 / 2 / 4 / 2; 0 desliga).
  # O chat interativo do operador não tem teto por desenho.
  # surfaceMaxBudgetUSD: { peerReview: 2, resolutionJudge: 2, deployAgent: 4, smartCapture: 2 }
  timeouts:
    fastMs: 1800000
    doMs: 7200000
    universalMs: 10800000
  claudeBin: claude
  extraArgs: []
  worktreeIsolation: true
  mergeGate:
    enabled: true
    checkCommand: vitest run
    timeoutMs: 300000
    retryOnNewFailure: true
    # Affected-only selection (perf): the MERGED gate run tests only what the entry's diff touches
    # (`--changed {base}`, {base} = pre-merge main HEAD) instead of the full ~40s/272-file suite — a leaf
    # entry drops to ~6s and, crucially, skips the heavy real-git tests that amplify worst under load. The
    # BASE attribution re-run stays full (it only fires on an already-failing entry). Any changed file in
    # `fullSuitePaths` forces the full suite. See runner/affected-gate.ts. Absent ⇒ full suite (legacy).
    # ⚠️ O TRADE DESTA OTIMIZAÇÃO, ESCRITO (I-4). O gate serial existia também para pegar quebras
    # SEMÂNTICAS *entre* entradas — a entrada B rodando a suíte inteira sobre o código que A acabou de
    # aterrissar. Com `affected` ligado, B roda só o que o diff de B seleciona, então uma quebra que B
    # introduz no código de A só é vista se a seleção calhar de incluí-la. A literatura de conflito
    # semântico é explícita em que compilação e teste frequentemente NÃO pegam conflitos de ordem
    # superior; reduzir a seleção de teste reduz exatamente essa cobertura.
    # POR QUE MESMO ASSIM: o p90 do gate caiu de minutos para ~2 min, e um gate lento é uma fila serial
    # mais longa — que é a própria janela em que duas entradas se cruzam. A mitigação escolhida é
    # `fullSuitePaths` (abaixo): todo kernel amplamente importado e toda ENTRADA de teste que o grafo de
    # imports não enxerga força a suíte completa. Um arquivo que não está nessa lista e quebra alguém
    # remoto é o residual ACEITO — e a saída dele é a suíte completa periódica sobre `stage`, não voltar
    # a gatear tudo por entrada.
    # A seleção é POR UNIDADE e só em unidades `vitest-json`: o gate ANEXA `--changed <base>
    # --passWithNoTests` ao comando da própria unidade (as flags dela — `--config` incluso — sobrevivem).
    # Unidades junit-xml/exit-code rodam SEMPRE completas. O antigo `affected.command` (um template que
    # SUBSTITUÍA o comando de toda unidade: pytest rodava vitest, `--config` sumia) foi aposentado — se
    # ainda estiver no seu settings, é ignorado.
    affected:
      enabled: true
      fullSuitePaths:
        # Widely-imported kernels — each pulls ≥30% of the suite (measured), and the import graph is
        # least trustworthy here, so run everything.
        - packages/storymap-ui/src/lib/storymap/types.ts
        - packages/storymap-ui/src/lib/storymap/contracts.ts
        - packages/storymap-ui/src/lib/storymap/gate-core.js
        - packages/storymap-ui/src/lib/storymap/runner/config.ts
        - packages/storymap-ui/src/lib/storymap/runner/merge-queue.ts
        # Test INPUTS the module graph can't see (read as files at runtime): a change here can break a
        # golden/consistency test that `--changed` would never select. (Pure data-only entries skip the
        # gate entirely; these patterns only matter for MIXED code+data entries.)
        - storymap/boards/
        - .claude/skills/
        - packages/storymap-ui/src/lib/storymap/__snapshots__/
        # Test harness / toolchain — a change reshapes the whole run.
        - packages/storymap-ui/vitest.config.ts
        - packages/storymap-ui/vitest.setup.ts
        - packages/storymap-ui/package.json
        - "**/tsconfig*.json"
    # QUAL suíte o gate roda (P-7). Antes isto era `packages/storymap-ui` LITERAL no código, em três
    # lugares — então uma sessão que mexia num pacote de produto era validada pela suíte do harness:
    # testes errados, confiança falsa. Agora é declarativo, e conservador: só um pacote listado aqui
    # ganha unidade própria; qualquer outra coisa (e todo arquivo fora do mapa) cai no fallback, que é o
    # pacote do harness — exatamente o comportamento anterior. Adicionar um pacote é UMA linha.
    # ⚠️ Só declare um pacote cuja suíte você sabe que roda verde e rápido: cada unidade custa uma suíte
    # DENTRO do slot serial do train (por isso o `maxUnits`, que colapsa no fallback ao ser estourado).
    scope:
      packages:
        packages/storymap-ui: vitest run
      maxUnits: 3
      # O FALLBACK É DECLARAÇÃO, NÃO SUPOSIÇÃO: a ferramenta não sabe qual pacote é a suíte do repositório de quem a
      # usa, então sem esta chave o gate RECUSA (inconclusivo) todo delta com código fora do mapa acima — e o merge
      # train da PRÓPRIA ferramenta congelaria essas entradas. Aqui o repositório É a ferramenta: a suíte padrão é a
      # do pacote dela.
      fallback:
        cwd: packages/storymap-ui
        command: vitest run
    # ── UM ALVO MONOREPO (exemplo — comentado; este repositório só tem o pacote acima) ─────────────
    # Cada unidade DECLARA como é medida. A string solta (`dir: comando`) continua valendo: é uma unidade
    # `vitest-json`. Todo gate grava, por unidade, a argv EXATA executada e QUANTOS testes rodaram
    # (entrada do train → `gateReport`; `wait_for_submit` → `gate`; log do gate).
    #
    # scope:
    #   packages:
    #     # string solta: o gate anexa --reporter=json (e, com affected ligado, --changed <base>)
    #     apps/portal: bunx vitest run
    #     # a lib roda de DENTRO dela e com config própria; mexer no pacote de tipos compartilhados a dispara
    #     libs/pricing:
    #       cwd: libs/pricing
    #       command: bunx vitest run --config vitest.node.config.ts
    #       triggers:
    #         - libs/shared-types/**
    #     # serviço em Go: só o status do processo (não conta testes) e com a rede do host liberada
    #     services/ledger:
    #       command: go test ./...
    #       reporter: exit-code
    #       network: allow
    #   units:
    #     # contratos: prefixo FORA dos pacotes, roda da raiz; dispara quando um schema ou um .proto muda
    #     tests/contract:
    #       command: bunx vitest run --config tests/contract/vitest.config.ts --reporter=junit --outputFile=.gate/contract.xml
    #       reporter: junit-xml
    #       junitPath: .gate/contract.xml
    #       cwd: .
    #       triggers:
    #         - libs/*/schema/**
    #         - services/*/proto/**
    #   maxUnits: 5
    #   fallback:
    #     cwd: libs/core
    #     command: bunx vitest run
    #
    # reporter: `vitest-json` (default) | `junit-xml` (lê `junitPath`, apagado antes de cada rodada) |
    # `exit-code` (só o status: não conta testes; com a BASE também vermelha o veredito é INCONCLUSIVO,
    # nunca aprovação). Só falhas NOVAS reprovam (a base é re-medida), com retry de flaky.
    #
    # O SELO: cada comando do delta (suíte, typecheck, `vitest -u`) roda numa unidade transiente do
    # systemd — root SEM capability, FS read-only exceto a árvore do gate, /run e /tmp privados,
    # credenciais conhecidas inacessíveis (~/.ssh, ~/.aws, ~/.config/gcloud, ~/.claude, os .env do
    # checkout…) e sem rede nas unidades `network: deny`. Só vale quando a SONDA prova o selo no host;
    # sem systemd (ou serviço não-root) o gate cai para `none` com aviso (log de cada gate + preflight).
    # `none` declara o risco aceito. Ver runner/gate-sandbox.ts para o que foi medido e o que NÃO cobre.
    isolation: systemd
    # sealed:
    #   inaccessiblePaths: [/etc/agileharness]    # o diretório de env/segredos do SEU serviço
    #   writablePaths: [~/.cache/ms-playwright]   # um cache que a suíte precisa ESCREVER
    # (vitest selado não precisa de writablePaths para node_modules: o gate já passa `--configLoader runner
    # --no-cache` a todo vitest sob o selo — o config carrega em memória e nada é gravado em node_modules.)
    #
    # ── FERRAMENTAL FORA DE codePrefixes: as unidades de DADOS (o gate do que aterrissa em main) ─────────
    # Com `staging` ligado, o split manda para `main` TUDO o que está fora de `staging.codePrefixes` — não só
    # cards: o sistema de deploy, scripts de operação, o justfile. Sem declaração nada disso roda um teste antes
    # de aterrissar. Uma unidade de dados roda quando a metade de dados de uma entrada toca o prefixo dela —
    # selada, com os mesmos reporters/contagem/atribuição do gate de código (afetados quando vitest-json) —
    # numa árvore descartável = `main` atual + a metade de dados; e o patch só aterrissa em main se ela passar
    # (inconclusivo re-tenta; reprovado devolve à sessão / parqueia o run como gate-failed; nada do split
    # aterrissa antes do veredito). Os arquivos CONTINUAM indo para main — o checkout de runtime os roda de lá.
    # Mesma forma de `scope.packages` (a chave casa por prefixo; `triggers` também disparam); SEM fallback e
    # SEM teto: prefixo não declarado segue como hoje. Só vale com staging ligado — sem split, use `scope.units`.
    #
    # dataUnits:
    #   # o site de documentação tem suíte vitest própria, rodada de dentro da pasta
    #   docs/site:
    #     command: bunx vitest run
    #     cwd: docs/site
    #   # pipelines de CI: um script de autoteste que sai 0 ou não (exit-code não conta testes)
    #   ci/pipelines:
    #     command: sh ci/selftest.sh
    #     reporter: exit-code
    #     cwd: .
    #
  mergeTrain:
    maxRedrives: 2
    semanticResolution: true
  staging:
    enabled: true
    branch: stage
    # SEM DEFAULT: com o staging LIGADO o alvo tem de DECLARAR onde o código mora — sem esta lista o merge train recusa subir
    # no boot dizendo «declare autorun.staging.codePrefixes» (`[]` explícito = nada é código). Ausente com o staging
    # desligado, tudo fora de storymap/boards/ é tratado como código (o lado seguro: só preserva e verifica mais).
    codePrefixes:
      - packages/
      # o terminal web estático (tools/web-terminal/, servido pelo Caddy) é CÓDIGO
      # deployável que vive FORA de packages/. Sem esta linha o split classifica-o como board-data
      # (→ main direto, sem gate, incoerente com a rota-API dele em packages/). Declarado também em
      # boards/storymap/board.yaml (deploy.surfaces) — o lint board-integrity mantém os dois em sincronia.
      # Boot-fixed: exige rebuild+restart do serviço para ativar.
      - tools/web-terminal/
    dataDerived:
      - artifact: packages/storymap-ui/src/lib/storymap/__snapshots__/board-base-pipeline.test.ts.snap
        sources:
          - storymap/boards/
        cwd: packages/storymap-ui
        regen: bunx vitest run src/lib/storymap/board-base-pipeline.test.ts --update
  # Fila de publicação diferida (runner/publish-queue): "publique este sha quando o pipeline ficar
  # ocioso". É o caminho SEM card de `stage` até produção — o merge train já integra trabalho de
  # sessão, mas o promote+deploy era onEnter de um passo, e passo quem atravessa é card.
  #
  # Isto aqui é só o KILL-SWITCH GLOBAL do mecanismo. A política POR BOARD — quem publica e se publica
  # sozinho — mora em `release.mode` no board.yaml (default `manual`; ver lib/storymap/release-policy.ts).
  # A lista `boards:` respondia DUAS perguntas ao mesmo tempo, e tirar um board dela tirava tanto o
  # "publica sozinho" quanto o "PODE publicar" — foi o que deixou trabalho de sessão de um board 6 dias em
  # `stage` sem nada capaz de movê-lo.
  #
  # ⚠️ TRANSITÓRIA — a chave abaixo já está MORTA para o código novo (que a ignora), mas continua aqui de
  # propósito por uma janela: este arquivo é board-data e aterrissa em `main` IMEDIATAMENTE, enquanto o
  # código vai para `stage` e só entra no ar na publicação seguinte. Removê-la no mesmo commit faria o
  # serviço AINDA ANTIGO ler uma lista vazia e recusar publicar até para o `storymap` — inclusive a
  # publicação que traria o código novo. Apagar num commit de limpeza DEPOIS do deploy.
  publishQueue:
    enabled: true
    boards:
      - storymap
  scheduler:
    lanes:
      light:
        maxConcurrent: 3
        memoryMax: 2G
        cpuQuota: 100
      heavy:
        maxConcurrent: 2
        memoryMax: 8G
        cpuQuota: 300
    thresholds:
      ramFreeMb: 1500
      # PORTÁVEL: 1.0 × nº de cores (convenção Linux — load == cores é "CPU cheia", não "sobrecarregada").
      # Substitui o absoluto: o 3.5 ficava ABAIXO do baseline de um host pequeno e ocupado, então a
      # lane pesada e o worktree_open recusavam SEMPRE — o board parava por admission control, sem sinal ao
      # operador, indistinguível de pipeline ocioso. Um absoluto não viaja entre máquinas; este viaja.
      loadAvg1PerCore: 1.0
      # Mantido só como piso para um host onde o per-core não se aplique; o per-core tem precedência.
      loadAvg1: 6.0
  sessions:
    # Teto de ÁRVORES de sessão vivas, não de agentes: o custo de um slot é disco +
    # node_modules linkado, e quem gasta CPU/RAM é o processo do agente — que já existe antes de
    # pedir a árvore. Com 4 o cap virava fila: 4 sessões interativas normais já o esgotavam e a 5ª
    # ficava sem onde editar (o remédio da própria recusa é subir isto). 8 é o teto do host de 6
    # cores; quem protege a máquina de verdade é `scheduler.thresholds` (RAM/load), que continua
    # recusando admissão sob pressão mesmo com slot livre.
    maxWorktrees: 8
columnDefaults:
  model: sonnet
  effort: medium
orchestrator:
  enabled: true
  tickMinutes: 20
  budget:
    maxTicksPerDay: 50
    maxCostPerDay: 100
  notifyBudget:
    maxPushesPerDay: 12
  chat:
    model: opus[1m]
    effort: high
  riskMatrix:
    merge-resolve: auto
  wake:
    debounceSeconds: 45
    cooldownMinutes: 5
    enabled: true
  # A contenção de CADA tick do copiloto: teto de turnos, de dinheiro e relógio de parede (SIGKILL).
  # Defaults 40 / US$ 4 / 12 min (abaixo do TTL de 20 min do lease). Só o dinheiro aceita 0 (desliga);
  # um tick morto pelo relógio é cobrado no orçamento do dia pelo teto, marcado como estimado.
  # tick: { maxTurns: 40, maxBudgetUSD: 4, timeoutMinutes: 12 }
# O GOVERNADOR DE CAPACIDADE (runner/capacity-governor.ts): a admissão do trabalho AUTOMÁTICO pela janela REAL
# da assinatura (7 dias e 5 horas, em %), que o dono também usa interativamente — o custo em dólar do ledger é
# nocional; o limite que existe são essas janelas. Os percentuais são do uso TOTAL da conta (dono + frota).
#   · até weekCapPct da semana; nas últimas 24h antes do reset, até weekCapLast24hPct (só com a 5h folgada);
#   · a janela de 5h até fiveHourCapPct;
#   · RITMO DIÁRIO: cota de hoje = (teto − uso na 1ª leitura do dia) ÷ dias até o reset; o "dia" é o de `timezone`;
#   · TRAVA (latch) em latchWeekPct / latchFiveHourPct, ou com o uso extra PAGO ligado — só o operador a solta;
#   · leitura mais velha que staleMinutes ⇒ o automático espera. SEM medidor (sem o proxy de uso) ⇒ inerte.
# O trabalho iniciado pelo operador e as sessões interativas NUNCA são retidos. Kill switch: AGILEHARNESS_GOVERNOR=off.
# timezone ausente = o fuso do host (ex.: timezone: America/Sao_Paulo).
governor:
  enabled: true
  weekCapPct: 80
  weekCapLast24hPct: 90
  fiveHourCapPct: 85
  latchWeekPct: 92
  latchFiveHourPct: 90
  staleMinutes: 20
  # MEDIDOR PARADO — o impasse que a espera por defasagem não enxerga: o proxy de uso só renova a leitura com o
  # token que colhe do TRÁFEGO; sem tráfego ele expira, a leitura fica defasada, a automação é retida (certo), e
  # retida nada passa pelo proxy — o token nunca se renova. Defasada há mais que isto (min), com o medidor já
  # visto neste host, vira UM aviso crítico (`meter-stale` → push `capacity-meter-stale`) e o painel de
  # capacidade diz «medidor parado desde HH:MM», uma vez por episódio. Nunca abaixo de staleMinutes.
  meterStallMinutes: 30
  # A saída OPCIONAL e barata: enquanto a leitura estiver defasada (medidor já visto), rodar um keepalive a cada
  # N min para gerar tráfego pelo proxy. SÓ a cadência mora aqui — o COMANDO vem do ambiente do host, argv em JSON
  # e sem shell, porque este arquivo chega a main pelo train e um comando lido dele rodaria como o serviço:
  #   AGILEHARNESS_METER_KEEPALIVE='["env","ANTHROPIC_BASE_URL=http://127.0.0.1:8787","claude","-p","ok","--max-turns","1"]'
  # Sem as DUAS chaves (esta cadência + o comando no ambiente), nada roda — e a metade que faltar é dita no log.
  # meterKeepalive:
  #   everyMinutes: 30
mcpTokens:
  - tokenEnv: AGILEHARNESS_MCP_TOKEN_ORCH
    level: orch
  - tokenEnv: AGILEHARNESS_MCP_TOKEN_RO
    level: ro

# PUSH SÓ PARA O CRÍTICO (lib/notifications/push-policy.ts) — o que vai ao CELULAR (web-push, chaves VAPID) e ao
# SLACK (AGILEHARNESS_SLACK_WEBHOOK_URL). O resto espera no Inbox: o dono abre quando quiser. AUSENTE = o padrão
# abaixo (descomentar só fixa a lista de hoje). A lista SUBSTITUI o padrão; vazia = nada empurra. Nome desconhecido
# é descartado com aviso. Os fatos que existem:
#   capacity-latch · capacity-extra-usage · capacity-held-24h · capacity-meter-stale   (o governador de capacidade)
#   deploy-rollback (o deploy rodou e falhou; o card voltou) · deploy-blocked (recusado antes de rodar)
#   critical-signal (card nascido com um prefixo de board.yaml notifications.criticalTitlePrefixes)
#   card-demand · card-needs-you · card-moved · run-failed · publish-blocked · terminal-waiting
#   terminal-quiet (o sininho que VOCÊ arma numa página de terminal: empurra sempre, é o seu pedido; nunca vai ao Slack)
#   weekly-summary (o resumo da semana, segunda às 9h no fuso de governor.timezone — o único que não é crítico)
# notifications:
#   push:
#     critical: [capacity-latch, capacity-extra-usage, capacity-meter-stale, deploy-rollback, critical-signal, weekly-summary]
#

# Publicação — o canário de FIDELIDADE que roda depois de um deploy de rosto bem-sucedido:
# "a superfície serve exatamente o que publicamos?" (compara o artefato publicado com o servido,
# por superfície). Um board pode declarar o seu em board.yaml (deploy.canaryCommand); este é o
# DEFAULT do deployment, para quando todos os boards publicam a MESMA face mesclada.
# Ausente aqui e no board => fidelidade não é checada (o harness nunca adivinha uma URL).
deploy:
  # canaryCommand: <o SEU comando de canário>
  # Deixado comentado de propósito: o comando é do SEU repositório. Descomente com um comando que
  # exista nele — uma chave apontando para script inexistente ensina o formato errado a quem copia.
  # OS APPS QUE ESTE DEPLOYMENT PUBLICA pelo caminho diff-aware (a receita de deploy do alvo).
  #
  # A lista é declaração do ALVO, não do fonte do motor: um enum no código viajaria LITERALMENTE dentro
  # do `tools/list` das tools MCP, e os nomes dos apps de um repositório específico virariam parte do
  # contrato publicado de uma ferramenta usada por outros repositórios.
  #
  # O motor resolve `BoardConfig.package` para o basename e só dispara se o basename estiver aqui. Um
  # app pode estar na lista SEM ter board — ele só é alcançável pelas tools MCP cruas, e é exatamente
  # por isso que a lista não pode ser derivada dos boards.
  #
  # ⚠️ Só SLUG entra (`^[A-Za-z][A-Za-z0-9_-]{0,40}$`). O que não casar é DESCARTADO com aviso no log do
  # serviço: um alvo daqui atravessa a superfície de instrução do MCP e um argv, e uma frase nesta lista
  # chegaria ao modelo do outro lado com autoridade de prompt.
  # targets: []   <- OS SEUS apps deployáveis pelo caminho diff-aware
  #   Cada item é o basename de `package` de um board, em forma de slug. AUSENTE ou VAZIA
  #   é um estado válido — declare `deploy:` nos seus board.yaml (kind: command|agent),
  #   que é o caminho por descritor e não depende desta lista.
  # A SUPERFÍCIE COMPOSTA: um artefato único construído a partir das árvores web dos apps + o
  # SDK compartilhado, publicado FORA de qualquer manifesto de pacote (nenhum tem unidade de hosting, de
  # propósito). O deploy diff-aware publica o backend e NÃO publica a face — por isso um release cujo diff toca
  # um caminho da face encadeia a receita abaixo depois de o backend assentar OK.
  #
  # `target` é a chave do job no registry, e ela JÁ ESTÁ GRAVADA em `deployTargets` de cards existentes —
  # trocar o valor órfãos essa evidência. Ausente ⇒ este deployment não tem face composta (estado
  # `absent`), que é diferente de "declarada e ilegível" (`unreadable`, tratado conservador).
  # composedFace:   <- só se você publica UMA superfície montada de VÁRIOS apps
  #   target: <a chave do job no registry>
  #   recipe: <o alvo de `just` que publica a face>
  #   manifest: <JSON, relativo à raiz, que declara os caminhos que COMPÕEM a face>
  #   Declarar uma
  #   face cujo manifesto não existe é pior que não declarar — o motor não saberia se o
  #   diff a toca e republicaria a face a cada promote.

# ══ O ALVO DECLARA O QUE É DELE ═════════════════════════════════════════════════════════════════════════════════
# A ferramenta NÃO supõe o ferramental do repositório que gerencia: executor de testes, pasta de regras, moeda dos
# tetos, lentes de revisão, layout de pacotes, portas do ambiente de QA, comandos de publicação, limite da assinatura.
# Tudo isso é DECLARAÇÃO do operador, aqui (o canal versionado e sob o gate de código — `board.yaml` é editável por
# agente e por isso NUNCA carrega um comando). Sem declaração a ferramenta recusa dizendo a chave exata a declarar, ou
# manda a skill descobrir o comando nas instruções do repositório; nunca cai num default do repositório de origem.
#
# QUENTE: tudo abaixo é relido a cada leitura do arquivo (por mtime), sem restart — exceto `autorun.staging.*`, que é
# lido uma vez na construção da fila do train. Peça fora da forma é DESCARTADA com UMA linha de aviso no log do serviço
# (o resto do bloco segue). Já um YAML ilegível derruba a configuração INTEIRA nos defaults — e também avisa no log.
#
#   target.checks / dev / docs  moldes: {pkg} = último segmento de board.yaml `package`, {package} = o caminho inteiro,
#                               {board} = o id. Comandos rodam SEM shell (lista de palavras), então sem pipe nem `&&`.
#   target.currency            {code: ISO 4217 em MAIÚSCULAS, locale?: BCP 47, neutralWrites?: bool}. O símbolo vem do
#                               Intl, nunca do operador. Sem isto, escrever/decidir custo recusa; exibir usa a moeda do dado.
#   target.reviewLenses        id → {name, description, agent?, when?, mandatoryWhen?}. As lentes embutidas (security,
#                               testing, perf, general, design) são sempre válidas; declarar uma delas só sobrescreve.
#   target.layout              workspaces / packages: globs relativos à raiz, segmentos literais ou `*` (nunca `**`).
#   target.qa                  ports, health (sondas GET só em loopback com porta), seeded, failureClasses (regex ≤ 200
#                               caracteres, sem quantificador aninhado; a primeira que casar vence).
#   deploy.*                   launchers / recipeRunners / recipes (a allow-list de comandos declarados em board-data).
#                               ⚠ É UM PAR: um lançador que é TASK RUNNER (just, task, mise, rake, mask…) tem de aparecer
#                               TAMBÉM em recipeRunners — senão ele só recebe a régua de lançador comum e um argumento de
#                               comando de board (editável por agente) seria interpolado como texto na linha de shell da
#                               receita, com o privilégio do serviço. O carregador avisa alto e o preflight
#                               (`deploy.declared-commands`) mede os comandos de board que a política recusaria.
#                               Demais chaves:
#                               legacy {packageRoot, command, plan, scope, state} com {target}, composedFace.command,
#                               proof {record {securityReview, ownerApproval} com {file}, staleMarkers}. Entram no bloco
#                               `deploy:` JÁ EXISTENTE acima — não existe `target.deploy`. O env AGILEHARNESS_DEPLOY_*
#                               continua ADITIVO (união; o env nunca remove o que o arquivo declarou).
#   vps.*                      weeklyTokenLimit (o denominador do «% usado») e headroomUrl (de onde se LÊ o medidor;
#                               só loopback). Env AGILEHARNESS_WEEKLY_TOKEN_LIMIT / AGILEHARNESS_HEADROOM_URL vencem.
#   autorun.maxBudgetUSD       o teto de custo por run: um número ou um mapa skill → número (já existia).
#
# O exemplo abaixo é INVENTADO (uma oficina de bicicletas) e é carregado por um teste (config-target-schema.test.ts):
# se a forma mudar, este exemplo quebra a suíte — a documentação não pode envelhecer em silêncio.
