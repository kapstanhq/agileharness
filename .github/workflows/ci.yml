# CI do repositório OSS do AgileHarness.
#
# ÚNICA CÓPIA: este diretório é a fonte que o GitHub executa e a que a suíte lê (a issue #1 aposentou a
# cópia revisada em `oss/`). `scripts/security/lint-workflows.mjs` e os testes de supply-chain cobram
# ESTE arquivo diretamente.
#
# `pull_request` (e NUNCA `pull_request_target`): PR de fork roda SEM acesso a secrets. É a diferença entre
# um CI que testa código de estranho e um CI que ENTREGA as credenciais do repositório a ele.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# Mínimo declarado: sem isto o job herda o default do repositório, que pode ser `write-all`. Nenhum passo
# aqui escreve no repositório — só lê a árvore e roda verificação.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `fetch-depth: 0` porque o gate de segredo varre a ÁRVORE rastreada e precisa do git completo.
          fetch-depth: 0
          # `persist-credentials: false` porque o default do checkout GRAVA o `GITHUB_TOKEN` no
          # `.git/config` do runner, onde TODO passo seguinte o lê — inclusive o `postinstall` de uma
          # dependência comprometida, que passaria a poder empurrar commit com a nossa credencial. Nenhum
          # passo daqui fala com o remoto depois do clone, então o custo é zero.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # PINADA na MESMA versão do `packageManager` do package.json da raiz. Com `latest` o resolvedor e
          # o formato do `bun.lock` mudavam sem commit nenhum e o `--frozen-lockfile` abaixo reprovava por
          # DATA. `scripts/security/lint-workflows.mjs` (regra 5) reprova qualquer divergência entre as
          # duas — bumpar bun passa a ser UM par de edições, não uma surpresa.
          bun-version: 1.3.14

      # A CONTENÇÃO PRECISA SUBIR AQUI, senão o CI verifica outro produto. O README chama bubblewrap e
      # socat de "pré-requisito e não sugestão": sem eles a postura REBAIXA todo run de autonomia plena,
      # e a suíte passa a exercitar o caminho degradado. Foi assim que dois guardas de contenção
      # reprovaram no primeiro CI deste repositório — corretamente: eles mediram um host que viola o
      # pré-requisito publicado.
      #
      # MEDIDO, e é a parte que a documentação de terceiros erra: Ubuntu 23.10+ bloqueia userns
      # NÃO-PRIVILEGIADO por AppArmor, e o bwrap depende dele. Numa máquina onde o harness roda como
      # ROOT a restrição não morde (reproduzido: com `kernel.apparmor_restrict_unprivileged_userns=1`
      # ligado, root sobe o bwrap; o mesmo comando sob `setpriv --reuid=65534` falha com
      # "loopback: Failed RTM_NEWADDR: Operation not permitted"). O runner roda como `runner`, não root
      # — então aqui ela morde, e o host precisa ser preparado.
      #
      # A ordem é do menos para o mais brusco: primeiro o perfil que o próprio Ubuntu publica (permite
      # ao bwrap criar namespace sem liberar o resto da máquina), e só se ele não resolver é que se
      # desliga a proteção por sysctl — aceitável APENAS porque esta VM é destruída no fim do job.
      # NÃO copie o sysctl para um host de verdade.
      - name: pré-requisito da contenção — bubblewrap + socat
        run: |
          set -euo pipefail
          sobe() { bwrap --dev-bind / / --unshare-net true 2>/dev/null; }
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends bubblewrap socat
          if ! sobe && [ -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict ]; then
            sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict || true
          fi
          if ! sobe; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # A PROVA, e ela é o passo. Sem ela o job "instala", a suíte roda REBAIXADA em silêncio, e o
          # CI fica verde tendo verificado uma postura que o produto não recomenda.
          sobe || { echo "::error::bwrap não sobe neste runner — a suíte rodaria na postura REBAIXADA"; exit 1; }
          echo "bwrap $(bwrap --version) + socat OK — a suíte exercita a postura sandboxed"

      - name: instalar dependências
        run: bun install --frozen-lockfile

      # Roda ANTES de typecheck/suíte de propósito: é o gate mais rápido e o de dano mais irreversível
      # (licença errada em código já publicado não volta atrás).
      - name: gate de licença — copyleft-forte nova não entra
        run: node scripts/security/check-licenses.mjs --pkg packages/storymap-ui

      # O CI se vigia: o mesmo linter que reprova interpolação de contexto hostil e action não pinada roda
      # sobre os workflows instalados. Sem isto, a próxima edição de workflow não tem portão nenhum.
      - name: lint dos próprios workflows
        run: node scripts/security/lint-workflows.mjs --dir .github/workflows

      # O `next.config.js` desliga as DUAS verificações dentro do build (`eslint.ignoreDuringBuilds` e
      # `typescript.ignoreBuildErrors`), de propósito: um build de publicação não é o lugar de descobrir
      # lint. A consequência é que, sem estes dois passos, NADA no CI verifica nenhuma das duas — o build
      # passa por cima e a suíte não olha estilo. Eles não são redundantes com o build; são o que o build
      # explicitamente não faz.
      - name: lint
        run: cd packages/storymap-ui && bun run lint

      - name: typecheck
        run: cd packages/storymap-ui && bunx tsc --noEmit

      # O build é o único passo que exercita a RESOLUÇÃO de módulo do webpack e a coleta de rotas — onde
      # moram os defeitos que `tsc` não vê por construção (os `externals` de builtin do Node, uma chave
      # de config que o Next passou a recusar, um import de servidor que vaza para um bundle de cliente).
      # Sem ele, o CI aprovava um commit que não constrói.
      - name: build
        run: cd packages/storymap-ui && bun run build

      # SEGUNDA passada de tipos, e ela NÃO é redundante — cobre um ponto cego medido em 2026-08-25.
      #
      # O contrato de PROPS de página (`params`/`searchParams`, que o Next 15 tornou Promise) só existe
      # em `.next/types/**`, GERADO pelo build, e só entra no `tsc` porque o build também reescreve o
      # `next-env.d.ts` para referenciá-lo. Num clone limpo de CI não há `.next/` quando o typecheck
      # acima roda ⇒ ele não vê esse contrato; e o build não o cobra porque este pacote declara
      # `typescript: { ignoreBuildErrors: true }`. Resultado: duas páginas atravessaram a migração com
      # o tipo errado e os DOIS portões passaram — uma delas com o corpo correto e o tipo para trás,
      # que nem sequer quebrava, e por isso ninguém teria olhado.
      #
      # A primeira passada continua onde está, e de propósito: ela é o retorno RÁPIDO para o erro de
      # tipo comum, antes de pagar os minutos do build.
      - name: typecheck dos tipos GERADOS pelo build (props de página)
        run: cd packages/storymap-ui && bunx tsc --noEmit

      - name: suíte
        run: cd packages/storymap-ui && bunx vitest run

      # Varre a ÁRVORE rastreada — não o índice — com `--fail-on-unscanned`, para que um ponto cego
      # ACIDENTAL reprove em vez de sair como "liberado".
      #
      # SEM lista de exclusão: a árvore inteira é o que se publica (a régua de corte saiu com a issue #1), e a
      # diferença é o ponto todo: aquela régua é a do CORTE, e do lado de cá o corte JÁ ACONTECEU. Aplicá-la
      # aqui subtrai da varredura arquivos que sobreviveram a ela — e a subtração é INVISÍVEL, porque
      # `--fail-on-unscanned` só reprova o ponto cego acidental (teto de bytes, não-regular), nunca a
      # exclusão deliberada.
      #
      # MEDIDO nesta árvore em 2026-08-21, com a régua ligada: 10 dos 1236 arquivos rastreados ficavam fora
      # da varredura — `.github/` INTEIRO (os dois workflows, CODEOWNERS, dependabot), o `.gitignore`, os
      # quatro documentos de raiz (README, AGENTS, SECURITY, CONTRIBUTING) e o golden gerado no destino. É a
      # pior lista possível: a CI é o que roda COM os secrets do repositório, os quatro documentos são o que
      # o adotante lê primeiro, e um golden é uma FOTOGRAFIA da árvore. Prova: uma chave `AKIA…` colada em
      # `.github/workflows/` saía EXIT 0 com a régua e EXIT 2 sem ela.
      - name: oss-snapshot-gate — segredo na árvore publicada
        run: >-
          node scripts/security/scan-snapshot-secrets.mjs
          --tracked-only
          --fail-on-unscanned

  # Título e branch de um PR são texto de terceiro. Este job existe para MOSTRAR o padrão correto de consumo
  # (`env:` + `"$VAR"`, onde o shell trata como dado) — o linter reprova qualquer `run:` que interpole esses
  # contextos direto, então o exemplo canônico precisa viver em algum lugar.
  resumo-do-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: registrar o PR sem deixar o texto virar programa
        env:
          PR_TITULO: ${{ github.event.pull_request.title }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          printf 'PR: %s\n' "$PR_TITULO"
          printf 'branch: %s\n' "$PR_BRANCH"
