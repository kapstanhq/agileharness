  // ════════════════════════════════════════════════════════════════════════════════════════
  //  GRADE + RESIZE (Fase 4) — layoutPanes() escolhe o arranjo pela CONTAGEM; relayout() é a ÚNICA
  //  função de resize (debounce rAF+80ms), com as duas guardas (caixa zero e "mudou?").
  // ════════════════════════════════════════════════════════════════════════════════════════
  var panesEl = document.getElementById("panes");
  var splitX = Number(prefGet("webterm.splitX", 0.5)) || 0.5;   // fração da largura na dobra vertical
  var splitY = Number(prefGet("webterm.splitY", 0.5)) || 0.5;   // fração da altura na dobra horizontal
  var stackMode = !!prefGet("webterm.stackMode", false);        // 2 painéis: empilhados vs. lado a lado
  var lastDragFit = 0;

  function clampFrac(f) { return Math.max(0.05, Math.min(0.95, f)); }

  /** Converte as frações splitX/splitY em px para --sx/--sy, com clamp de 380px/240px por painel
   *  (piso do contrato). Se não couber dois na dimensão, cai na metade. */
  function applySplitVars() {
    var rect = panesEl.getBoundingClientRect();
    var w = Math.max(0, rect.width - 6), h = Math.max(0, rect.height - 6);
    var sx = Math.round(w * splitX);
    if (w >= 760) sx = Math.max(380, Math.min(w - 380, sx)); else sx = Math.floor(w / 2);
    var sy = Math.round(h * splitY);
    if (h >= 480) sy = Math.max(240, Math.min(h - 240, sy)); else sy = Math.floor(h / 2);
    panesEl.style.setProperty("--sx", sx + "px");
    panesEl.style.setProperty("--sy", sy + "px");
  }

  /**
   * Os ARRANJOS possíveis. Antes a grade era derivada da CONTAGEM de painéis — 3 painéis só podiam
   * ser "esquerda inteira + 2 à direita", e não havia como pedir 3 colunas ou deixar um espaço
   * livre. Agora o operador ESCOLHE, e o arranjo escolhido só rearranja o que existe: criar e
   * fechar terminal continuam ações próprias (o layout nunca abre nem mata terminal sozinho).
   *
   * `auto` preserva o comportamento antigo e segue sendo o padrão.
   */
  var MAX_PANES = 4;
  var LAYOUTS = [
    { id: "auto", label: "Auto", slots: 0 },
    { id: "1", label: "Cheio", slots: 1 },
    { id: "2c", label: "1×2", slots: 2 },
    { id: "2r", label: "2×1", slots: 2 },
    { id: "3l", label: "1+2", slots: 3 },
    { id: "3c", label: "1×3", slots: 3 },
    { id: "4", label: "2×2", slots: 4 },
  ];
  function layoutById(id) {
    for (var i = 0; i < LAYOUTS.length; i++) if (LAYOUTS[i].id === id) return LAYOUTS[i];
    return LAYOUTS[0];
  }
  var layoutId = String(prefGet("webterm.layout", "auto") || "auto");
  if (!layoutById(layoutId) || layoutById(layoutId).id !== layoutId) layoutId = "auto";

  /** O arranjo que a grade REALMENTE usa agora — o escolhido, salvo quando a tela não comporta. */
  function effectiveLayout() {
    var total = PANELS.length;
    var cap = displayCapacity();
    if (zoomed || total > cap) return "1";              // zoom manual OU largura estreita
    if (layoutId !== "auto") {
      var lay = layoutById(layoutId);
      // Arranjo mais largo do que a tela comporta cai para 1 — a MESMA régua do corte logo acima,
      // que até aqui só olhava a CONTAGEM de painéis. Escolher 2×2 num celular desenhava quatro
      // células de ~180px; com a vaga visível, três delas seriam convites ilegíveis.
      if (lay.slots > cap) return "1";
      // O layout escolhido não some com painel: se ele tem menos slots do que há painéis, os que
      // sobram viram navegação (a fileira de painéis), como já acontece em tela estreita.
      return lay.slots >= total ? lay.id : autoLayoutFor(total);
    }
    return autoLayoutFor(total);
  }
  function autoLayoutFor(n) {
    if (n <= 1) return "1";
    if (n === 2) return stackMode ? "2r" : "2c";
    if (n === 3) return "3l";
    return "4";
  }
  /** Quantos painéis o arranjo mostra ao mesmo tempo. */
  function visibleSlots(lay) {
    return lay === "1" ? 1 : (lay === "2c" || lay === "2r") ? 2 : (lay === "3l" || lay === "3c") ? 3 : 4;
  }

  /** Posiciona um ITEM da grade — painel ou vaga — na célula `idx` do ARRANJO. */
  function placeEl(el, idx, lay) {
    var s = el.style;
    s.gridColumn = ""; s.gridRow = "";
    if (lay === "1") return;
    if (lay === "2c") { s.gridColumn = idx === 0 ? "1" : "3"; s.gridRow = "1"; return; }
    if (lay === "2r") { s.gridRow = idx === 0 ? "1" : "3"; s.gridColumn = "1"; return; }
    if (lay === "3c") { s.gridColumn = ["1", "3", "5"][idx]; s.gridRow = "1"; return; }
    if (lay === "3l") {
      if (idx === 0) { s.gridColumn = "1"; s.gridRow = "1 / -1"; }        // esquerda inteira
      else if (idx === 1) { s.gridColumn = "3"; s.gridRow = "1"; }        // direita, cima
      else { s.gridColumn = "3"; s.gridRow = "3"; }                        // direita, baixo
      return;
    }
    var cols4 = ["1", "3", "1", "3"], rows4 = ["1", "1", "3", "3"];       // 2×2
    s.gridColumn = cols4[idx]; s.gridRow = rows4[idx];
  }

  /**
   * Distribui os painéis visíveis pelas CÉLULAS do arranjo, devolvendo um array indexado por slot
   * (buracos = vaga). Um painel que nasceu numa vaga específica carrega o índice dela em
   * `panel.slot` e volta para ela sempre que ela existir e estiver livre — é o que faz "criar um
   * terminal NESTE espaço" cumprir a palavra. Quem não tem preferência (ou cuja preferência não
   * cabe no arranjo atual) preenche na ordem, como sempre.
   *
   * `honor` é falso no arranjo `auto`: ali a grade é derivada da CONTAGEM e empacotar na ordem é o
   * comportamento de sempre — honrar preferências faria dois painéis trocarem de lugar sozinhos ao
   * fechar um terceiro.
   */
  function assignSlots(shown, slots, honor) {
    var bySlot = new Array(slots), rest = [];
    for (var i = 0; i < shown.length; i++) {
      var s = honor ? shown[i].slot : null;
      if (typeof s === "number" && s >= 0 && s < slots && !bySlot[s]) bySlot[s] = shown[i];
      else rest.push(shown[i]);
    }
    var next = 0;
    for (var r = 0; r < rest.length; r++) {
      while (next < slots && bySlot[next]) next++;
      if (next >= slots) break;                       // não deve acontecer (shown <= slots), mas não estoura
      bySlot[next] = rest[r];
    }
    return bySlot;
  }

  /** Tira as vagas da grade — elas são reconstruídas a cada layout, como os divisores. */
  function clearVagas() {
    var olds = panesEl.querySelectorAll(".vaga");
    for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
  }

  /**
   * A VAGA de uma célula: o espaço da grade que não tem terminal, com as DUAS saídas que ele
   * precisa ter — CRIAR um terminal aqui, ou trazer para cá um que JÁ EXISTE.
   *
   * Antes o buraco era preto e mudo: um 2×2 com um terminal só mostrava três retângulos sem nada
   * para clicar, e a única forma de preenchê-los era adivinhar que o ⊞ do cabeçalho do vizinho
   * servia para isso. A vaga não é um painel — `PANELS` continua sendo a lista dos terminais
   * ABERTOS (é o que o medidor, a barra de conexão e a grade salva contam). Clicar numa das saídas
   * MATERIALIZA um painel naquele slot; desistir no meio o desfaz e devolve a vaga.
   */
  function buildVaga(idx, lay) {
    var el = document.createElement("div");
    el.className = "vaga";
    var msg = document.createElement("div");
    msg.className = "vaga-msg";
    // A grade INTEIRA vazia é um estado diferente de um espaço sobrando ao lado de um terminal:
    // uma diz "não há nada aberto", a outra diz "sobrou lugar". Mesmos botões, frases diferentes.
    msg.textContent = PANELS.length ? "Espaço livre" : "Nenhum terminal aberto";
    el.appendChild(msg);
    var row = document.createElement("div"); row.className = "vaga-row";
    var mk = document.createElement("button");
    mk.type = "button"; mk.className = "primary"; mk.textContent = "Criar terminal";
    mk.title = "Cria um terminal novo e o abre NESTE espaço";
    mk.addEventListener("click", function () { haptic(8); void slotCreate(idx); });
    var pick = document.createElement("button");
    pick.type = "button"; pick.textContent = "Escolher um terminal";
    pick.title = "Traz para este espaço um terminal que já está rodando";
    pick.addEventListener("click", function () { haptic(8); slotPick(idx); });
    row.appendChild(mk); row.appendChild(pick);
    el.appendChild(row);
    placeEl(el, idx, lay);
    panesEl.appendChild(el);
    return el;
  }

  /** Cria um divisor arrastável no track de 6px da grade. `kind` = vert|horz. */
  function makeDivider(kind, col, row) {
    var d = document.createElement("div");
    d.className = "divider " + kind;
    d.style.gridColumn = col;
    d.style.gridRow = row;
    var dragging = false;
    d.addEventListener("pointerdown", function (e) {
      dragging = true; d.classList.add("dragging");
      try { d.setPointerCapture(e.pointerId); } catch (er) {}
      e.preventDefault();
    });
    d.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var rect = panesEl.getBoundingClientRect();
      if (kind === "vert") splitX = clampFrac((e.clientX - rect.left) / Math.max(1, rect.width));
      else splitY = clampFrac((e.clientY - rect.top) / Math.max(1, rect.height));
      applySplitVars();
      var now = Date.now();                            // throttle o refit durante o arraste
      if (now - lastDragFit >= 100) { lastDragFit = now; for (var i = 0; i < PANELS.length; i++) PANELS[i].fit(); }
    });
    function endDrag() {
      if (!dragging) return;
      dragging = false; d.classList.remove("dragging");
      prefSet("webterm.splitX", splitX); prefSet("webterm.splitY", splitY);
      relayoutNow();                                   // fit final, exato, no pointerup
    }
    d.addEventListener("pointerup", endDrag);
    d.addEventListener("pointercancel", endDrag);
    return d;
  }

  /** Cria os divisores conforme o ARRANJO. */
  function buildDividers(lay) {
    if (lay === "1") return;
    if (lay === "2c") { panesEl.appendChild(makeDivider("vert", "2", "1")); return; }
    if (lay === "2r") { panesEl.appendChild(makeDivider("horz", "1", "2")); return; }
    if (lay === "3c") {
      // Três colunas: dois divisores verticais. Ambos movem o MESMO splitX (a grade é 1fr entre
      // eles), então o arraste fica em um só — o do meio — para não prometer um controle que não há.
      panesEl.appendChild(makeDivider("vert", "2", "1"));
      return;
    }
    if (lay === "3l") {
      panesEl.appendChild(makeDivider("vert", "2", "1 / -1"));            // vertical inteiro
      panesEl.appendChild(makeDivider("horz", "3", "2"));                 // horizontal só à direita
      return;
    }
    panesEl.appendChild(makeDivider("vert", "2", "1 / -1"));              // 2×2: um vertical…
    panesEl.appendChild(makeDivider("horz", "1 / -1", "2"));             // …e um horizontal, compartilhados
  }

  /** (Re)monta a grade: escolhe o arranjo pela contagem, respeitando o zoom e o CORTE por largura
   *  (§2.2 — abaixo do corte, mostra só o painel focado; a fileira de painéis é a navegação). */
  function layoutPanes() {
    var lay = effectiveLayout();
    var slots = visibleSlots(lay);
    var single = lay === "1";
    var focused = focusedPane();
    // VISIBILIDADE: mostra os `slots` primeiros painéis, garantindo o focado entre eles — os demais
    // seguem VIVOS (só display:none) e são alcançáveis pela fileira de painéis.
    // O focado entra PRIMEIRO (ele nunca pode ficar de fora), e o resto preenche até `slots`.
    // ⚠ Nada de `shown.length = n` aqui: atribuir length a um array MENOR não trunca, ele ESTICA
    // com buracos — e um arranjo com mais slots do que painéis (3 painéis em 2×2, que é o caso
    // normal deste seletor) entregava `undefined` ao posicionamento e derrubava o layout inteiro.
    var shown = [];
    if (focused) shown.push(focused);
    for (var v = 0; v < PANELS.length && shown.length < slots; v++) {
      if (PANELS[v] !== focused) shown.push(PANELS[v]);
    }
    // Preserva a ordem original entre os visíveis (o foco não deve reordenar a grade sob o olho).
    shown.sort(function (a, b) { return PANELS.indexOf(a) - PANELS.indexOf(b); });
    for (var w = 0; w < PANELS.length; w++) {
      PANELS[w].el.style.display = shown.indexOf(PANELS[w]) >= 0 ? "" : "none";
    }
    var olds = panesEl.querySelectorAll(".divider");
    for (var i = 0; i < olds.length; i++) olds[i].parentNode.removeChild(olds[i]);
    panesEl.className = "n" + lay;
    if (lay === "1") {
      panesEl.style.gridTemplateColumns = "1fr";
      panesEl.style.gridTemplateRows = "1fr";
    } else if (lay === "2c") {
      panesEl.style.gridTemplateColumns = "var(--sx) 6px 1fr";
      panesEl.style.gridTemplateRows = "1fr";
    } else if (lay === "2r") {
      panesEl.style.gridTemplateColumns = "1fr";
      panesEl.style.gridTemplateRows = "var(--sy) 6px 1fr";
    } else if (lay === "3c") {
      panesEl.style.gridTemplateColumns = "1fr 6px 1fr 6px 1fr";
      panesEl.style.gridTemplateRows = "1fr";
    } else {
      panesEl.style.gridTemplateColumns = "var(--sx) 6px 1fr";
      panesEl.style.gridTemplateRows = "var(--sy) 6px 1fr";
    }
    clearVagas();
    if (single) {
      if (focused) { focused.el.style.gridColumn = ""; focused.el.style.gridRow = ""; }
      // Sem painel nenhum, a célula única É a vaga: é assim que a página se oferece depois que o
      // operador encerra o último terminal (e no primeiro acesso de uma grade salva vazia).
      if (!shown.length) buildVaga(0, lay);
    } else {
      // `auto` empacota na ordem; um arranjo ESCOLHIDO honra a célula em que cada painel nasceu.
      var bySlot = assignSlots(shown, slots, layoutId !== "auto");
      for (var p = 0; p < slots; p++) {
        if (bySlot[p]) { bySlot[p].slot = p; placeEl(bySlot[p].el, p, lay); }
        else buildVaga(p, lay);                      // célula sem terminal: a vaga oferece as saídas
      }
      buildDividers(lay);
    }
    applySplitVars();
    updateZoomButtons(single);
    updateNewTermBtn();
    updateLayoutBtn();
    relayout();
    savePanelLayout();                                    // contagem/arranjo/zoom mudou → persiste a grade
  }

  // ── Viewport / soft-keyboard handling ──────────────────────
  function applyViewportHeight() {
    var vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.getElementById("app").style.height = vh + "px";
  }
  var relayoutTimer = null;
  function relayoutNow() {
    applyViewportHeight();
    applySplitVars();
    for (var i = 0; i < PANELS.length; i++) PANELS[i].fit();
  }
  function relayout() {
    if (relayoutTimer) clearTimeout(relayoutTimer);
    relayoutTimer = setTimeout(function () {
      relayoutTimer = null;
      if (window.requestAnimationFrame) requestAnimationFrame(relayoutNow); else relayoutNow();
    }, 80);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", relayout);
    window.visualViewport.addEventListener("scroll", relayout);
  }
  window.addEventListener("resize", relayout);
  window.addEventListener("orientationchange", function () { setTimeout(relayoutNow, 250); });

  // ── Topo: ícones na mesma linguagem do resto + AÇÃO PRIMÁRIA "novo terminal" à direita ──
  var newTermBtn = null;
  /** O primário CRIA um terminal — e criar nunca depende de haver espaço livre na grade, então ele
   *  não fica mais desabilitado com a tela cheia (era o "não consigo criar o quarto"). Com a grade
   *  cheia o terminal novo abre no painel em foco; o título explica isso antes do clique. */
  function updateNewTermBtn() {
    if (!newTermBtn) return;
    newTermBtn.disabled = false;
    newTermBtn.title = PANELS.length >= MAX_PANES
      ? "Criar um terminal — a grade já tem " + MAX_PANES + " painéis, então ele abre no painel em foco"
      : "Criar um terminal (abre num painel novo)";
  }

  // ── Pictogramas de LAYOUT — o mesmo vocabulário visual das miniaturas do topnav do board ──
  var LAY_CELLS = {
    "auto": null,
    "1":  [[0, 0, 20, 14]],
    "2c": [[0, 0, 9.5, 14], [10.5, 0, 9.5, 14]],
    "2r": [[0, 0, 20, 6.5], [0, 7.5, 20, 6.5]],
    "3c": [[0, 0, 6, 14], [7, 0, 6, 14], [14, 0, 6, 14]],
    "3l": [[0, 0, 9.5, 14], [10.5, 0, 9.5, 6.5], [10.5, 7.5, 9.5, 6.5]],
    "4":  [[0, 0, 9.5, 6.5], [10.5, 0, 9.5, 6.5], [0, 7.5, 9.5, 6.5], [10.5, 7.5, 9.5, 6.5]],
  };
  /** SVG do arranjo: retângulos que DESENHAM a divisão — um pictograma lê mais rápido que "2x2". */
  function layIcon(id) {
    var cells = LAY_CELLS[id];
    if (!cells) {
      // "auto" não tem uma forma fixa: é um retângulo tracejado, "o que couber".
      return '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">'
        + '<rect x="0.6" y="0.6" width="18.8" height="12.8" rx="1.6" fill="none" stroke="currentColor"'
        + ' stroke-width="1.2" stroke-dasharray="3 2"/></svg>';
    }
    var r = "";
    for (var i = 0; i < cells.length; i++) {
      var c = cells[i];
      r += '<rect class="cell" x="' + c[0] + '" y="' + c[1] + '" width="' + c[2] + '" height="' + c[3] + '" rx="1.4"/>';
    }
    return '<svg width="20" height="14" viewBox="0 0 20 14" aria-hidden="true">' + r + "</svg>";
  }

  var layoutBtn = null, layoutMenu = null;
  function updateLayoutBtn() {
    if (!layoutBtn) return;
    var eff = effectiveLayout();
    layoutBtn.innerHTML = layIcon(layoutId === "auto" ? eff : layoutId);
    var chosen = layoutById(layoutId);
    layoutBtn.title = layoutId === "auto"
      ? "Layout: automático (agora " + layoutById(eff).label + ") — clique para escolher"
      : "Layout: " + chosen.label + (visibleSlots(eff) < PANELS.length
          ? " — não cabem todos os painéis nesta largura, os outros estão na fileira"
          : "");
  }
  function closeLayoutMenu() {
    if (layoutMenu) { try { layoutMenu.parentNode.removeChild(layoutMenu); } catch (e) {} layoutMenu = null; }
  }
  function openLayoutMenu() {
    closeLayoutMenu();
    layoutMenu = document.createElement("div");
    layoutMenu.id = "layoutmenu";
    LAYOUTS.forEach(function (l) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lay-opt" + (l.id === layoutId ? " current" : "");
      b.innerHTML = layIcon(l.id) + "<span>" + l.label + "</span>";
      b.title = l.id === "auto"
        ? "Deixa o arranjo seguir a quantidade de painéis"
        : l.label + " — " + l.slots + (l.slots === 1 ? " painel" : " painéis") + " na tela";
      b.addEventListener("click", function () {
        layoutId = l.id;
        prefSet("webterm.layout", layoutId);
        closeLayoutMenu();
        layoutPanes();
        renderPaneRow();
      });
      layoutMenu.appendChild(b);
    });
    document.body.appendChild(layoutMenu);
    var r = layoutBtn.getBoundingClientRect();
    layoutMenu.style.top = Math.round(r.bottom + 6) + "px";
    var w = layoutMenu.offsetWidth || 220;
    layoutMenu.style.left = Math.max(6, Math.round(Math.min(r.left, window.innerWidth - w - 6))) + "px";
    setTimeout(function () {
      document.addEventListener("click", onDocClickLayout, true);
    }, 0);
  }
  function onDocClickLayout(e) {
    if (layoutMenu && !layoutMenu.contains(e.target) && e.target !== layoutBtn) {
      closeLayoutMenu();
      document.removeEventListener("click", onDocClickLayout, true);
    }
  }
  (function initTopBar() {
    var back = document.querySelector("#bar .back");
    if (back) back.innerHTML = svgIcon("chevron-left", 17);
    var rc = document.getElementById("reconnect");
    if (rc) { rc.innerHTML = svgIcon("rotate-cw", 14); rc.title = "Reconectar painéis offline"; }
    var bar = document.getElementById("bar");
    // O seletor de LAYOUT fica à esquerda do primário: arranjar a tela e abrir mais um terminal são
    // as duas ações da barra, e ficam lado a lado em vez de escondidas em menus diferentes.
    layoutBtn = document.createElement("button");
    layoutBtn.type = "button"; layoutBtn.id = "layoutbtn";
    layoutBtn.setAttribute("aria-label", "Escolher o layout da tela");
    layoutBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (layoutMenu) { closeLayoutMenu(); return; }
      openLayoutMenu();
    });
    if (bar) bar.appendChild(layoutBtn);
    updateLayoutBtn();

    newTermBtn = document.createElement("button");
    newTermBtn.type = "button"; newTermBtn.id = "newterm";
    newTermBtn.innerHTML = svgIcon("plus", 15) + '<span class="nt-label">Novo terminal</span>';
    // CRIA o terminal — não "divide a tela e pergunta qual mostrar", que era o que o rótulo prometia
    // e a função não fazia.
    newTermBtn.addEventListener("click", function () { void createSessionFlow(); });
    if (bar) bar.appendChild(newTermBtn);
    updateNewTermBtn();
  })();

  // Reconectar TODOS os painéis offline (Fase 6). Se nenhum estiver offline, reconecta o focado.
  document.getElementById("reconnect").addEventListener("click", function () {
    var any = false;
    for (var i = 0; i < PANELS.length; i++) {
      if (PANELS[i].connKind !== "ok") { PANELS[i].reconnectNow(); any = true; }
    }
    if (!any) { var p = focusedPane(); if (p) p.reconnectNow(); }
  });

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  BOOTSTRAP — cria o painel inicial, monta e conecta.
  // ════════════════════════════════════════════════════════════════════════════════════════
  var host = document.getElementById("panes");

  // Restaura a GRADE deixada (sessões + foco + arranjo), não só a última sessão — quem saiu com 2/3/4
  // terminais na tela volta com eles no mesmo layout. Um `?b=` explícito (link do Processos, botão
  // "Terminal") pede UM terminal: se ele estiver na grade salva, restaura a grade e foca nele; se
  // não, abre só ele (o comportamento antigo de painel único, que ainda pode CRIAR se não existir).
  var savedLayout = prefGet("webterm.panels", null);
  var savedGrid = !!(savedLayout && Array.isArray(savedLayout.sessions));
  var savedRaw = savedGrid ? savedLayout.sessions : [];
  var savedSlotsRaw = (savedLayout && Array.isArray(savedLayout.slots)) ? savedLayout.slots : [];
  // Nome e SLOT andam em par (o slot é a célula em que o terminal estava): filtrar os dois no mesmo
  // laço é o que impede que um nome inválido no meio desalinhe as células de todos os seguintes.
  var savedSessions = [], savedSlots = [];
  for (var sv = 0; sv < savedRaw.length && savedSessions.length < 4; sv++) {
    var svName = savedRaw[sv];
    if (typeof svName !== "string" || !isSlug(svName) || savedSessions.indexOf(svName) >= 0) continue;
    savedSessions.push(svName);
    savedSlots.push(typeof savedSlotsRaw[sv] === "number" ? savedSlotsRaw[sv] : -1);
  }

  var explicitB = "";
  try {
    var qb = new URLSearchParams(location.search).get("b") || "";
    if (isSlug(qb)) explicitB = qb;
  } catch (e) {}

  var bootSessions, focusSession, restoredMode, bootSlots = null;
  if (explicitB && (savedSessions.length <= 1 || savedSessions.indexOf(explicitB) < 0)) {
    // Link explícito para um terminal que não faz parte de uma grade salva → abre só ele, e NÃO
    // sobrescreve a grade de trabalho salva (o link pode ser uma aba nova sobre o mesmo storage).
    bootSessions = [explicitB]; focusSession = explicitB; restoredMode = false;
    suppressLayoutSave = true;
  } else if (savedSessions.length) {
    // Grade salva (com ou sem um ?b= que aponta para dentro dela) → restaura a grade inteira.
    bootSessions = savedSessions;
    focusSession = explicitB
      || (savedLayout && typeof savedLayout.focused === "string" && savedSessions.indexOf(savedLayout.focused) >= 0
          ? savedLayout.focused : savedSessions[0]);
    restoredMode = true;
    bootSlots = savedSlots;
    if (typeof savedLayout.stack === "boolean") stackMode = savedLayout.stack;
  } else if (savedGrid) {
    // Grade salva VAZIA: o operador encerrou o último terminal e saiu assim. Abrir um `shell` por
    // conta própria desfaria a escolha dele — a página volta com a VAGA, que é onde ele decide.
    bootSessions = []; focusSession = ""; restoredMode = false;
  } else {
    // Sem grade salva: painel único do ?b= / última sessão / shell (o comportamento de antes).
    bootSessions = [BOOT_SESSION]; focusSession = BOOT_SESSION; restoredMode = SESSION_RESTORED;
  }

  var firstPanel = null, focusTarget = null;
  for (var bi = 0; bi < bootSessions.length; bi++) {
    var pnl = createPanel(bootSessions[bi], host, restoredMode);
    if (bootSlots && typeof bootSlots[bi] === "number" && bootSlots[bi] >= 0) pnl.slot = bootSlots[bi];
    if (!firstPanel) firstPanel = pnl;
    if (!focusTarget && bootSessions[bi] === focusSession) focusTarget = pnl;
  }
  focusPanel(focusTarget || firstPanel);
  if (savedLayout && savedLayout.zoom && PANELS.length > 1) zoomed = true;
  layoutPanes();
  renderAllHeads();
  paintConn();
  try {
    document.title = "AgileHarness · Terminal" + (PANELS.length === 1 && focusSession ? " · " + focusSession : "");
  } catch (e) {}

  // Re-fit when fonts settle, then connect every panel.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { setTimeout(relayoutNow, 30); });
  setTimeout(relayoutNow, 80);
  for (var ci = 0; ci < PANELS.length; ci++) PANELS[ci].connect();

  // Identidade + abas ao vivo (5s). Barato para um único operador; o serviço serve tudo numa resposta.
  pollSessions();
  setInterval(pollSessions, 5000);

  // Medidor: cadência PRÓPRIA, mais lenta. Em aba oculta não adianta medir; ao voltar, mede na hora.
  pollMeter();
  setInterval(function () { if (!document.hidden) pollMeter(); }, 15000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden) pollMeter(); });
})();
</script>
</body>
</html>
