<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0b0b0d" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>AgileHarness · Terminal</title>
<link rel="stylesheet" href="/terminal/vendor/xterm.css" />
<style>
  :root {
    --bg: #0b0b0d;
    --panel: #141417;
    --line: #26262b;
    --fg: #e6e6e6;
    --muted: #9a9aa2;
    --accent: #c0c542;       /* chartreuse mnemonic */
    --key: #1c1c21;
    --key-active: #2a2a31;
    --ok: #5bd66f;
    --warn: #f0b429;
    --err: #f0506e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; margin: 0; background: var(--bg); color: var(--fg);
    overflow: hidden; overscroll-behavior: none;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  /* ── Top status bar ─────────────────────────────────────── */
  #bar {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; padding-top: max(8px, env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 12px; user-select: none;
  }
  #bar a.back { color: var(--muted); text-decoration: none; font-size: 13px; padding: 4px 6px; border-radius: 6px; }
  #bar a.back:active { background: var(--key-active); }
  #title { font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
  #title b { color: var(--accent); font-weight: 600; }
  #sess { color: var(--muted); white-space: nowrap; }
  #status { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); box-shadow: 0 0 0 0 rgba(0,0,0,0); }
  #dot.ok { background: var(--ok); }
  #dot.warn { background: var(--warn); }
  #dot.err { background: var(--err); }
  #reconnect {
    appearance: none; border: 1px solid var(--line); background: var(--key); color: var(--fg);
    border-radius: 6px; font-size: 12px; padding: 4px 8px; cursor: pointer;
  }
  #reconnect:active { background: var(--key-active); }

  /* ── Terminal ───────────────────────────────────────────── */
  /* #panes é o HOST da grade de painéis — um CSS grid cujo arranjo (1 · 2 colunas · 2 linhas ·
     1+2 · 2×2) o script escolhe pela CONTAGEM de painéis (não é árvore de splits: com teto de 4 há
     exatamente 4 arranjos). As faixas --sx/--sy são as dobras arrastáveis. */
  #panes {
    flex: 1 1 auto; min-height: 0; position: relative; background: var(--bg);
    display: grid; gap: 0;
    grid-template-columns: 1fr; grid-template-rows: 1fr;
    --sx: 50%; --sy: 50%;
  }
  /* Cada painel é um item da grade. O arrasto vertical é NOSSO (vira roda sintética — ver "Rolagem
     por toque" no script): touch-action:none no painel e no corpo, senão o navegador tenta rolar a
     página / puxar-para-recarregar e o gesto se perde. */
  .pane { position: relative; min-width: 0; min-height: 0; overflow: hidden; touch-action: none; background: var(--bg); }
  /* O corpo do terminal deixa 26px no topo para o cabeçalho do painel (altura CONSTANTE em toda
     densidade — o que muda por largura é quais chips aparecem, nunca a altura, senão refit em
     cascata a cada repintura de 5s). */
  .pane-body { position: absolute; top: 26px; left: 0; right: 0; bottom: 0; padding: 4px 4px 0; touch-action: none; }
  .xterm .xterm-viewport { overscroll-behavior: contain; }

  /* ── Cabeçalho do painel (26px) — é aqui que mora o layout (Fase 5) ── */
  .pane-head {
    position: absolute; top: 0; left: 0; right: 0; height: 26px; z-index: 4;
    display: flex; align-items: center; gap: 6px; padding: 0 6px;
    background: var(--panel); border-bottom: 1px solid var(--line);
    font-size: 11px; color: var(--muted); user-select: none; white-space: nowrap; overflow: hidden;
  }
  .pane-head .ph-conn { width: 8px; height: 8px; border-radius: 50%; background: var(--warn); flex: 0 0 auto; }
  .pane-head .ph-conn.ok { background: var(--ok); }
  .pane-head .ph-conn.warn { background: var(--warn); }
  .pane-head .ph-conn.err { background: var(--err); }
  .pane-head .ph-name {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--fg);
    font: inherit; font-weight: 600; border-radius: 6px; padding: 1px 5px; cursor: pointer;
    max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 1 auto;
  }
  .pane-head .ph-name:hover { background: var(--key-active); }
  /* O ▾ é um alvo PRÓPRIO, separado do nome. Antes os dois eram o mesmo botão e disputavam o
     clique: um toque trocava o terminal, dois renomeavam — então renomear passava por um timer de
     220ms e, quando o segundo clique atrasava, o seletor abria por cima do campo de renomear. São
     duas ações, agora são dois botões: o ▾ troca o terminal, o nome renomeia. */
  .pane-head .ph-chev {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 6px; padding: 1px 2px; cursor: pointer; flex: 0 0 auto;
    display: inline-flex; align-items: center; touch-action: manipulation;
  }
  .pane-head .ph-chev:hover { background: var(--key-active); color: var(--fg); }
  /* Alvo de toque decente no celular sem engordar a linha no desktop. */
  .mode-touch .pane-head .ph-chev { padding: 3px 5px; }
  .pane-head .ph-focus { color: var(--accent); font-weight: 600; flex: 0 0 auto; }
  .pane-head .ph-chip { color: var(--muted); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  .pane-head .ph-chip.card { color: var(--accent); flex: 0 0 auto; }
  .pane-head .ph-chip.branch { font-family: ui-monospace, Menlo, Consolas, monospace; flex: 0 0 auto; }
  .pane-head .ph-chip.branch.dirty { color: var(--warn); }
  .pane-head .ph-chip.cost { flex: 0 0 auto; }

  /* BOARD — a que recorte do produto este terminal pertence. Era a pergunta que esta tela não
     respondia: o operador via 3 terminais aqui e nenhum na home de board nenhum, sem nada na
     interface explicando por quê. Um terminal SEM board (`.none`) recua mas não some — é o convite
     a vincular, e é justamente o estado que precisava virar visível.
     Clicável = editável (vínculo manual). Travado = o board vem do card/da frota; aí o chip é texto
     com um `title` dizendo de onde veio, porque trocá-lo faria a home de um board listar o terminal
     do card de outro (ver BoardSource em lib/vps/types). */
  .pane-head .ph-chip.board { flex: 0 0 auto; color: var(--accent); }
  .pane-head .ph-chip.board.none { color: var(--muted); opacity: .7; }
  .pane-head .ph-chip.board.pick {
    cursor: pointer; border-radius: 5px; padding: 0 4px; margin: 0 -2px;
    border: 1px dashed transparent;
  }
  .pane-head .ph-chip.board.pick:hover { background: var(--key-active); border-color: var(--line); }
  .pane-head .ph-chip.board.pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Contexto: chip de largura fixa, primeiro da fila e o único que a largura estreita não corta —
     com 3-4 painéis abertos é o número que diz qual agente está prestes a compactar. */
  .pane-head .ph-chip.ctx { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
  .pane-head .ph-chip.ctx.warm { color: var(--warn); }
  .pane-head .ph-chip.ctx.hot { color: var(--err); font-weight: 600; }
  .pane-head .ph-chip.ctx.dim { opacity: .6; }
  /* Leitura de contexto VELHA: o número FICA (some seria pior), mas marcado — o medidor mede a cada
     15s e uma sessão que acabou de ser limpa passa alguns segundos exibindo o número anterior. */
  .pane-head .ph-chip.ctx.old { opacity: .5; }

  /* ESTADO do agente daquele painel — a MESMA régua da home e do /processes (deriveWorkState). Esta
     era a única tela em que o operador OLHA para o terminal e não sabia dizer se ele trabalha ou
     espera por ele. Prominência NÃO é uniforme: "aguardando você" é o único estado com um gesto a
     tomar, e é o único que ganha cor; "trabalhando" é movimento sem ênfase; "ocioso" recua. */
  .pane-head .ph-chip.state { flex: 0 0 auto; }
  .pane-head .ph-chip.state.work { color: var(--fg); }
  .pane-head .ph-chip.state.work::before {
    content: ""; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--accent); margin-right: 5px; vertical-align: middle;
    animation: ph-pulse 1.4s ease-in-out infinite;
  }
  .pane-head .ph-chip.state.you { color: var(--accent); font-weight: 600; }
  .pane-head .ph-chip.state.err { color: var(--err); font-weight: 600; }
  .pane-head .ph-chip.state.idle { opacity: .65; }
  @keyframes ph-pulse { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }
  /* Quem prefere a máquina quieta não ganha um ponto piscando para sempre no cabeçalho. */
  @media (prefers-reduced-motion: reduce) {
    .pane-head .ph-chip.state.work::before { animation: none; opacity: .9; }
  }
  /* A frase "o que este terminal está fazendo" é o dado que o operador lê de relance ao lado do
     nome — então é ela que ganha o espaço elástico e trunca com reticências; os demais chips têm
     largura fixa e cedem primeiro. */
  .pane-head .ph-chip.phrase { flex: 1 1 auto; min-width: 0; }
  .pane-head .ph-actions { margin-left: auto; display: flex; align-items: center; gap: 1px; flex: 0 0 auto; }
  .pane-head .ph-btn {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 6px; width: 24px; height: 22px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 13px; cursor: pointer; touch-action: manipulation; padding: 0;
  }
  .pane-head .ph-btn:hover:not([disabled]) { background: var(--key-active); color: var(--fg); }
  .pane-head .ph-btn[disabled] { opacity: .32; cursor: not-allowed; }
  .pane-head .ph-btn.close:hover:not([disabled]) { color: var(--err); }

  /* Estreito (< 560px de painel — que é o normal com 3-4 painéis abertos): some o dado secundário
     (custo/branch/"em foco"); o rótulo, a frase "o que faz" E o contexto ficam. O chip inteiro some,
     nunca vira sigla — a exceção é o CONTEXTO, que encolhe o rótulo para "Ctx 63%" (feito no JS) em
     vez de sumir: ele foi cortado justamente na largura em que mais importa, e era por isso que com
     três terminais na tela não aparecia nenhum percentual.
     O BOARD fica (não entra nesta lista): é identidade, não detalhe — some dele e a tela volta a
     não responder "de quem é este terminal" —, e o rótulo é curto o bastante para caber. */
  .pane.narrow .pane-head .ph-chip.cost,
  .pane.narrow .pane-head .ph-chip.branch,
  .pane.narrow .pane-head .ph-focus { display: none; }

  /* Painel encerrado por fora: renderiza um cartão, nunca derruba os outros. */
  .pane-dead {
    position: absolute; top: 26px; left: 0; right: 0; bottom: 0; z-index: 3;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
    background: var(--bg); color: var(--muted); text-align: center; padding: 16px;
  }
  .pane.dead .pane-dead { display: flex; }
  .pane.dead .pane-body { display: none; }
  .pane-dead .msg { font-size: 13px; color: var(--fg); }
  .pane-dead .row { display: flex; gap: 8px; }
  .pane-dead button {
    appearance: none; background: var(--key); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .pane-dead button:hover { background: var(--key-active); }

  /* ── VAGA: uma célula da grade SEM terminal ───────────────────────────────────────────────
     A grade tem SLOTS, e um slot pode estar vazio. Antes não podia: fechar a última vista era
     recusado ("sempre fica pelo menos um painel aberto"), e as células que sobravam num arranjo
     maior que a contagem de painéis (um 2×2 com um terminal só) ficavam pretas e MUDAS — o
     operador via o buraco e não tinha o que clicar nele. A vaga é esse buraco com as duas saídas
     que ele sempre precisou ter: criar um terminal aqui, ou trazer um que já existe para cá. */
  .vaga {
    position: relative; min-width: 0; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--bg); text-align: center; padding: 12px;
  }
  /* O tracejado é a diferença entre "vazio de propósito" e "quebrou": ele desenha o espaço
     disponível sem fingir que ali existe um painel. */
  .vaga::before {
    content: ""; position: absolute; inset: 6px; border: 1px dashed var(--line);
    border-radius: 12px; pointer-events: none;
  }
  .vaga .vaga-msg {
    font-size: 12px; color: var(--muted);
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .vaga .vaga-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .vaga button {
    appearance: none; background: var(--key); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .vaga button:hover { background: var(--key-active); }
  .vaga button.primary { background: var(--accent); color: #14140a; border-color: var(--accent); font-weight: 600; }
  .vaga button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  /* Célula pequena (2×2 num monitor comum já dá ~400px): a frase sai, os botões ficam — o que
     importa é a AÇÃO, e ela cabe. */
  @media (max-height: 420px) { .vaga .vaga-msg { display: none; } }

  /* Avisos da PÁGINA — só existem quando não há painel para falar por eles (a grade ficou vazia).
     O aviso normal mora dentro do painel a que se refere; encerrar o ÚLTIMO terminal não tem mais
     painel onde escrever, e sem esta camada o gesto ficaria mudo. Mesma pele do aviso de painel. */
  #pagetoasts {
    position: fixed; top: 46px; right: 10px; z-index: 60;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-width: min(88%, 460px); pointer-events: none;
  }

  /* Divisor arrastável — ocupa o track de 6px da grade entre dois painéis. */
  .divider { z-index: 6; background: var(--line); align-self: stretch; justify-self: stretch; touch-action: none; }
  .divider:hover, .divider.dragging { background: var(--accent); }
  .divider.vert { cursor: col-resize; }
  .divider.horz { cursor: row-resize; }
  /* ── Sinal de foco (Fase 2) — só faz sentido com mais de um painel, então é gated por
     .has-multi (com um painel só a página fica visualmente idêntica à de antes). Três camadas:
     borda de acento no focado (inset box-shadow: não empurra layout), conteúdo dos não-focados a
     0.78 (nunca o fundo, nunca < 0.75 — são os Claudes que você vigia), e a palavra "em foco" no
     cabeçalho (Fase 5). */
  .has-multi .pane.focused { box-shadow: inset 0 0 0 2px var(--accent); }
  .has-multi .pane:not(.focused) .pane-body { opacity: .78; }
  /* O foco precisava ser lido de RELANCE, e uma borda de 2px num painel que já tem borda não era
     suficiente com 3 ou 4 painéis na tela. Três reforços, todos no CABEÇALHO (nunca no conteúdo do
     terminal — é ele que você está lendo): o cabeçalho do focado ganha a tinta de acento, um filete
     de acento no topo, e o nome fica claro. Os não-focados recuam. */
  .has-multi .pane.focused .pane-head {
    background: color-mix(in srgb, var(--accent) 13%, var(--panel));
    border-bottom-color: color-mix(in srgb, var(--accent) 42%, var(--line));
    box-shadow: inset 0 2px 0 0 var(--accent);
  }
  .has-multi .pane.focused .pane-head .ph-name { color: var(--fg); }
  .has-multi .pane:not(.focused) .pane-head { opacity: .72; }
  .has-multi .pane:not(.focused) .pane-head .ph-name { color: var(--muted); font-weight: 500; }

  /* Pílula "voltar ao fim" — enquanto o dedo levou a tela para o histórico (por painel). */
  .tobottom {
    position: absolute; z-index: 30; left: 50%; transform: translateX(-50%); bottom: 12px;
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    border-radius: 999px; padding: 8px 15px; font-size: 12.5px; font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,.5); cursor: pointer; touch-action: manipulation;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .tobottom[hidden] { display: none; }
  .tobottom:active { background: var(--key-active); }
  /* ── Avisos da página sobre um painel (upload de imagem, fila offline, terminal criado/encerrado).
     São um ELEMENTO sobre o painel, nunca texto escrito no terminal: o TUI do outro lado não sabe de
     linha que não veio dele, e escrever no buffer embaralhava a tela dele (ver `toast` no script).
     Empilham no alto à direita, longe do prompt (embaixo) e da pílula "voltar ao fim" (no centro). */
  .pane-toasts {
    position: absolute; top: 32px; right: 10px; z-index: 36;
    display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
    max-width: min(88%, 460px); pointer-events: none;
  }
  .pane-toast {
    pointer-events: auto; cursor: pointer;
    background: color-mix(in srgb, var(--panel) 94%, transparent);
    color: var(--fg); border: 1px solid var(--line); border-left: 3px solid var(--warn);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; line-height: 1.35;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); overflow-wrap: anywhere;
    transition: opacity .18s ease, transform .18s ease;
  }
  .pane-toast.out { opacity: 0; transform: translateY(-4px); }
  /* A PERGUNTA (encerrar um terminal) usa o corpo do aviso, mas não é um aviso: não some sozinha, não
     se dispensa com um clique solto, e traz os botões. Fica aqui, sobre o painel, porque escrever no
     buffer do xterm embaralha o TUI do outro lado (ver `toast` no script) e um confirm() do navegador
     não sabe dizer QUAL painel perguntou. */
  .pane-confirm { cursor: default; border-left-color: var(--err); max-width: 340px; }
  .pane-confirm .row { display: flex; gap: 6px; justify-content: flex-end; margin-top: 8px; }
  .pane-confirm button {
    font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer;
    background: transparent; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 9px;
  }
  .pane-confirm button:hover { background: color-mix(in srgb, var(--fg) 10%, transparent); }
  .pane-confirm button.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 45%, transparent); }
  .pane-confirm button.danger:hover { background: color-mix(in srgb, var(--err) 16%, transparent); }
  .pane-confirm button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .pane-toast.ok { border-left-color: var(--ok); }
  .pane-toast.err { border-left-color: var(--err); }
  .pane-toast.warn { border-left-color: var(--warn); }
  .pane-toast.info { border-left-color: var(--accent); }

  /* Drag-over affordance (desktop drop an image) — por corpo de painel */
  .pane-body.dropping::after {
    content: "soltar imagem aqui"; position: absolute; inset: 8px; z-index: 40;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed var(--accent); border-radius: 12px; color: var(--accent);
    background: rgba(192,197,66,.08); font-size: 14px; font-weight: 600; pointer-events: none;
  }

  /* ── Key / utility bar ──────────────────────────────────── */
  #keys {
    flex: 0 0 auto; background: var(--panel); border-top: 1px solid var(--line);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 6px; user-select: none;
  }
  .krow { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .krow::-webkit-scrollbar { display: none; }
  .krow[hidden] { display: none; }
  .key {
    flex: 1 0 auto; min-width: 42px; min-height: 40px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--key); color: var(--fg); border: 1px solid var(--line);
    border-radius: 9px; font-size: 14px; font-weight: 500;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    cursor: pointer; touch-action: manipulation; transition: background .08s, transform .05s;
  }
  .key:active { background: var(--key-active); transform: translateY(1px); }
  .key.wide { min-width: 64px; }
  .key.send { background: var(--accent); color: #14140a; border-color: var(--accent); font-weight: 700; }
  .key.send:active { filter: brightness(.92); }
  .key.armed { background: var(--accent); color: #14140a; border-color: var(--accent); }
  .key.subtle { color: var(--muted); font-size: 13px; }
  .key.cam { font-size: 16px; }
  #hint { color: var(--muted); font-size: 12px; align-self: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ── Ícones inline (lucide) + refinamentos da toolbar/topo ──────────────────────────────
     Um só sistema de ícones (traço 2px, currentColor → herda a cor do botão em claro/escuro),
     na mesma linguagem visual do resto da aplicação (o maximize/chevron do board). */
  .ic { display: block; flex: 0 0 auto; }
  .key { gap: 6px; }
  .key .klabel { font-size: 12.5px; line-height: 1; }
  .pane-head .ph-btn .ic { width: 15px; height: 15px; }
  #bar .back { display: inline-flex; align-items: center; }
  #reconnect { display: inline-flex; align-items: center; }

  /* Nome do painel: chevron + rótulo; duplo-clique abre o campo de renomear inline. */
  .pane-head .ph-name { display: inline-flex; align-items: center; gap: 4px; }
  .pane-head .ph-name .ph-name-txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .ph-name-edit {
    appearance: none; background: var(--bg); border: 1px solid var(--accent); color: var(--fg);
    font: inherit; font-weight: 600; border-radius: 6px; padding: 1px 5px; outline: none;
    max-width: 60vw; min-width: 90px; flex: 0 1 auto;
  }

  /* Ação primária no topo, à direita: abrir um novo terminal. */
  /* Seletor de layout: mesma altura do primário, peso visual bem menor — arranjar a tela é frequente
     mas nunca é a ação principal. O pictograma É o rótulo. */
  #layoutbtn {
    margin-left: auto; appearance: none; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); background: var(--key); color: var(--muted);
    border-radius: 7px; padding: 4px 8px; cursor: pointer; font-family: inherit;
  }
  #layoutbtn:hover { background: var(--key-active); color: var(--fg); }
  #newterm {
    margin-left: 4px; appearance: none; display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--accent); background: var(--accent); color: #14140a;
    border-radius: 7px; font-size: 12px; font-weight: 700; padding: 4px 10px; cursor: pointer;
    white-space: nowrap; font-family: inherit;
  }
  #newterm:hover { filter: brightness(1.06); }
  #newterm:active { filter: brightness(.92); }
  #newterm[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
  #newterm .ic { width: 15px; height: 15px; }
  .mode-touch #newterm { padding: 5px 8px; }
  .mode-touch #newterm .nt-label { display: none; }   /* no celular fica só o + */

  /* Abas de painel: ✕ como ícone consistente. */
  .tab .tclose { display: inline-flex; align-items: center; }
  .tab .tclose .ic { width: 12px; height: 12px; }

  /* Desktop: a barra de utilidades fica ~20% menor que o padrão — tamanho REAL (botões, ícones e
     rótulos reduzidos), então a altura do #keys ACOMPANHA. Estático: sem hover, sem animação. */
  .mode-desktop #row-util .key {
    min-height: 32px; min-width: 34px; border-radius: 7px; font-size: 12px; gap: 5px;
  }
  .mode-desktop #row-util .key .klabel { font-size: 11px; }
  .mode-desktop #row-util .key .ic { width: 13px; height: 13px; }

  /* Desktop: a physical keyboard already does Esc/Tab/arrows/Ctrl, so the on-screen TUI
     keys are noise. We render only the things a keyboard can't do (move images/text in &
     out) and let the buttons keep their natural width instead of stretching the row. */
  .mode-desktop .key { flex: 0 0 auto; }

  /* Touch: a fileira de UTILIDADES é a mesma do desktop, e fica mais baixa/compacta que a das
     teclas TUI — as duas convivem sem comer o terminal com o teclado virtual aberto. */
  .mode-touch #row-util .key { flex: 0 0 auto; min-height: 34px; font-size: 13px; padding: 0 10px; }
  .mode-touch #row-util .key.cam { font-size: 15px; }
  /* Numa tela de 390px o "AgileHarness › Terminal" empurrava o estado da conexão para fora da barra —
     e o chip da sessão já diz, melhor, em que terminal você está. */
  .mode-touch #title { display: none; }

  /* Teclas TUI: a fileira ROLA, mas "⏎ enviar" NÃO — é a tecla mais usada da tela e estava
     saindo pela direita. Fica ancorada fora da área que rola. */
  #row-tui { display: flex; gap: 6px; align-items: stretch; }
  #row-tui[hidden] { display: none; }
  #row-main { flex: 1 1 auto; min-width: 0; }
  #row-send { flex: 0 0 auto; display: flex; gap: 6px; }

  /* ── Session picker (o chip "tmux: x" da barra vira um menu) ─ */
  #sess {
    appearance: none; border: 1px solid var(--line); background: var(--key); color: var(--muted);
    border-radius: 999px; font-size: 12px; padding: 3px 9px; cursor: pointer; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #sess:active, #sess.armed { background: var(--key-active); color: var(--fg); }
  /* O modal #sessmenu foi APAGADO: a paleta (#palette) é o seletor ÚNICO. Ele existia em paralelo
     com a paleta fazendo a mesma coisa — e como abria no CLIQUE do nome do painel, atravessava o
     duplo-clique de renomear (o gesto que o operador realmente queria ali). Ver a nota no #palette. */

  /* ── Busca no scrollback (addon-search) ─────────────────── */
  #find {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  #find[hidden] { display: none; }
  #find input {
    flex: 1 1 auto; min-width: 0; appearance: none; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 13px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  #find input:focus { outline: none; border-color: var(--accent); }
  #find button {
    appearance: none; background: var(--key); color: var(--fg); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer; touch-action: manipulation;
  }
  #find button:active { background: var(--key-active); }
  #find .count { color: var(--muted); font-size: 12px; min-width: 40px; text-align: center; }

  /* ── Gaveta de atalhos (comando + o que ele faz) ─────────── */
  #row-snips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  #row-snips::-webkit-scrollbar { display: none; }
  #row-snips[hidden] { display: none; }
  .snip {
    flex: 0 0 auto; display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    justify-content: center; min-height: 40px;
    background: var(--key); border: 1px solid var(--line); border-radius: 9px;
    padding: 5px 10px; cursor: pointer; touch-action: manipulation; text-align: left;
  }
  .snip:active { background: var(--key-active); transform: translateY(1px); }
  .snip .cmd {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 600; color: var(--fg); white-space: nowrap;
  }
  .snip .what { font-size: 10.5px; color: var(--muted); white-space: nowrap; }

  /* ── Selectable-text overlay ────────────────────────────── */
  /* The terminal renders to a canvas, so on touch there's no native text
     selection. This overlay surfaces the scrollback as REAL selectable text
     (long-press → native copy menu) on top of the live terminal. */
  #textovl {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: stretch; justify-content: center;
    background: rgba(0,0,0,.55);
    padding: max(8px, env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom));
  }
  #textovl[hidden] { display: none; }
  #textovl-panel {
    display: flex; flex-direction: column; min-height: 0;
    width: 100%; max-width: 900px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden;
  }
  #textovl-head {
    flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-bottom: 1px solid var(--line); user-select: none;
  }
  #textovl-title { font-size: 13px; font-weight: 600; color: var(--fg); letter-spacing: -0.01em; }
  .ovl-btn {
    appearance: none; border: 1px solid var(--line); background: var(--key); color: var(--fg);
    border-radius: 8px; font-size: 13px; padding: 6px 10px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
  }
  .ovl-btn:active { background: var(--key-active); }
  .ovl-btn.armed { background: var(--accent); color: #14140a; border-color: var(--accent); }
  #textovl-copy { margin-left: auto; }
  .ovl-x { color: var(--muted); padding: 6px 9px; }
  #textovl-body {
    flex: 1 1 auto; min-height: 0; margin: 0; padding: 12px;
    overflow: auto; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", Consolas, monospace;
    font-size: 12px; line-height: 1.35;
    white-space: pre-wrap; word-break: break-word;
    user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
  }

  /* ── v2: identidade da sessão na barra ─────────────────────── */
  /* MORTO desde a Fase 6: a identidade saiu da barra e cada painel se identifica no PRÓPRIO cabeçalho
     (renderPaneHead); `renderIdentity` é no-op e não existe mais elemento #sess no documento. Quem
     abre o seletor hoje é o ▾ do cabeçalho (e Cmd+K). Regras mantidas só para não mexer em vizinhas. */
  #sess {
    display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px;
    min-width: 0; max-width: 60vw; flex: 0 1 auto;
    border-radius: 8px; padding: 3px 8px; white-space: normal;
  }
  #ident-label {
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    font-weight: 600; font-size: 13px; color: var(--fg); letter-spacing: -0.01em;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #ident-sub { display: flex; align-items: center; gap: 7px; max-width: 100%; overflow: hidden; }
  #ident-sub:empty { display: none; }
  .chip {
    font-size: 10.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 0 1 auto;
  }
  .chip.phrase { flex: 1 1 auto; min-width: 0; max-width: 46vw; }
  .chip.card { color: var(--accent); flex: 0 0 auto; }
  /* Medidor no vermelho (RAM ≥ 90%): a cor é o aviso, o title diz o porquê. */
  .chip.hot { color: var(--err); font-weight: 600; }
  .chip.branch {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; flex: 0 0 auto;
    color: var(--muted);
  }
  .chip.branch.dirty { color: var(--warn); }
  .chip.cost { flex: 0 0 auto; color: var(--muted); }
  .runstate { flex: 0 0 auto; width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  .runstate.on { background: var(--ok); }

  /* ── v2: medidor de contexto e cota ────────────────────────── */
  /* Vive na barra como IRMÃO de #sess, nunca dentro de #ident-sub: renderIdentity() zera o innerHTML
     do #ident-sub a cada 5s, o que destruiria o nó do medidor e o faria piscar. #meter é propriedade
     exclusiva de renderMeter(), que muta no lugar, no seu próprio ritmo (15s). */
  /* NÃO encolhe (`flex: 0 0 auto`): com `0 1 auto` ele e o #sess encolhiam em PROPORÇÃO às bases, e
     numa tela estreita o número era cortado no meio — "ctx 147k · 15%" virava "ctx 14", que é pior do
     que não mostrar nada. Quem cede espaço é a identidade; o medidor aparece inteiro ou não aparece. */
  #meter {
    display: flex; align-items: center; gap: 7px;
    flex: 0 0 auto; min-width: 0; white-space: nowrap; margin-left: auto;   /* agrupa com o status à direita */
  }
  #meter[hidden] { display: none; }
  /* Dado defasado/aproximado nunca ganha cor confiante — é a mesma postura do HealthPill do board. */
  #meter.est { opacity: .55; }
  .track {
    flex: 0 0 auto; width: 34px; height: 5px; border-radius: 999px;
    background: var(--key); overflow: hidden;
  }
  .track > i { display: block; height: 100%; width: 0; background: var(--accent); }
  .track.warn > i { background: var(--warn); }
  .track.err > i { background: var(--err); }
  .chip.ctx { flex: 0 0 auto; }
  .chip.quota { flex: 0 0 auto; }
  .chip.burn { flex: 0 1 auto; color: var(--warn); }
  .chip.dim { opacity: .6; }
  /* Numa barra estreita saem primeiro as faixas, depois a cota — o contexto DESTA sessão é o último
     a sair, porque é o número que só existe aqui. A identidade encolhe (ela tem reticências). */
  @media (max-width: 560px) { #meter .track { display: none; } }
  @media (max-width: 430px) { #meter .chip.quota, #meter .chip.burn { display: none; } }

  /* ── v2: barra de abas (desktop) ───────────────────────────── */
  #tabbar {
    flex: 0 0 auto; display: none; align-items: center; gap: 5px;
    padding: 5px 8px; background: var(--panel); border-bottom: 1px solid var(--line);
    overflow-x: auto; scrollbar-width: none; user-select: none;
  }
  #tabbar::-webkit-scrollbar { display: none; }
  /* A fileira agora lista PAINÉIS (não sessões) e existe em TODAS as larguras — no celular é a
     navegação entre os painéis vivos quando só um cabe na tela. */
  #tabbar.show { display: flex; }
  .tab {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
    background: var(--key); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 5px 8px 5px 10px; font-size: 12px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .tab:hover { background: var(--key-active); }
  .tab.current { border-color: var(--accent); background: rgba(192,197,66,.08); color: var(--fg); }
  .tab .tdot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .tab .tdot.on { background: var(--ok); }
  .tab .pin { color: var(--accent); flex: 0 0 auto; }
  .tab .tlabel { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .tclose { color: var(--muted); margin-left: 2px; padding: 0 3px; border-radius: 4px; flex: 0 0 auto; }
  .tab .tclose:hover { color: var(--err); background: var(--key-active); }
  .tab.newtab { color: var(--muted); font-weight: 600; }

  /* ── Ações por linha (fixar / renomear / encerrar) ──────────── */
  /* Vivem HOJE nas linhas da paleta. Nasceram no #sessmenu (apagado): uma linha não pode ser um
     único <button> quando carrega botões de ação — daí a área principal clicável + este grupo. */
  .iconbtn {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 7px; width: 30px; height: 30px; display: inline-flex; align-items: center;
    justify-content: center; font-size: 14px; cursor: pointer; touch-action: manipulation;
  }
  .iconbtn:hover:not([disabled]) { background: var(--key-active); color: var(--fg); border-color: var(--line); }
  .iconbtn[disabled] { opacity: .32; cursor: not-allowed; }
  .iconbtn.pinned { color: var(--accent); }
  .iconbtn.kill:hover:not([disabled]) { color: var(--err); }

  /* ── v2: paleta de comando (Cmd/Ctrl+K) ────────────────────── */
  #palette {
    position: fixed; z-index: 70; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: max(40px, 8vh) 12px 12px;
  }
  #palette[hidden] { display: none; }
  #palette-panel {
    width: 100%; max-width: 560px; max-height: 70%; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.55);
  }
  #palette-input {
    flex: 0 0 auto; appearance: none; background: var(--bg); color: var(--fg); border: none;
    border-bottom: 1px solid var(--line); padding: 13px 15px; font-size: 15px; outline: none;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  #palette-list { flex: 1 1 auto; overflow: auto; padding: 6px; }
  .pitem {
    display: flex; align-items: center; gap: 10px; padding: 9px 11px; border-radius: 9px;
    cursor: pointer; color: var(--fg); border: 1px solid transparent;
  }
  .pitem.active { background: var(--key); border-color: var(--line); }
  .pitem.current { border-color: var(--accent); background: rgba(192,197,66,.07); }
  /* "já aberto em outro painel": a mesma sessão tmux em dois painéis faz os clientes brigarem pelo
     tamanho (window-size latest) e piscarem a cada clique — a linha aparece, mas indisponível. */
  .pitem.busy { opacity: .5; cursor: not-allowed; }
  .pitem .picon { flex: 0 0 auto; width: 18px; text-align: center; color: var(--muted); }
  .pitem .ptext { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .phint { flex: 0 0 auto; font-size: 11px; color: var(--muted); }
  /* Linha de SESSÃO: duas linhas (nome + o que faz · board · branch · idade) e as ações à direita.
     Herdado do #sessmenu apagado — era o que aquele modal tinha de melhor, e some com ele se não
     vier junto: sem a sub-linha a lista vira uma pilha de nomes sem contexto. */
  .pitem .pcol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .pitem .psub {
    font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .pitem .plive { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: 0 0 auto; }
  .pitem .pactions { display: flex; align-items: center; gap: 3px; flex: 0 0 auto; }
  #palette-empty { color: var(--muted); font-size: 13px; padding: 16px; text-align: center; }

  /* ── Campo de texto próprio (askName) — substitui window.prompt ── */
  .ask-back {
    position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .ask-box {
    width: min(420px, 100%); background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    box-shadow: 0 18px 48px -18px rgba(0,0,0,.75);
  }
  .ask-title { font-size: 14px; font-weight: 600; color: var(--fg); }
  .ask-box input {
    appearance: none; background: var(--bg); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 9px 11px; font-size: 14px; outline: none;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .ask-box input:focus { border-color: var(--accent); }
  /* As DUAS caixas são a mesma caixa, e por isso era fácil achar que se estava renomeando quando se
     estava CRIANDO — só o título mudava, e a criação é a que restringe o formato (o nome vira alvo de
     tmux e entra na URL). Agora elas se diferenciam pelo próprio campo: criar é um SLUG (monoespaçado,
     como o identificador que é); renomear é TEXTO livre (a fonte da interface, porque acentos, espaços
     e maiúsculas valem ali). */
  .ask-box.text input { font-family: ui-sans-serif, system-ui, -apple-system, sans-serif; }
  .ask-hint { font-size: 12px; color: var(--muted); line-height: 1.45; }
  .ask-row { display: flex; justify-content: flex-end; gap: 8px; }
  /* Com um botão destrutivo-leve à esquerda (limpar apelido), ele se separa dos de confirmação. */
  .ask-row.has-clear { justify-content: space-between; }
  .ask-row button {
    appearance: none; background: var(--key); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 7px 13px; font-size: 13px; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .ask-row button:hover { background: var(--key-active); }
  .ask-row button.primary { background: var(--accent); border-color: var(--accent); color: #1b1205; font-weight: 600; }
  .ask-row button.primary:hover { filter: brightness(1.08); }
  /* "Limpar apelido": presente, mas nunca competindo com o primário — é uma saída, não a ação. */
  .ask-row button.ghost { background: transparent; color: var(--muted); }
  .ask-row button.ghost:hover { background: var(--key); color: var(--fg); }

  /* ── Variante LISTA da mesma caixa (askChoice) ──
     Esta página tinha três overlays feitos à mão (#sessmenu, #palette, .ask-box) e NENHUMA primitiva
     de escolher-um-item — askName só sabe texto livre. Em vez de um quarto overlay bespoke para o
     board, a lista reaproveita o casco do askName (mesmo scrim, mesma caixa, mesmo contrato de
     Promise) e ganha só a fileira de opções. */
  .ask-list { display: flex; flex-direction: column; gap: 2px; max-height: 46vh; overflow-y: auto; margin: -2px 0; }
  .ask-list button {
    appearance: none; background: transparent; border: 1px solid transparent; color: var(--fg);
    border-radius: 8px; padding: 8px 10px; font-size: 13.5px; cursor: pointer; text-align: left;
    display: flex; align-items: center; gap: 8px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .ask-list button:hover { background: var(--key-active); }
  .ask-list button:focus-visible { outline: none; border-color: var(--accent); background: var(--key-active); }
  /* A escolha ATUAL é marcada, não escondida: sem isso a caixa não responde "e qual é o de agora?". */
  .ask-list button.current { color: var(--accent); font-weight: 600; }
  .ask-list .tick { width: 12px; flex: 0 0 auto; opacity: .9; }
  .ask-list .sub { color: var(--muted); font-size: 12px; margin-left: auto; padding-left: 10px; }
  /* "Sem board" é uma opção legítima, não um cancelamento — fica na lista, separada por uma linha. */
  .ask-list button.detach { color: var(--muted); border-top: 1px solid var(--line); border-radius: 0 0 8px 8px; margin-top: 4px; padding-top: 10px; }
  .ask-list button.detach:hover { color: var(--fg); }

  /* ── Seletor de LAYOUT (pictogramas) ── */
  #layoutmenu {
    position: absolute; z-index: 70; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px; display: grid; grid-template-columns: repeat(3, auto); gap: 6px;
    box-shadow: 0 18px 48px -18px rgba(0,0,0,.75);
  }
  .lay-opt {
    appearance: none; background: transparent; border: 1px solid transparent; border-radius: 9px;
    padding: 7px 8px 5px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 4px; color: var(--muted); font-size: 10px;
    font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
  }
  .lay-opt:hover { background: var(--key); color: var(--fg); }
  .lay-opt.current { border-color: var(--accent); color: var(--fg); }
  .lay-opt svg { display: block; }
  .lay-opt .cell { fill: var(--muted); }
  .lay-opt:hover .cell, .lay-opt.current .cell { fill: var(--accent); }
  #layoutbtn svg .cell { fill: currentColor; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <a class="back" href="/" title="Voltar ao board">‹</a>

    <!-- A barra guarda SÓ a cota da conta (uma vez) e o estado agregado da conexão. A identidade e
         o contexto de cada terminal vivem AGORA no cabeçalho do SEU painel (Fase 6 — desduplicação:
         com até 4 painéis não existe "a sessão da página"). -->
    <span id="meter" hidden></span>
    <span id="status"><span id="dot" class="warn"></span><span id="state">conectando…</span>
      <button id="reconnect" type="button" title="Reconectar todos os painéis offline">↻</button>
    </span>
  </div>
  <!-- Barra de abas (desktop): troca rápida entre as sessões fixadas + ativas, sem abrir o seletor. -->

  <!-- Busca no scrollback. Acima do terminal para nao competir com o teclado virtual. -->
  <div id="find" hidden>
    <input id="find-input" type="search" placeholder="buscar no histórico…" autocomplete="off"
           autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />

<!-- Sessões tmux vivas + ações: TUDO mora na paleta abaixo. O modal #sessmenu que vivia aqui foi
     apagado — ver a nota no bloco da paleta. -->

<!-- Paleta de comando: o seletor ÚNICO de terminal + as ações rápidas.

           autocapitalize="off" autocorrect="off" spellcheck="false" />
