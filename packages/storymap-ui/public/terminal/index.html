<script src="/terminal/vendor/xterm.js"></script>
<script src="/terminal/vendor/addon-fit.js"></script>
<!-- Addons vendorados (xterm 5.3.0, peer ^5.0.0) — servidos localmente como o resto: nenhum CDN.
     web-links: URLs no output viram clicaveis · search: busca no scrollback · webgl: renderer
     acelerado (o de DOM engasga com saida volumosa — build, suite de testes, git log grande). -->
<script src="/terminal/vendor/addon-web-links.js"></script>
<script src="/terminal/vendor/addon-search.js"></script>
<script src="/terminal/vendor/addon-webgl.js"></script>
<script>
(function () {
  "use strict";
  var enc = new TextEncoder();

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  ARQUITETURA (Fase 1 — extração do painel).
  //
  //  Até aqui a página tinha UM terminal fixo. Agora o estado de um terminal — o xterm, o
  //  WebSocket, a fila de digitação, o estado do Ctrl, o sino de silêncio, TODO o bloco de toque
  //  — vive dentro de `createPanel(session, hostEl)`, uma instância isolada. A página passa a poder
  //  montar até 4 (Fase 5). O que é da CONTA/DA PÁGINA (a lista de sessões, o seletor, a paleta, a
  //  busca, a barra de teclas, a cota da assinatura) fica GLOBAL e age sobre o painel EM FOCO
  //  (`focusedPane()`).
  //
  //  Em P1 há exatamente UM painel e ele é sempre o focado, então o comportamento é IDÊNTICO ao de
  //  antes. Única mudança semântica autorizada nesta fase: no bloco de toque, `e.touches` virou
  //  `e.targetTouches` — senão dois painéis contariam os dedos um do outro (Fase 5).
  // ════════════════════════════════════════════════════════════════════════════════════════

  // ── Preferências locais do operador ────────────────────────
  // Primeiro estado de cliente desta página, daí o prefixo `webterm.` em TODA chave: o board mora na
  // mesma origem e não queremos colidir com o storage dele. Corpo inteiro em try/catch — em aba
  // anônima o simples ACESSO a localStorage lança, e uma preferência que não persiste é um detalhe,
  // não um motivo para a página não abrir.
  function prefGet(k, dflt) {
    try {
      var v = localStorage.getItem(k);
      return v === null ? dflt : JSON.parse(v);
    } catch (e) { return dflt; }
  }
  function prefSet(k, v) {
    try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {}
  }
  function clampFont(n) {
    n = Math.round(Number(n));
    return isFinite(n) ? Math.max(9, Math.min(22, n)) : 13;
  }
  /** Vibração curta de confirmação. Ausente no iOS — no-op silencioso, nunca um aviso. */
  function haptic(ms) {
    if (!prefGet("webterm.haptics", true)) return;
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {}
  }

  /** Registra o SW e assina o push (mesma pilha do board: /sw.js + VAPID). false ⇒ seguimos sem push.
   *  Independente de painel — a assinatura é do dispositivo/aba, não do terminal. */
  async function subscribePush() {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    try {
      var reg = (await navigator.serviceWorker.getRegistration()) ||
        (await navigator.serviceWorker.register("/sw.js", { scope: "/" }));
      var sub = await reg.pushManager.getSubscription();
      if (!sub) {
        var kr = await fetch("/api/notifications/vapid", { credentials: "include", cache: "no-store" });
        if (!kr.ok) return false;
        var key = (await kr.json()).publicKey;
        if (!key) return false;
        sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(key) });
      }
      var res = await fetch("/api/notifications/subscribe", {
        method: "POST",
        credentials: "include",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(sub),
      });
      return res.ok;
    } catch (e) {
      return false;
    }
  }
  // VAPID vem em base64url; o PushManager quer os bytes.
  function urlB64ToBytes(b64) {
    var pad = "=".repeat((4 - (b64.length % 4)) % 4);
    var raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
    var out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }

  // Constantes compartilhadas por todos os painéis (imutáveis — uma cópia só).
  var PENDING_MAX = 512;
  // Limiar de "ficou quieto" do detector LOCAL. Este valor é só o PALPITE inicial: o servidor é o dono
  // da régua e a devolve em `POST /api/terminal/watch` (ver armBell), que a sobrescreve aqui.
  var IDLE_MS = 25000;
  var TMUX_LINES_PER_NOTCH = 5;
  var AXIS_LOCK_PX = 10;
  var PINCH_RATIO_MIN = 0.12;
  var WORD_CHAR = /[^\s"'\x60()[\]{}<>|]/;

  var COARSE_POINTER = (function () {
    try { return window.matchMedia("(pointer: coarse)").matches; } catch (e) { return false; }
  })();
  var TOUCH = false;
  try { TOUCH = window.matchMedia("(pointer: coarse)").matches; } catch (e) {}
  document.body.classList.add(TOUCH ? "mode-touch" : "mode-desktop");

  // ── Which tmux session to attach, from the page URL (?b=). ─
  // The nav "Terminal" button passes ?b=shell (a plain bash VPS shell — NOT the master Claude TUI);
  // the Processos page passes ?b=claude (master) or ?b=card-<board>__<id> (a resumed run). ttyd
  // (--url-arg) forwards it to attach-session.sh via /ttyd/ws?arg=<session>. Validated to a slug;
  // defaults to shell.
  //
  // Sem `?b=` explícito, RESTAURA a última sessão usada (guardada no onopen). Um `?b=` explícito
  // sempre vence — é um link que alguém escolheu seguir. A restauração é VALIDADA no connect():
  // o attach-session.sh usa `new-session -A`, então um nome velho não daria erro, criaria em
  // silêncio um shell vazio — exatamente a mentira que a sonda `existedBefore` existe para evitar.
  var SESSION_RESTORED = false;
  var BOOT_SESSION = (function () {
    var b = "";
    try { b = new URLSearchParams(location.search).get("b") || ""; } catch (e) {}
    if (/^[A-Za-z0-9_-]{1,80}$/.test(b)) return b;
    var last = prefGet("webterm.lastSession", "");
    if (typeof last === "string" && /^[A-Za-z0-9_-]{1,80}$/.test(last)) {
      SESSION_RESTORED = true;
      return last;
    }
    return "shell";
  })();

  // ── Estado global de sessões (retrato de /api/terminal/sessions) ──
  /** Ultimo retrato de /api/terminal/sessions — alimenta o seletor e o aviso attach-vs-create. */
  var knownSessions = [];
  /** A consulta funcionou? null = ainda nao perguntamos · false = falhou (≠ "nao ha sessoes"). */
  var sessionsProbeOk = null;
  /** Os boards do AgileHarness ([{id,name}]) — vêm de carona na MESMA resposta das sessões, porque
   *  esta página é um asset estático e não tem como ler o diretório de boards. Alimenta o seletor. */
  var knownBoards = [];

  /** A validated slug, mirroring attach-session.sh + the server's isSafeSessionName (≤80). */
  function isSlug(s) { return /^[A-Za-z0-9_][A-Za-z0-9_-]{0,79}$/.test(s); }

  // ── Formatadores: quem escreve o número escreve a PALAVRA ──
  //
  // A regra que impede a recaída: pode-se abreviar SÍMBOLO (%, $, ·) e cortar o DADO, nunca a
  // PALAVRA. Foi abreviando rótulo para caber que nasceram o `ctx` e — pior — o `sem` de "semanal",
  // que se lia como a preposição "sem": "sem 23%" parecia dizer que NÃO havia 23%. Quando falta
  // espaço, o corte remove o dado menos importante, jamais as letras de um rótulo.
  // Corolário: um dado que só cabe abreviado não cabe.

  /** Quanto tempo FAZ, por extenso. Consumido sempre com preposição ("leitura de 3 minutos atrás"). */
  function shortAge(ms) {
    if (!ms) return "";
    var sec = Math.max(0, Math.round((Date.now() - ms) / 1000));
    if (sec < 90) return "poucos segundos";
    var min = Math.round(sec / 60);
    if (min < 90) return min + (min === 1 ? " minuto" : " minutos");
    var hr = Math.round(min / 60);
    if (hr < 48) return hr + (hr === 1 ? " hora" : " horas");
    var d = Math.round(hr / 24);
    return d + (d === 1 ? " dia" : " dias");
  }
  /** Quantidade grande com a palavra da magnitude — "470 mil", "1,2 milhão" — nunca "470k"/"1.2M". */
  function fmtTokens(n) {
    if (n == null) return "";
    if (n >= 1e6) {
      var mi = n / 1e6;
      return (Math.round(mi * 10) / 10).toString().replace(".", ",") + (mi < 2 ? " milhão" : " milhões");
    }
    if (n >= 1e3) return Math.round(n / 1e3) + " mil";
    return String(Math.round(n));
  }
  /** Quanto FALTA, por extenso — "43 minutos", "6 dias" (o shortAge acima mede o passado). */
  function fmtMins(m) {
    if (m == null || !isFinite(m) || m < 0) return "";
    if (m < 90) { var mi = Math.round(m); return mi + (mi === 1 ? " minuto" : " minutos"); }
    var h = m / 60;
    if (h < 48) { var hr = Math.round(h); return hr + (hr === 1 ? " hora" : " horas"); }
    var d = Math.round(h / 24);
    return d + (d === 1 ? " dia" : " dias");
  }
  /** Small helper: a chip <span> with textContent (never innerHTML — alias/label are operator input). */
  function chip(cls, text) {
    var s = document.createElement("span");
    s.className = "chip " + cls;
    s.textContent = text;
    return s;
  }
  // ── Ícones (lucide inline) — mesma linguagem do resto da aplicação. Mapa nome→miolo do SVG +
  //    um wrapper que usa currentColor (herda a cor do botão). São constantes ESTÁTICAS → innerHTML
  //    é seguro aqui (nunca recebem entrada do operador; rótulos de usuário seguem em textContent). ─
  var ICON_PATHS = {
    image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    clipboard: '<rect width="8" height="4" x="8" y="2" rx="1" ry="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>',
    copy: '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
    check: '<path d="M20 6 9 17l-5-5"/>',
    type: '<polyline points="4 7 4 4 20 4 20 7"/><line x1="9" x2="15" y1="20" y2="20"/><line x1="12" x2="12" y1="4" y2="20"/>',
    search: '<circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>',
    command: '<path d="M15 6v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3"/>',
    bell: '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
    'bell-off': '<path d="M8.7 3A6 6 0 0 1 18 8a21.3 21.3 0 0 0 .6 5"/><path d="M17 17H3s3-2 3-9a4.67 4.67 0 0 1 .3-1.7"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/>',
    plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
    'columns-2': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/>',
    'maximize-2': '<polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" x2="14" y1="3" y2="10"/><line x1="3" x2="10" y1="21" y2="14"/>',
    'minimize-2': '<polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" x2="21" y1="10" y2="3"/><line x1="3" x2="10" y1="21" y2="14"/>',
    'rotate-cw': '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    'chevron-left': '<path d="m15 18-6-6 6-6"/>',
    'chevron-down': '<path d="m6 9 6 6 6-6"/>'
  };
  function svgIcon(name, size) {
    var s = size || 16;
    return '<svg class="ic" viewBox="0 0 24 24" width="' + s + '" height="' + s + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICON_PATHS[name] || "") + '</svg>';
  }
  /** Conteúdo de uma tecla: ícone + rótulo opcional (o rótulo vai em textContent, nunca innerHTML). */
  function setKeyContent(b, iconName, label) {
    b.innerHTML = (iconName ? svgIcon(iconName) : "") + (label ? '<span class="klabel"></span>' : "");
    if (label) b.querySelector(".klabel").textContent = label;
  }

  /** Botão do cabeçalho do painel (24×22). */
  function phBtn(icon, title, handler) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "ph-btn";
    b.innerHTML = svgIcon(icon, 15);
    b.title = title;
    b.addEventListener("pointerdown", function (e) { e.preventDefault(); });
    b.addEventListener("click", function (e) { e.stopPropagation(); haptic(8); handler(); });
    return b;
  }
  /** Chip do cabeçalho do painel (textContent — nunca innerHTML: label/branch são entrada do operador). */
  function mkPhChip(cls, text) {
    var s = document.createElement("span");
    s.className = "ph-chip " + cls;
    s.textContent = text;
    return s;
  }
  /** Faixa de progresso. `pct` null ⇒ nenhuma faixa (não se desenha uma barra sem denominador). */
  function track(pct) {
    if (pct == null || !isFinite(pct)) return null;
    var t = document.createElement("span");
    t.className = "track" + (pct >= 90 ? " err" : pct >= 70 ? " warn" : "");
    var i = document.createElement("i");
    i.style.width = Math.max(0, Math.min(100, pct)) + "%";   // a LARGURA satura; o número, não
    t.appendChild(i);
    return t;
  }
  // Rótulos por extenso. O antigo `sem` (de "semanal") lia-se como a PREPOSIÇÃO "sem".
  var BUCKET_LABEL = { session: "Cota de 5 horas", week: "Cota semanal", weekSonnet: "Cota semanal (Sonnet)" };

  // ── Ordenação comum: fixadas primeiro, depois mais recentes ─
  function sortedSessions() {
    return knownSessions.slice().sort(function (a, b) {
      if (!!b.pinned !== !!a.pinned) return b.pinned ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  REGISTRO DE PAINÉIS + FOCO
  //
  //  P1: um painel só, sempre focado. `focusedPane()` sempre devolve um painel vivo. A escolha por
  //  eventos (pointerdown / focus / troca) e o sinal visual entram na Fase 2.
  // ════════════════════════════════════════════════════════════════════════════════════════
  var PANELS = [];
  var panelSeq = 0;
  var focusedId = null;

  function focusedPane() {
    for (var i = 0; i < PANELS.length; i++) if (PANELS[i].id === focusedId) return PANELS[i];
    return PANELS[0] || null;
  }
  /** Atalho verboso-menos para focusedPane(). */
  function fp() { return focusedPane(); }

  /** Pinta a borda de foco e o esmaecimento dos não-focados (gated em .has-multi). */
  function applyFocusStyles() {
    var multi = PANELS.length > 1;
    document.body.classList.toggle("has-multi", multi);
    for (var i = 0; i < PANELS.length; i++) {
      PANELS[i].el.classList.toggle("focused", PANELS[i].id === focusedId);
    }
  }
  /** Elege o painel `p` como focado. O foco PERSISTE em focusedId: perder o foco do DOM para um
   *  botão do cromo não muda quem recebe o teclado quando você volta a digitar. Nunca chama
   *  term.focus() (senão um pointerdown de ROLAGEM levantaria o teclado virtual no celular). */
  function focusPanel(p) {
    if (!p) { focusedId = null; applyFocusStyles(); return; }
    var changed = focusedId !== p.id;
    focusedId = p.id;
    applyFocusStyles();
    if (changed) {
      // O cromo compartilhado (barra superior, botões Ctrl/sino, medidor, identidade) e o "em foco"
      // dos cabeçalhos refletem o painel em foco — repinta ao trocar. O contexto NÃO depende do
      // foco: ele é pintado no cabeçalho de cada painel, com a leitura do terminal daquele painel.
      paintConn();
      chromeCtrlChanged(p);
      chromeBellChanged(p);
      renderIdentity();
      renderAllHeads();
      renderPaneRow();
      try { pollMeter(); } catch (e) {}
      savePanelLayout();                        // o foco faz parte da grade que restauramos ao voltar
    }
  }

  // Um `?b=` explícito (link para UM terminal específico — Processos, popover, e muitas vezes numa
  // ABA NOVA que divide o mesmo localStorage) NÃO deve sobrescrever a grade de trabalho salva. Fica
  // suprimido enquanto for o painel único do link; se o operador DIVIDIR a tela aqui (montar uma
  // grade), volta a salvar normalmente.
  var suppressLayoutSave = false;

  /** Persiste a GRADE deixada (sessões por painel + foco + arranjo) para restaurá-la quando o
   *  operador voltar à página — não só a última sessão. Guarda só sessões válidas e sem duplicata;
   *  um painel recém-dividido (ainda sem terminal escolhido) é ignorado até ele escolher um. */
  function savePanelLayout() {
    if (suppressLayoutSave) {
      if (PANELS.length <= 1) return;                 // ainda é o painel único do link avulso → não persiste
      suppressLayoutSave = false;                     // dividiu a tela → virou grade de trabalho, pode salvar
    }
    try {
      var sessions = [], slots = [];
      for (var i = 0; i < PANELS.length; i++) {
        var s = PANELS[i].session;
        if (!s || !isSlug(s) || sessions.indexOf(s) >= 0) continue;
        sessions.push(s);
        // O SLOT viaja junto do nome: quem deixou um terminal na célula de baixo de um 2×2 volta e
        // o encontra lá, com as outras três ainda vagas. Sem isto a grade restaurada empurrava tudo
        // para as primeiras células e desfazia o arranjo que o operador montou.
        slots.push(typeof PANELS[i].slot === "number" ? PANELS[i].slot : -1);
      }
      var fpp = focusedPane();
      var focused = fpp && fpp.session && isSlug(fpp.session) ? fpp.session : (sessions[0] || "");
      prefSet("webterm.panels", { sessions: sessions, slots: slots, focused: focused, stack: !!stackMode, zoom: !!zoomed });
    } catch (e) { /* localStorage indisponível: uma preferência que não persiste não quebra nada */ }
  }

  // ── Barra superior: status de conexão (pintado a partir do painel em foco em P1) ──
  var dot = document.getElementById("dot");
  var stateEl = document.getElementById("state");
  // Estado AGREGADO da conexão (Fase 6): com N painéis a barra não fala de "a sessão da página" —
  // fala de todos. "3 de 4 conectados"; ponto verde só quando todos estão conectados.
  function paintConn() {
    var total = PANELS.length, okN = 0, errN = 0;
    for (var i = 0; i < PANELS.length; i++) {
      if (PANELS[i].connKind === "ok") okN++;
      else if (PANELS[i].connKind === "err") errN++;
    }
    // Grade VAZIA (o operador encerrou o último terminal): não há conexão sobre a qual falar, e o
    // "…" de "conectando" seria uma espera que não existe.
    if (total === 0) { dot.className = "warn"; stateEl.textContent = "nenhum terminal aberto"; return; }
    if (total <= 1) {
      var p = PANELS[0];
      dot.className = p ? p.connKind : "warn";
      stateEl.textContent = p ? p.connLabel : "…";
      return;
    }
    dot.className = okN === total ? "ok" : (errN > 0 ? "err" : "warn");
    stateEl.textContent = okN + " de " + total + " conectados";
  }
  /** Um painel avisa que sua conexão mudou; a barra repinta o AGREGADO (depende de todos). */
  function chromeConnChanged(p) { paintConn(); }

  // ── Refit quando a ALTURA do cromo (barra + abas + busca) muda ──
  // Corrige um defeito antigo: renderPaneRow()/renderMeter() alternavam a barra sem chamar fit(), então
  // o xterm seguia com cols/rows velhos e o tmux nunca recebia o quadro de resize. Mede ANTES de
  // agir para não disparar um resize a cada repintura idêntica.
  var barEl = document.getElementById("bar");
  var tabbar = document.getElementById("tabbar");
  var lastChromeH = -1;
  // fitAll() é chamado de vários pontos reativos (mudança de cromo, busca, gavetas). Passa a
  // AGENDAR o relayout debounced (rAF + 80ms) — uma única função de layout com as duas guardas
  // (caixa zero e "mudou?"), em vez de N fits imediatos espalhados.
  function fitAll() { relayout(); }
  function fitIfChromeChanged() {
    try {
      var h = barEl.offsetHeight + (tabbar ? tabbar.offsetHeight : 0);
      if (h !== lastChromeH) { lastChromeH = h; fitAll(); }
    } catch (e) { /* nós ainda não montados */ }
  }

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  createPanel — TUDO que é de UM terminal (xterm, ws, fila, ctrl, sino, toque).
  //  Retorna um `panel` com métodos que o cromo global chama contra o painel em foco.
  // ════════════════════════════════════════════════════════════════════════════════════════
  function createPanel(session, hostEl, restored) {
    var panel = {
      id: "p" + (++panelSeq),
      session: session,
      connKind: "warn",
      connLabel: "Conectando…",
      // A CÉLULA em que este painel quer ficar (índice do slot no arranjo), ou null para "onde
      // couber". Quem nasce de uma vaga carrega o índice DAQUELA vaga — é o que faz "criar um
      // terminal AQUI" abrir o terminal aqui, e não no primeiro buraco da grade. Só arranjos
      // ESCOLHIDOS honram a preferência; o `auto` empacota na ordem, como sempre fez.
      slot: null
    };

    // ── DOM próprio do painel ──
    var el = document.createElement("div");
    el.className = "pane";

    // Cabeçalho (26px): conexão · nome (▾ abre o seletor com alvo = este painel) · em foco ·
    // contexto/branch/custo · ⊞ dividir / ⛶ ampliar / ↻ reconectar / ✕ fechar painel.
    var head = document.createElement("div");
    head.className = "pane-head";
    var hConn = document.createElement("span"); hConn.className = "ph-conn warn"; head.appendChild(hConn);
    // DUAS ações, DOIS botões — o ▾ troca o terminal deste painel, o NOME renomeia.
    //
    // Antes eram o mesmo botão: um clique abria o seletor, dois renomeavam. Isso obrigava a um timer
    // de 220ms para desambiguar, e quando o segundo clique atrasava (a janela do sistema é ~500ms) o
    // MODAL abria por cima do campo de renomear — a queixa do operador, que sobreviveu ao primeiro
    // remendo (fechar o modal no dblclick apenas trocava o modal por um piscar). Separar os alvos
    // remove a corrida em vez de arbitrá-la: renomear é imediato, e não há mais o que fechar.
    var hChev = document.createElement("button"); hChev.type = "button"; hChev.className = "ph-chev";
    hChev.innerHTML = svgIcon("chevron-down", 13);
    hChev.title = "Trocar o terminal que aparece neste painel";
    hChev.setAttribute("aria-label", "Trocar o terminal deste painel");
    hChev.addEventListener("click", function (e) {
      e.stopPropagation();
      haptic(8);
      openPaletteFor(panel);
    });
    head.appendChild(hChev);

    var hName = document.createElement("button"); hName.type = "button"; hName.className = "ph-name";
    var hNameTxt = document.createElement("span"); hNameTxt.className = "ph-name-txt";
    hNameTxt.textContent = (session || "novo");
    hName.appendChild(hNameTxt);
    hName.title = "Renomear este terminal";
    // Um toque = renomear, no dedo e no mouse. O toque longo que existia aqui virou redundante (era
    // a única porta para renomear no celular, porque o clique simples estava ocupado pelo seletor).
    hName.addEventListener("click", function (e) {
      e.stopPropagation();
      beginRename(panel);
    });
    head.appendChild(hName);
    var hFocus = document.createElement("span"); hFocus.className = "ph-focus"; hFocus.textContent = "em foco";
    hFocus.title = "Painel em foco: o que você digita vai para cá"; hFocus.style.display = "none";
    head.appendChild(hFocus);
    var hInfo = document.createElement("span"); hInfo.className = "ph-info"; hInfo.style.cssText = "display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;flex:1 1 auto;";
    head.appendChild(hInfo);
    var hActions = document.createElement("span"); hActions.className = "ph-actions";
    var hSplit = phBtn("columns-2", "Dividir: abre outro terminal ao lado", function () { splitPanel(panel); });
    var hZoom = phBtn("maximize-2", "Ampliar: mostra só este painel", function () { focusPanel(panel); toggleZoom(); });
    var hRe = phBtn("rotate-cw", "Reconectar este painel", function () { reconnectNow(); });
    var hClose = phBtn("x", "Encerrar este terminal", function () { void closeTerminalFlow(panel); });
    hClose.className += " close";
    hActions.appendChild(hSplit); hActions.appendChild(hZoom); hActions.appendChild(hRe); hActions.appendChild(hClose);
    head.appendChild(hActions);
    el.appendChild(head);

    var body = document.createElement("div");
    body.className = "pane-body";
    el.appendChild(body);
    var toBottomBtn = document.createElement("button");
    toBottomBtn.type = "button";
    toBottomBtn.className = "tobottom";
    toBottomBtn.hidden = true;
    toBottomBtn.textContent = "↓ voltar ao fim";
    el.appendChild(toBottomBtn);

    // Camada dos avisos DESTE painel (upload de imagem, fila offline, terminal criado…). Ver o
    // doc-comment de `toast` mais abaixo: por que eles não podem ser escritos no terminal.
    var toastLayer = document.createElement("div");
    toastLayer.className = "pane-toasts";
    el.appendChild(toastLayer);

    // Cartão "terminal encerrado por fora" — renderiza no lugar do corpo, nunca derruba os outros.
    var deadCard = document.createElement("div");
    deadCard.className = "pane-dead";
    var deadMsg = document.createElement("div"); deadMsg.className = "msg"; deadMsg.textContent = "Este terminal foi encerrado.";
    deadCard.appendChild(deadMsg);
    var deadRow = document.createElement("div"); deadRow.className = "row";
    var deadPick = document.createElement("button"); deadPick.type = "button"; deadPick.textContent = "Escolher outro terminal";
    deadPick.addEventListener("click", function () { openPaletteFor(panel); });
    var deadClose = document.createElement("button"); deadClose.type = "button"; deadClose.textContent = "Fechar painel";
    deadClose.addEventListener("click", function () { closePanel(panel); });
    deadRow.appendChild(deadPick); deadRow.appendChild(deadClose);
    deadCard.appendChild(deadRow);
    el.appendChild(deadCard);

    hostEl.appendChild(el);
    panel.el = el;
    panel.body = body;
    panel.wrap = el;
    panel.hConn = hConn; panel.hName = hName; panel.hNameTxt = hNameTxt; panel.hFocus = hFocus; panel.hInfo = hInfo; panel.hSplit = hSplit; panel.hZoom = hZoom; panel.hClose = hClose;

    // Sessão deste painel (local — cada painel tem a sua). Mantém o nome `SESSION` para que os
    // corpos de função copiados do código de painel único continuem legíveis.
    var SESSION = session;
    var sessionRestored = !!restored;

    // ── xterm setup ────────────────────────────────────────────
    var term = new Terminal({
      fontFamily: 'ui-monospace, SFMono-Regular, Menlo, "DejaVu Sans Mono", Consolas, monospace',
      fontSize: clampFont(prefGet("webterm.fontSize", 13)),
      lineHeight: 1.0,
      cursorBlink: true,
      cursorStyle: "bar",
      scrollback: 8000,
      allowProposedApi: true,
      macOptionIsMeta: true,
      fontWeightBold: "600",
      theme: {
        background: "#0b0b0d", foreground: "#e6e6e6", cursor: "#c0c542",
        cursorAccent: "#0b0b0d", selectionBackground: "#33333d",
        black: "#2a2a31", red: "#f0506e", green: "#5bd66f", yellow: "#f0b429",
        blue: "#5b8cf0", magenta: "#c678dd", cyan: "#56b6c2", white: "#d7d7de",
        brightBlack: "#5a5a64", brightRed: "#ff6b86", brightGreen: "#7ee68d",
        brightYellow: "#ffc94d", brightBlue: "#79a3ff", brightMagenta: "#d99ae8",
        brightCyan: "#73c9d4", brightWhite: "#ffffff"
      }
    });
    var fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);

    // Busca no scrollback. Carregado ANTES do open (o addon se prende ao buffer).
    var searchAddon = new SearchAddon.SearchAddon();
    term.loadAddon(searchAddon);

    // URLs clicaveis. Abre em aba nova SEM `opener`, para o destino nao poder manipular esta pagina.
    term.loadAddon(new WebLinksAddon.WebLinksAddon(function (event, uri) {
      window.open(uri, "_blank", "noopener,noreferrer");
    }));

    term.open(body);

    // Copiar-ao-selecionar (desktop) — como um terminal de verdade: soltar o mouse sobre uma seleção
    // joga o texto na área de transferência, sem precisar do botão "copiar". No `mouseup`, NÃO em
    // `onSelectionChange` (este dispara a cada quadro do arrasto). Só no desktop.
    if (!COARSE_POINTER && term.element) {
      term.element.addEventListener("mouseup", function () {
        var sel = term.getSelection();
        if (sel && navigator.clipboard) navigator.clipboard.writeText(sel).catch(function () {});
      });
    }

    // Renderer WebGL — o de DOM engasga com saida volumosa. Best-effort: em GPU/driver sem suporte o
    // addon LANCA na criacao, e onContextLoss dispara se o contexto morrer depois. Nos dois casos
    // descartamos o addon e o xterm volta ao renderer padrao.
    var webgl = null;
    try {
      webgl = new WebglAddon.WebglAddon();
      webgl.onContextLoss(function () { try { webgl.dispose(); } catch (e) {} webgl = null; });
      term.loadAddon(webgl);
    } catch (e) { webgl = null; }

    // ── connection state ───────────────────────────────────────
    var ws = null;
    var reconnectTimer = null;
    var backoff = 500;
    var manualClose = false;

    function setStatus(kind, label) {
      panel.connKind = kind;                  // ok | warn | err
      panel.connLabel = label;
      if (hConn) hConn.className = "ph-conn " + kind;   // ponto de conexão do cabeçalho do painel
      chromeConnChanged(panel);
      renderPaneRow();                        // o ponto de conexão do chip do painel muda junto
    }

    // Fila do que voce digita ENQUANTO o socket esta caido. Antes descartava em silencio (um blip de
    // rede engolia o que tinha sido digitado). Agora enfileira e envia no onopen, na ordem digitada.
    // O teto evita crescer sem fim; ao estourar descarta o mais ANTIGO e AVISA.
    var pending = [];
    var pendingWarned = false;

    function sendInput(str) {
      if (ws && ws.readyState === 1) {
        ws.send(enc.encode("0" + str));
        return;
      }
      pending.push(str);
      if (pending.length > PENDING_MAX) pending.shift();
      if (!pendingWarned) {
        pendingWarned = true;
        toast("[offline] desconectado — o que você digitar vai na reconexão.", "33");
      }
    }
    /** Esvazia a fila na ordem digitada. Chamado no onopen. */
    function flushPending() {
      if (!pending.length) return;
      var queued = pending;
      pending = [];
      pendingWarned = false;
      for (var i = 0; i < queued.length; i++) ws.send(enc.encode("0" + queued[i]));
      toast("[offline] " + queued.length + " entrada(s) enviada(s) após reconectar.", "32");
    }
    function sendResize(cols, rows) {
      if (ws && ws.readyState === 1) ws.send(enc.encode("1" + JSON.stringify({ columns: cols, rows: rows })));
    }
    // Guarda de "mudou?": só manda o frame '1' de resize NAQUELE ws quando cols/rows realmente
    // mudaram. Sem isso, mudar o arranjo (split/close/zoom/arraste) inundaria o tmux com um quadro
    // de resize por evento — e pode mexer na posição do copy-mode. É o defeito já documentado
    // (layout mudava sem fit) invertido: agora fita sempre, resize só quando muda.
    var lastCols = -1, lastRows = -1;
    function fit() {
      try {
        if (body.clientWidth < 40 || body.clientHeight < 40) return;   // caixa zero: não fita
        el.classList.toggle("narrow", el.clientWidth < 560);           // corta chips do cabeçalho
        fitAddon.fit();
        if (term.cols !== lastCols || term.rows !== lastRows) {
          sendResize(term.cols, term.rows);
          lastCols = term.cols; lastRows = term.rows;
        }
      } catch (e) { /* container not ready */ }
    }

    // ── ttyd protocol client ───────────────────────────────────
    // Server→client first byte: '0' OUTPUT · '1' SET_TITLE · '2' SET_PREFS
    // Client→server: init JSON (no prefix) then '0'=input '1'=resize
    async function connect() {
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      manualClose = false;
      setStatus("warn", "Conectando…");

      var token = "";
      try {
        var r = await fetch("/ttyd/token", { credentials: "include", cache: "no-store" });
        if (r.ok) token = (await r.json()).token || "";
      } catch (e) { /* token endpoint optional */ }

      // ATTACH ou CREATE? O attach-session.sh usa `new-session -A`, que CRIA em silencio quando a
      // sessao nao existe — e a barra dizia "anexado" do mesmo jeito. Perguntamos ANTES de abrir o
      // socket para poder contar a verdade. Best-effort: falhou, nao afirmamos nada.
      var existedBefore = null;
      try {
        var sr = await fetch("/api/terminal/sessions", { credentials: "include", cache: "no-store" });
        if (sr.ok) {
          var sj = await sr.json();
          knownSessions = (sj && sj.sessions) || [];
          sessionsProbeOk = true;
          existedBefore = knownSessions.some(function (x) { return x.name === SESSION; });
        } else {
          sessionsProbeOk = false;
        }
      } catch (e) {
        sessionsProbeOk = false;                            // seguimos sem o aviso, mas SABENDO disso
      }

      // Restauração que aponta para uma sessão que MORREU: DEGRADA o painel para o shell ANTES de
      // abrir o socket — sem recarregar a página (com até 4 painéis, um reload derrubaria os outros).
      // Só vale para a restauração automática; um `?b=` explícito continua podendo criar. A sonda
      // FALHAR conta como não-verificado, não como verificado-existe (fail-closed na janela do deploy).
      if (sessionRestored && (existedBefore === false || sessionsProbeOk === false)) {
        if (PANELS.length > 1) {
          // Grade restaurada: a sessão salva morreu enquanto você esteve fora. Mostra o cartão
          // "encerrado" DESTE painel (os outros seguem vivos) em vez de criar um shell vazio em
          // silêncio. Só quando SABEMOS que morreu (existedBefore===false); sonda que falhou não
          // afirma morte — segue e conecta (janela de deploy é transitória).
          if (existedBefore === false) { sessionRestored = false; markDead(); savePanelLayout(); return; }
        } else {
          // Painel único restaurado: cai no shell (mais amigável que um cartão de morto numa página só).
          sessionRestored = false;
          SESSION = "shell";
          panel.session = "shell";
          existedBefore = knownSessions.some(function (x) { return x.name === "shell"; });
          if (panel === focusedPane()) renderIdentity();
          savePanelLayout();
        }
      }

      var proto = location.protocol === "https:" ? "wss" : "ws";
      try {
        ws = new WebSocket(proto + "://" + location.host + "/ttyd/ws?arg=" + encodeURIComponent(SESSION), ["tty"]);
      } catch (e) {
        setStatus("err", "Não consegui conectar"); scheduleReconnect(); return;
      }
      ws.binaryType = "arraybuffer";

      ws.onopen = function () {
        backoff = 500;
        setStatus("ok", existedBefore === false ? "Terminal novo (vazio)" : "Conectado");
        // tmux needs a real size before it redraws — fit first, then init.
        try { fitAddon.fit(); } catch (e) {}
        ws.send(enc.encode(JSON.stringify({ AuthToken: token, columns: term.cols, rows: term.rows })));
        setTimeout(fit, 60);
        if (existedBefore === false) {
          toast('[terminal] Não existia nenhum terminal chamado "' + SESSION + '" — criei um agora, em branco. O trabalho que você procurava não está aqui.', "33");
        }
        flushPending();
        // O watch de ociosidade vive no servidor com TTL; renova-lo a cada (re)conexao e o que o
        // mantem vivo enquanto esta pagina estiver aberta.
        if (bellOn) armBell(true);
        prefSet("webterm.lastSession", SESSION);
        if (sessionRestored) {
          // Só reescreve a URL para ?b= quando há UM painel: numa grade restaurada não existe "a
          // sessão da página" (a grade toda vem do webterm.panels, não da query), e cada painel
          // brigaria pela URL — o último a abrir venceria. Com grade, a URL fica em /terminal.
          if (PANELS.length === 1) {
            try { history.replaceState(null, "", "/terminal?b=" + encodeURIComponent(SESSION)); } catch (e) {}
          }
          // A restauração já aconteceu. Se a flag ficasse ligada, a MORTE desta sessão mais tarde
          // faria a reconexão cair na guarda acima e navegar/degradar sozinha.
          sessionRestored = false;
        }
        if (panel === focusedPane()) term.focus();   // não roubar o teclado de outro painel (Fase 5)
      };

      ws.onmessage = function (ev) {
        var data = new Uint8Array(ev.data);
        if (data.length === 0) return;
        var cmd = data[0];
        var payload = data.subarray(1);
        if (cmd === 48) {                                 // '0' OUTPUT
          term.write(payload);
          lastOutputAt = Date.now();
          localNotified = false;
        }
        else if (cmd === 49) { /* '1' window title */ }
        else if (cmd === 50) { /* '2' preferences */ }
      };

      ws.onclose = function () {
        if (manualClose) return;
        setStatus("err", "Sem conexão");
        // Terminal encerrado POR FORA? Se o nome sumiu da lista, o painel entra em "encerrado" e
        // RENDERIZA (nunca derruba os outros). Se ainda existe (blip de rede), reconecta.
        refreshSessions().then(function () {
          if (manualClose) return;
          var alive = knownSessions.some(function (x) { return x.name === SESSION; });
          if (!alive && sessionsProbeOk) { markDead(); return; }
          scheduleReconnect();
        });
      };
      ws.onerror = function () { /* onclose handles retry */ };
    }

    function scheduleReconnect() {
      if (reconnectTimer) return;
      reconnectTimer = setTimeout(function () {
        reconnectTimer = null;
        connect();
      }, backoff);
      backoff = Math.min(backoff * 1.7, 8000);
    }
    /** Reconexão manual (botão ↻): reabre o socket já. */
    function reconnectNow() {
      backoff = 500;
      if (ws) { manualClose = true; try { ws.close(); } catch (e) {} }
      connect();
    }
    /** Troca o terminal DESTE painel para `name` SEM recarregar a página (Fase 3): fecha o ws com
     *  manualClose, zera fila/backoff/sino, limpa a tela e reconecta. É a mudança estrutural que o
     *  código de painel único evitou de propósito ("navegar já refaz tudo") — mas com até 4 painéis
     *  navegar destruiria os outros três. */
    function attach(name) {
      if (!name || name === SESSION) return;
      panel.dead = false; el.classList.remove("dead");     // sair do estado "encerrado" ao anexar
      manualClose = true;
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      backoff = 500;
      pending = []; pendingWarned = false;
      if (bellOn) { armBell(false); bellOn = false; chromeBellChanged(panel); }   // desarma o watch da sessão antiga
      lastOutputAt = Date.now(); localNotified = true;
      setCtrl(false);
      hideToBottom();
      stopGlide();
      try { term.reset(); } catch (e) {}
      SESSION = name;
      panel.session = name;
      sessionRestored = false;
      setStatus("warn", "Conectando…");
      if (panel === focusedPane()) renderIdentity();
      // Qualquer painel que troca de terminal muda o conjunto que o medidor tem de ler — não só o
      // focado, agora que o contexto é pintado nos quatro cabeçalhos.
      try { pollMeter(); } catch (e) {}
      renderPaneRow(); renderPaneHead(panel);
      savePanelLayout();                                // a grade mudou (este painel troca de terminal)
      connect();
    }

    /** Terminal morto por fora: o painel entra em "encerrado" e para de reconectar. */
    function markDead() {
      panel.dead = true;
      el.classList.add("dead");
      setStatus("err", "Encerrado");
      renderPaneHead(panel);
      if (panel === focusedPane()) renderIdentity();
    }
    /** Fecha o painel de vez (closePanel): fecha o ws com manualClose, descarta o xterm, remove nós.
     *  O terminal SEGUE rodando no servidor — quem mata é o ⏻ do seletor, nunca aqui. */
    function dispose() {
      manualClose = true;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (ws) { try { ws.close(); } catch (e) {} ws = null; }
      if (bellOn) { try { armBell(false); } catch (e) {} }
      try { clearInterval(bellIdleTimer); } catch (e) {}     // não deixe timers do painel morto vazarem
      try { clearInterval(bellWatchTimer); } catch (e) {}
      stopGlide();
      try { term.dispose(); } catch (e) {}
      if (el.parentNode) el.parentNode.removeChild(el);
    }

    // ── input + Ctrl arming ────────────────────────────────────
    var ctrlArmed = false;
    function setCtrl(on) {
      ctrlArmed = on;
      chromeCtrlChanged(panel);                // repinta o botão Ctrl da barra (se este for o focado)
    }
    term.onData(function (d) {
      // Ctrl-arm: next single letter → control code
      if (ctrlArmed && d.length === 1) {
        var lc = d.toLowerCase();
        if (lc >= "a" && lc <= "z") {
          sendInput(String.fromCharCode(lc.charCodeAt(0) - 96));
          setCtrl(false);
          return;
        }
        if (d === "[" || d === "]" || d === "\\" || d === "_" || d === "^") {
          var map = { "[": 27, "]": 29, "\\": 28, "^": 30, "_": 31 };
          sendInput(String.fromCharCode(map[d]));
          setCtrl(false);
          return;
        }
      }
      sendInput(d);
    });

    // Ctrl/Cmd+F busca · Ctrl/Cmd+K paleta · Ctrl/Cmd+V não vai ao pty. Engolidos ANTES do xterm.
    term.attachCustomKeyEventHandler(function (e) {
      // Shift+Enter → nova linha (sem enviar). Mandamos '\n' (0x0a = Ctrl+J), que o Claude Code trata
      // como quebra de linha em QUALQUER terminal (é o atalho Ctrl+J documentado) e — ao contrário da
      // sequência CSI-u que os emuladores emitem para Shift+Enter — atravessa o tmux SEM precisar de
      // `extended-keys` (que o servidor tmux daqui não liga). Em bash equivale ao Enter (aceitável).
      if (e.type === "keydown" && e.key === "Enter" && e.shiftKey && !e.ctrlKey && !e.metaKey && !e.altKey) {
        e.preventDefault();
        sendInput("\n");
        return false;
      }
      if (e.type === "keydown" && (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "f" || e.key === "F")) {
        e.preventDefault();
        openFind();
        return false;
      }
      if (e.type === "keydown" && (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "k" || e.key === "K")) {
        e.preventDefault();
        openPalette();
        return false;
      }
      // Ctrl/Cmd+V NÃO pode chegar ao pty (o Claude do outro lado leria o clipboard DO SERVIDOR).
      // Devolver false só impede o xterm de ENVIAR; NÃO chamamos preventDefault (é ele que faria o
      // navegador deixar de emitir o evento `paste`, do qual dependem upload e colagem).
      if (e.type === "keydown" && (e.ctrlKey || e.metaKey) && !e.altKey && (e.key === "v" || e.key === "V")) {
        return false;
      }
      return true;
    });

    // ── toast: aviso da PÁGINA sobre este painel (o evento é dele) ─
    //
    // NUNCA escrever no buffer do xterm. Do outro lado roda um TUI de tela cheia (o Claude Code),
    // que mantém o próprio modelo de onde cada linha está e redesenha por posição absoluta. Injetar
    // duas quebras de linha e um texto NOSSO no meio rola o conteúdo dele sem que ele saiba: o
    // redesenho seguinte sai por cima do que sobrou, e a tela fica embaralhada até o operador rolar
    // para cima e para baixo (o que repinta a partir do buffer e disfarça o estrago). Era
    // exatamente o defeito de colar uma imagem — as duas mensagens do upload, "enviando…" e o
    // caminho inserido, caíam dentro da caixa de prompt que o Claude estava desenhando.
    //
    // Um elemento HTML sobre o painel diz a mesma coisa sem tocar no que o TUI acredita ter na tela.
    function toast(msg, color) {
      var t = document.createElement("div");
      t.className = "pane-toast " + (TOAST_TONE[String(color == null ? "33" : color)] || "warn");
      t.textContent = msg;                       // textContent: a mensagem carrega nome de arquivo
      t.title = "Clique para dispensar";
      var killer = null;
      function drop() {
        if (killer) { clearTimeout(killer); killer = null; }
        t.classList.add("out");
        setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
      }
      t.addEventListener("click", drop);
      toastLayer.appendChild(t);
      // Só os três últimos ficam de pé: o painel existe para ler o terminal, não os nossos avisos.
      // Uma PERGUNTA de pé nunca é despejada para caber um aviso — some sem resposta seria pior que
      // não ter perguntado, e o operador ficaria sem saber o que aconteceu com o clique dele.
      while (toastLayer.childElementCount > 3) {
        var oldest = null;
        for (var i = 0; i < toastLayer.children.length; i++) {
          if (!toastLayer.children[i].classList.contains("pane-confirm")) { oldest = toastLayer.children[i]; break; }
        }
        if (!oldest) break;
        toastLayer.removeChild(oldest);
      }
      killer = setTimeout(drop, String(color) === "31" ? 9000 : 5000);   // erro fica mais tempo
    }

    /**
     * A CONFIRMAÇÃO inline deste painel → Promise<boolean>. Mesma camada e mesmo motivo do `toast`
     * acima (nada pode ser escrito no buffer do xterm), mas com as regras de uma pergunta: NÃO expira
     * sozinha, não se dispensa com um clique solto, Enter confirma e Esc cancela.
     *
     * O listener de teclado é em CAPTURA e no `document`: o foco costuma estar dentro do xterm, que
     * consome as teclas antes de qualquer coisa — sem captura, Esc e Enter nunca chegariam aqui.
     */
    function confirmInline(msg, okLabel) {
      return new Promise(function (resolve) {
        var box = document.createElement("div");
        box.className = "pane-toast pane-confirm";
        var text = document.createElement("div");
        text.textContent = msg;                    // textContent: a mensagem carrega nome de sessão
        box.appendChild(text);
        var row = document.createElement("div"); row.className = "row";
        var ok = document.createElement("button"); ok.type = "button"; ok.className = "danger";
        ok.textContent = okLabel || "Confirmar";
        var no = document.createElement("button"); no.type = "button"; no.textContent = "Cancelar";
        row.appendChild(no); row.appendChild(ok); box.appendChild(row);
        var done = false;
        function finish(v) {
          if (done) return; done = true;
          document.removeEventListener("keydown", onKey, true);
          if (box.parentNode) box.parentNode.removeChild(box);
          resolve(v);
        }
        function onKey(e) {
          if (e.key !== "Escape" && e.key !== "Enter") return;
          e.preventDefault(); e.stopPropagation();
          finish(e.key === "Enter");
        }
        ok.addEventListener("click", function () { finish(true); });
        no.addEventListener("click", function () { finish(false); });
        document.addEventListener("keydown", onKey, true);
        toastLayer.appendChild(box);
        setTimeout(function () { try { ok.focus(); } catch (e) {} }, 0);
      });
    }

    // ── Upload de imagem (o input #imgfile é global; o alvo é ESTE painel) ──
    var uploading = false;
    function uploadImage(file) {
      if (!file) return;
      if (uploading) { toast("[imagem] aguarde o envio anterior terminar."); return; }
      if (!/^image\//.test(file.type || "")) { toast("[imagem] arquivo não é uma imagem."); return; }
      uploading = true;
      toast("[imagem] enviando " + (file.name || "imagem") + "…", "36");
      var fd = new FormData();
      fd.append("file", file, file.name || "image");
      fetch("/api/terminal/upload", { method: "POST", credentials: "include", body: fd })
        .then(function (r) { return r.json().catch(function () { return { ok: false, error: "resposta inválida (" + r.status + ")" }; }); })
        .then(function (j) {
          if (j && j.ok && j.path) {
            sendInput(j.path + " ");                 // path lands at the cursor in the prompt
            toast("[imagem] " + j.rel + " — caminho inserido no prompt.", "32");
            term.focus();
          } else {
            toast("[imagem] falha: " + ((j && j.error) || "erro desconhecido"), "31");
          }
        })
        .catch(function () { toast("[imagem] erro de rede ao enviar.", "31"); })
        .finally(function () { uploading = false; });
    }
    // Desktop: drag-and-drop an image onto THIS panel's body.
    body.addEventListener("dragover", function (e) { e.preventDefault(); body.classList.add("dropping"); });
    body.addEventListener("dragleave", function (e) { if (e.target === body) body.classList.remove("dropping"); });
    body.addEventListener("drop", function (e) {
      e.preventDefault(); body.classList.remove("dropping");
      var dt = e.dataTransfer;
      if (dt && dt.files && dt.files[0]) uploadImage(dt.files[0]);
    });

    // ── Colar um BLOCO (varias linhas) tem de chegar como bloco ──
    function sendPaste(text) {
      if (!text) return;
      if (typeof term.paste === "function") { term.paste(text); return; }
      sendInput(text.replace(/\r\n?/g, "\n"));
    }

    // ── Texto do scrollback (para o overlay e o "copiar") ──
    function fullScrollbackText() {
      var buf = term.buffer.active;
      var n = buf.length;                 // whole scrollback, not just the viewport
      var lines = [];
      for (var i = 0; i < n; i++) {
        var line = buf.getLine(i);
        lines.push(line ? line.translateToString(true) : "");
      }
      return lines.join("\n").replace(/\s+$/, ""); // drop trailing blank lines
    }
    function viewportText() {
      var buf = term.buffer.active;
      var top = buf.viewportY;
      var lines = [];
      for (var i = 0; i < term.rows; i++) {
        var line = buf.getLine(top + i);
        if (line) lines.push(line.translateToString(true));
      }
      return lines.join("\n").replace(/\s+$/, "");
    }

    // ── Tamanho da fonte (por painel; a pref global é só o valor inicial de painel novo) ──
    function setFontSize(n) {
      var next = clampFont(n);
      if (next === term.options.fontSize) return;
      term.options.fontSize = next;
      prefSet("webterm.fontSize", next);
      fit();
    }

    // ── Aviso de "terminou" (sino de silêncio) — POR PAINEL ────
    var bellOn = false;
    var lastOutputAt = Date.now();
    var localNotified = true;   // começa "já notificado": nada a anunciar antes da primeira saída

    /**
     * Arma/desarma (e renova) a campainha do servidor para ESTA sessão, e ADOTA o limiar que ele
     * devolve. Quem define "quieto" é o vigia do servidor — o mesmo estado alimenta o balão do Jido e
     * o `claude_sessions`; um limiar próprio aqui seria uma segunda verdade que envelhece sozinha
     * (esta página já carregava um `IDLE_MS = 25000` paralelo ao do servidor, que por acaso batia).
     * O detector LOCAL segue existindo — ele é o que avisa com a aba aberta —, agora sincronizado.
     */
    function armBell(enable) {
      return fetch("/api/terminal/watch", {
        method: "POST",
        credentials: "include",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ session: SESSION, enabled: !!enable }),
      })
        .then(function (r) { return r.json(); })
        .then(function (j) { if (j && typeof j.idleMs === "number" && j.idleMs > 0) IDLE_MS = j.idleMs; })
        .catch(function () { /* sem campainha no servidor; o fallback local segue valendo */ });
    }
    async function toggleBell() {
      if (bellOn) {
        bellOn = false;
        chromeBellChanged(panel);
        await armBell(false);
        toast("[aviso] desligado.", "33");
        return;
      }
      var perm = "denied";
      try { perm = await Notification.requestPermission(); } catch (e) {}
      if (perm !== "granted") {
        toast("[aviso] o navegador negou as notificações.", "31");
        return;
      }
      var pushed = await subscribePush();
      bellOn = true;
      chromeBellChanged(panel);
      await armBell(true);
      toast(
        pushed
          ? "[aviso] ligado — chega push quando a sessão ficar quieta, mesmo com a aba fechada."
          : "[aviso] ligado (só com esta aba aberta — push indisponível aqui).",
        "32",
      );
    }
    /** Notificação local — só com a aba FORA de vista. */
    function notifyLocal() {
      if (document.visibilityState === "visible") return;
      var opts = {
        body: "A sessão “" + SESSION + "” parou de produzir saída.",
        tag: "terminal:" + SESSION,          // mesma tag do push → o SO colapsa em uma só
        icon: "/icon-192.png",
        badge: "/icon-192.png",
        lang: "pt-BR",
        data: { url: "/terminal?b=" + encodeURIComponent(SESSION) },
      };
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        navigator.serviceWorker.getRegistration().then(function (reg) {
          if (reg && reg.showNotification) reg.showNotification("O terminal ficou quieto", opts);
          else try { new Notification("O terminal ficou quieto", opts); } catch (e) {}
        }).catch(function () {});
      } else {
        try { new Notification("O terminal ficou quieto", opts); } catch (e) {}
      }
    }
    // Detector local de silêncio (o servidor tem o dele com push). Um timer por painel — barato.
    // Guardados para o dispose() limpar quando o painel é fechado (senão vazam e ficam batendo
    // armBell de um painel morto a cada 10min).
    var bellIdleTimer = setInterval(function () {
      if (!bellOn || localNotified) return;
      if (Date.now() - lastOutputAt >= IDLE_MS) {
        localNotified = true;
        notifyLocal();
      }
    }, 3000);
    // Renova o watch do servidor enquanto a página viver — é o TTL que mata o watch de uma aba fechada.
    var bellWatchTimer = setInterval(function () { if (bellOn) armBell(true); }, 10 * 60000);

    // ── Voltar ao prompt anterior (o servidor é dono do padrão de busca) ──
    async function jumpToLastPrompt() {
      try {
        var r = await fetch("/api/terminal/scroll", {
          method: "POST", credentials: "include", headers: { "content-type": "application/json" },
          body: JSON.stringify({ name: SESSION, action: "last-prompt" }),
        });
        var j = await r.json().catch(function () { return null; });
        if (!j || !j.ok) { toast("[histórico] Não consegui procurar no histórico deste terminal.", "33"); return; }
        if (!j.found) { toast("[histórico] Não achei nenhum prompt anterior neste terminal.", "33"); return; }
        showToBottom();                              // estamos no passado: a pílula precisa aparecer
      } catch (e) {
        toast("[prompt] não consegui procurar no histórico.", "33");
      }
    }

    // ── The enriched object for THIS panel's session (or null before the first fetch) ──
    function currentSession() {
      for (var i = 0; i < knownSessions.length; i++) if (knownSessions[i].name === SESSION) return knownSessions[i];
      return null;
    }

    // ════════════════════════════════════════════════════════════════════════════════════
    //  ROLAGEM POR TOQUE + GESTOS — o conserto da reclamação nº1 do celular.
    //  Copiado do código de painel único; as variáveis de gesto são LOCAIS deste painel (de graça,
    //  por instância) e `e.touches` virou `e.targetTouches` para dois painéis não somarem dedos.
    // ════════════════════════════════════════════════════════════════════════════════════
    var touchY = 0, touchMoved = false, touchLastT = 0, touchVel = 0, glideTimer = null;
    var pinchFitAt = 0;
    var G = { x0: 0, y0: 0, t0: 0, axis: null, active: 0, maxFingers: 0, pressTimer: null,
              tapT: 0, tapX: 0, tapY: 0, pinchD0: 0, pinchF0: 13, pinched: false, twoDy: 0, twoT0: 0 };

    /** A tela do xterm — `.xterm-screen` existe em TODOS os renderers. */
    function screenEl() {
      try { return term.element.querySelector(".xterm-screen") || term.element; } catch (e) { return null; }
    }
    /** Altura de uma linha em px — a unidade em que o xterm converte deltaY (DOM_DELTA_PIXEL). */
    function rowHeight() {
      var s = screenEl();
      var h = s && term.rows ? s.getBoundingClientRect().height / term.rows : 0;
      return h > 1 ? h : 18;
    }
    // Quanto o outro lado anda por "notch" de roda. MEDIDO: o tmux rola CINCO linhas por notch.
    function wheelScale() {
      try { return term.element.classList.contains("enable-mouse-events") ? TMUX_LINES_PER_NOTCH : 1; }
      catch (e) { return 1; }
    }
    // O xterm escuta `wheel` no PRÓPRIO elemento; despachamos lá, com coordenadas DENTRO dele.
    function wheelBy(deltaY) {
      var s = screenEl();
      if (!s) return;
      deltaY = deltaY / wheelScale();
      var r = s.getBoundingClientRect();
      if (!r.width || !r.height) return;
      try {
        s.dispatchEvent(new WheelEvent("wheel", {
          deltaY: deltaY, deltaMode: 0,
          clientX: r.left + r.width / 2, clientY: r.top + r.height / 2,
          bubbles: true, cancelable: true,
        }));
      } catch (e) { /* WheelEvent indisponível: sem rolagem por toque, nada mais quebra */ }
    }
    function stopGlide() { if (glideTimer) { clearInterval(glideTimer); glideTimer = null; } }

    function clearPress() { if (G.pressTimer) { clearTimeout(G.pressTimer); G.pressTimer = null; } }
    function fingerDist(e) {
      var a = e.targetTouches[0], b = e.targetTouches[1];
      var dx = b.clientX - a.clientX, dy = b.clientY - a.clientY;
      return Math.sqrt(dx * dx + dy * dy);

      G.x0 = t.clientX;
      G.y0 = t.clientY;

      if (e.targetTouches.length >= 2) {

        clearPress();

        G.pinchF0 = term.options.fontSize;
        G.twoDy = 0;
        G.twoT0 = Date.now();

      }
      // (2) Dois dedos: pinça (fonte) ou arrasto conjunto (seletor). Zero código em comum com a rolagem.
      if (e.targetTouches.length >= 2) { onTwoFingerMove(e); e.preventDefault(); return; }
      if (e.targetTouches.length !== 1) return;
      var y = e.targetTouches[0].clientY;

      if (G.axis === null) {

        G.active = remaining;
        if (remaining === 1) {
          rebaseTo(e.targetTouches[0]);

      var wasSingle = G.maxFingers === 1;
      var axis = G.axis;
      G.active = 0;
      G.maxFingers = 0;
      G.axis = null;

      if (wasMulti) { commitTwoFinger(); return; }

      G.maxFingers = 0;

    // ── Toque longo: abre o overlay de texto selecionável deste painel ──
    function onLongPress() {

      touchMoved = true;                             // engole o foco (senão o teclado sobe atrás do overlay)
      openTextOverlay(panel);
    }

    // ── Toque duplo: copia a palavra sob o dedo ──
    function cellAt(clientX, clientY) {
      var s = screenEl();
      if (!s || !term.cols || !term.rows) return null;
      var r = s.getBoundingClientRect();
      if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null;
      var rh = rowHeight(), cw = r.width / term.cols;
      if (!(rh > 0) || !(cw > 0)) return null;
      var row = Math.floor((clientY - r.top) / rh), col = Math.floor((clientX - r.left) / cw);
      if (row < 0 || row >= term.rows || col < 0 || col >= term.cols) return null;
      return { row: row, col: col };
    }
    function wordAt(row, col) {
      try {
        var buf = term.buffer.active;
        var line = buf.getLine(buf.viewportY + row);
        if (!line) return "";
        var text = line.translateToString(true);
        if (col >= text.length || !WORD_CHAR.test(text.charAt(col))) return "";
        var a = col, b = col;
        while (a > 0 && WORD_CHAR.test(text.charAt(a - 1))) a--;
        while (b < text.length - 1 && WORD_CHAR.test(text.charAt(b + 1))) b++;
        return text.slice(a, b + 1);
      } catch (e) { return ""; }
    }
    /** O navegador emite mouse sintético DEPOIS do touchend; engolimos os do segundo toque. */
    function swallowTapClicks() {
      var s = screenEl();
