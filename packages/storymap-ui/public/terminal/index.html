      var kill = function (ev) { ev.stopPropagation(); ev.preventDefault(); };
      var types = ["mousedown", "mouseup", "click"];
      types.forEach(function (t) { s.addEventListener(t, kill, true); });
      setTimeout(function () {
        types.forEach(function (t) { s.removeEventListener(t, kill, true); });
      }, 400);
    }
    function onTapEnd(e) {
      var ct = e.changedTouches && e.changedTouches[0];
      if (!ct) return;
      var now = Date.now();
      if (now - G.tapT < 350 && Math.abs(ct.clientX - G.tapX) < 24 && Math.abs(ct.clientY - G.tapY) < 24) {
        G.tapT = 0;                                  // um toque duplo não arma um triplo
        var cell = cellAt(ct.clientX, ct.clientY);
        var w = cell ? wordAt(cell.row, cell.col) : "";
        if (!w) return;
        swallowTapClicks();
        haptic(10);
        void copyText(w, "[copiar] " + w);
        return;
      }
      G.tapT = now; G.tapX = ct.clientX; G.tapY = ct.clientY;
    }
    async function copyText(s, okMsg) {
      if (!s) return;
      try {
        await navigator.clipboard.writeText(s);
        toast(okMsg || "[copiar] Copiado.", "32");
      } catch (e) {
        toast("[copiar] O navegador não deu acesso à área de transferência.", "33");
      }
    }

    // ── Dois dedos: pinça muda a fonte · arrasto junto abre o seletor ──
    function onTwoFingerMove(e) {
      var d = fingerDist(e);
      if (!G.pinchD0 || !d) return;
      G.twoDy = (e.targetTouches[0].clientY + e.targetTouches[1].clientY) / 2 - G.y0;
      var ratio = d / G.pinchD0;
      if (Math.abs(ratio - 1) <= PINCH_RATIO_MIN) return;   // ainda pode virar arrasto conjunto
      G.pinched = true;
      var next = clampFont(G.pinchF0 * ratio);
      if (next === term.options.fontSize) return;
      term.options.fontSize = next;
      // Só o layout local durante o gesto; o resize de verdade sai UMA vez, no commit.
      var now = Date.now();
      if (now - pinchFitAt >= 100) {
        pinchFitAt = now;
        try { fitAddon.fit(); } catch (err) {}
      }
    }
    function commitTwoFinger() {
      if (G.pinched) {
        G.pinched = false;
        prefSet("webterm.fontSize", term.options.fontSize);
        fit();                                       // agora sim: um único quadro de resize
        toast("[fonte] " + term.options.fontSize + "px", "32");
        return;
      }
      if (G.twoDy >= 64 && Date.now() - G.twoT0 < 1200) { haptic(12); openPaletteFor(panel); }
    }

    // ── Deslize lateral: sessão anterior / próxima (troca o terminal DESTE painel) ──
    function maybeSwitchSession(dx, dy, dt) {
      if (PANELS.length !== 1) return;                                  // com grade montada, swipe está OFF
      if (!knownSessions.length || sessionsProbeOk === false) return;   // sem lista, sem palpite
      if (Math.abs(dx) < Math.max(96, 0.4 * window.innerWidth)) return;
      if (Math.abs(dx) <= 3 * Math.abs(dy)) return;
      if (Math.abs(dx) / Math.max(1, dt) < 0.3) return;                 // exige intenção, não deriva
      var list = sortedSessions(), idx = -1;
      for (var i = 0; i < list.length; i++) if (list[i].name === SESSION) idx = i;
      if (idx < 0) return;
      var next = dx < 0 ? list[idx + 1] : list[idx - 1];                // arrastar p/ ESQUERDA avança
      if (!next) return;                                                // sem dar a volta: ponta é ponta
      haptic(12);
      attach(next.name);                                                // troca in-place (Fase 3)
    }

    // ── Pílula "voltar ao fim" (por painel) ──
    function showToBottom() { toBottomBtn.hidden = false; }
    function hideToBottom() { toBottomBtn.hidden = true; }
    toBottomBtn.addEventListener("pointerdown", function (e) { e.preventDefault(); });
    toBottomBtn.addEventListener("click", function (e) {
      e.preventDefault();
      haptic(8);
      stopGlide();
      var step = rowHeight() * 10;
      for (var i = 0; i < 40; i++) wheelBy(step);    // ~400 linhas: cobre o que um dedo alcança
      hideToBottom();
      term.focus();
    });
    // Digitou = voltou a agir; a pílula não tem mais o que oferecer. `onKey` e NÃO `onData` (os
    // relatórios de mouse da rolagem também saem por onData).
    term.onKey(function () { if (!toBottomBtn.hidden) hideToBottom(); });

    // Tocar no terminal foca (chama o teclado virtual) — mas ROLAR não é tocar.
    body.addEventListener("click", function () {
      if (touchMoved) { touchMoved = false; return; }
      term.focus();
    });

    // ── Foco explícito (Fase 2) ──
    // (a) pointerdown em fase de CAPTURA no wrap: elege este painel ANTES de qualquer coisa, mesmo
    //     quando o gesto vira rolagem (o clique que desiste com touchMoved deixaria a 1ª tecla ir
    //     para lugar nenhum). (b) o foco nativo da textarea do xterm também elege (clique de mouse,
    //     Tab do teclado). Nenhum dos dois chama term.focus() — quem faz isso é o click de toque.
    el.addEventListener("pointerdown", function () { focusPanel(panel); }, true);
    if (term.textarea) term.textarea.addEventListener("focus", function () { focusPanel(panel); });

    // ── Métodos públicos: o cromo global age contra o painel em foco ──
    panel.term = term;
    panel.searchAddon = searchAddon;
    panel.connect = connect;
    panel.reconnectNow = reconnectNow;
    panel.attach = attach;
    panel.dispose = dispose;
    panel.sendInput = sendInput;
    panel.sendPaste = sendPaste;
    panel.toast = toast;
    panel.confirm = confirmInline;
    panel.fit = fit;
    panel.focus = function () { try { term.focus(); } catch (e) {} };
    panel.jumpToLastPrompt = jumpToLastPrompt;
    panel.setFontSize = setFontSize;
    panel.fontSize = function () { return term.options.fontSize; };
    panel.currentSession = currentSession;
    panel.uploadImage = uploadImage;
    panel.toggleBell = toggleBell;
    panel.bellIsOn = function () { return bellOn; };
    panel.setCtrl = setCtrl;
    panel.toggleCtrl = function () { setCtrl(!ctrlArmed); };
    panel.ctrlIsArmed = function () { return ctrlArmed; };
    panel.fullScrollbackText = fullScrollbackText;
    panel.viewportText = viewportText;
    panel.findNext = function (q, o) { if (q) searchAddon.findNext(q, o); };
    panel.findPrev = function (q, o) { if (q) searchAddon.findPrevious(q, o); };
    panel.clearFind = function () { if (searchAddon.clearDecorations) searchAddon.clearDecorations(); };

    PANELS.push(panel);
    return panel;
  } // ── fim de createPanel ──

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  CROMO GLOBAL — age sobre o painel em foco (focusedPane()).
  // ════════════════════════════════════════════════════════════════════════════════════════


  // ── Identidade (Fase 6): saiu da barra superior — cada terminal se identifica no cabeçalho do SEU
  //    painel (renderPaneHead). renderIdentity vira no-op, mantida só para não caçar call sites. ──
  function renderIdentity() {}

  // ── Medidor: contexto do Claude do painel em foco + cota da conta ─
  function narrowBar() {
    try { return window.innerWidth < 560; } catch (e) { return false; }
  }
  var meterEl = document.getElementById("meter");
  // `bySession`: nome do terminal → o bloco de sessão do medidor (contexto/claude/custo) daquele
  // painel. O medidor pede TODOS os painéis abertos numa requisição (ver pollMeter), porque o
  // contexto é por painel e o operador que abriu quatro precisa ver os quatro — não só o em foco.
  var meterState = { data: null, probeOk: null, bySession: {} };
  var meterInFlight = false;

  function renderMeter() {
    var d = meterState.data;
    meterEl.innerHTML = "";
    meterEl.classList.remove("est");
    if (!d) { meterEl.hidden = true; fitIfChromeChanged(); return; }

    var parts = [];
    // O CONTEXTO saiu da barra (Fase 6): vive no cabeçalho de cada painel (renderPaneHead). Aqui fica
    // só a COTA da conta — que é da assinatura, não de uma sessão, e por isso aparece UMA vez.

    if (d.quota && d.quota.buckets && d.quota.buckets.length) {
      var q = d.quota;
      var b = null;
      for (var i = 0; i < q.buckets.length; i++) {
        if (q.buckets[i].burn && q.buckets[i].burn.willExceedBeforeReset) { b = q.buckets[i]; break; }
      }
      if (!b) for (var j = 0; j < q.buckets.length; j++) if (q.buckets[j].id === "week") b = q.buckets[j];
      if (!b) b = q.buckets[0];

      var rest = fmtMins(b.resetsInMinutes);
      var qtxt = (q.approximate ? "≈ " : "") + (BUCKET_LABEL[b.id] || b.id) + " " + Math.round(b.usedPct) + "%";
      if (rest && !narrowBar()) qtxt += " · renova em " + rest;
      var qc = chip("quota", qtxt);
      var qwhy = [Math.round(b.usedPct) + "% da " + (BUCKET_LABEL[b.id] || b.id).toLowerCase() + " já foi usada."];
      if (rest) qwhy.push("Renova em " + rest + ".");
      qwhy.push(q.approximate
        ? "Número ESTIMADO pelo ccusage contra um limite suposto — não é a cota real da assinatura."
        : "Número real, vindo da assinatura.");
      if (q.stale && q.polledAt) qwhy.push("Última leitura de " + shortAge(q.polledAt) + " atrás.");
      qc.title = qwhy.join(" ");
      parts.push(qc);
      if (!q.approximate) { var qt = track(b.usedPct); if (qt) parts.push(qt); }
      // O chip "acaba em ~X dias, antes de renovar" foi removido: repetia o "renova em X" do chip
      // ao lado (o mesmo prazo, duas vezes) e poluía a barra. O bucket em risco de estourar antes de
      // renovar ainda é o ESCOLHIDO acima, então a % mostrada já é a mais crítica.
      if (q.stale) meterEl.classList.add("est");
    } else if (d.quotaError) {
      var qe = chip("quota dim", "Cota indisponível");
      qe.title = "Não consegui ler a cota: " + String(d.quotaError);
      parts.push(qe);
    }

    // RAM da caixa. Fica ao lado da cota porque as duas respondem à mesma pergunta antes de você
    // abrir mais um agente: "ainda cabe?". A cota é da assinatura; a RAM é da máquina — e é a que
    // mata os terminais que estão nesta tela quando acaba.
    if (d.ram && d.ram.totalBytes) {
      var used = Math.round(d.ram.usedPct);
      var gbU = (d.ram.usedBytes / 1073741824).toFixed(1);
      var gbT = (d.ram.totalBytes / 1073741824).toFixed(1);
      var rc = chip("quota" + (used >= 90 ? " hot" : ""), "RAM " + used + "%");
      rc.title = gbU + " GB de " + gbT + " GB em uso na VPS."
        + (used >= 90 ? " Acima de 90% — abrir mais um agente aqui arrisca derrubar os que já rodam." : "");
      parts.push(rc);
      if (!narrowBar()) { var rt = track(used); if (rt) parts.push(rt); }
    }

    if (meterState.probeOk === false) meterEl.classList.add("est");

    if (!parts.length) { meterEl.hidden = true; fitIfChromeChanged(); return; }
    for (var k = 0; k < parts.length; k++) meterEl.appendChild(parts[k]);
    meterEl.hidden = false;
    fitIfChromeChanged();
  }

  /** Os terminais de TODOS os painéis abertos, o em foco primeiro (o `session` singular da resposta
   *  é o primeiro nome pedido). Sem repetidos: dois painéis podem mostrar o MESMO terminal. */
  function meterTargets() {
    var out = [];
    var f = focusedPane();
    if (f && f.session) out.push(f.session);
    for (var i = 0; i < PANELS.length; i++) {
      var s = PANELS[i].session;
      if (s && out.indexOf(s) < 0) out.push(s);
    }
    return out;
  }

  async function pollMeter() {
    if (meterInFlight) return;
    var targets = meterTargets();
    if (!targets.length) return;
    meterInFlight = true;
    var ctl = null, killer = null;
    try { ctl = new AbortController(); } catch (e) { ctl = null; }
    if (ctl) killer = setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 10000);
    try {
      var qs = targets.map(function (s) { return "b=" + encodeURIComponent(s); }).join("&");
      var r = await fetch("/api/terminal/meter?" + qs,
        { credentials: "include", cache: "no-store", signal: ctl ? ctl.signal : undefined });
      if (!r.ok) { meterState.probeOk = false; renderMeter(); return; }
      var j = await r.json();
      if (j && j.ok) {
        meterState.data = j;
        // Indexa por nome de terminal. `sessions` é o campo novo; `session` (singular) é o antigo e
        // segue sendo lido para uma página aberta ANTES do deploy que trouxe o plural não regredir.
        var map = {};
        var list = (j.sessions && j.sessions.length) ? j.sessions : (j.session ? [j.session] : []);
        for (var i = 0; i < list.length; i++) if (list[i] && list[i].name) map[list[i].name] = list[i];
        meterState.bySession = map;
        meterState.probeOk = true;
      }
      else meterState.probeOk = false;
    } catch (e) {
      meterState.probeOk = false;                 // mantém o retrato anterior, marcado como velho
    } finally {
      if (killer) clearTimeout(killer);
      meterInFlight = false;
      renderMeter();
      renderAllHeads();                       // o contexto vive no cabeçalho de CADA painel
    }
  }

  // ════════════════════════════════════════════════════════════════════════════════════════
  //  A FEATURE (Fase 5): dividir · fechar · ampliar · fileira de painéis · cabeçalho · cortes.
  // ════════════════════════════════════════════════════════════════════════════════════════
  var zoomed = false;

  /** Quantos painéis a GRADE consegue exibir nesta largura (medido na grade, não na janela). */
  function displayCapacity() {
    var w = panesEl.clientWidth || window.innerWidth || 0;
    if (COARSE_POINTER || w < 800) return 1;   // celular / muito estreito: 1 visível (zoom permanente)
    if (w < 1120) return 2;
    if (w < 1280) return 3;
    return 4;
  }

  /** Divide a tela: cria um painel novo (session null) e abre o seletor com alvo = ele. Esc cancela
   *  e o painel NÃO nasce (closePalette remove um painel novo que ficou sem terminal). */
  function splitPanel(from, quiet) {
    if (PANELS.length >= MAX_PANES) {
      paneToast("[painel] Já são " + MAX_PANES + " painéis na tela, o máximo. Feche um para abrir outro.");
      return null;
    }
    var np = createPanel(null, panesEl, false);
    if (from) {                                        // insere logo depois do painel de origem
      var fi = -1; for (var i = 0; i < PANELS.length; i++) if (PANELS[i] === from) fi = i;
      if (fi >= 0 && fi < PANELS.length - 1) {
        PANELS.splice(PANELS.length - 1, 1);
        PANELS.splice(fi + 1, 0, np);
      }
    }
    focusPanel(np);
    layoutPanes();
    renderPaneRow();
    // `quiet`: quem chamou já sabe o que vai colocar aqui (createSessionFlow) — nada de aviso nem
    // de seletor, senão o operador leva um popup no meio de uma ação que ele já escolheu.
    if (quiet) return np;
    if (displayCapacity() < PANELS.length) {
      paneToast("[painel] Abri o painel. Nesta largura mostro um de cada vez — troque pela fileira de painéis.");
    }
    openPaletteFor(np, true);                           // alvo = painel novo; forNew = true
    return np;
  }

  /**
   * A VAGA vira PAINEL: um painel vazio já marcado com o slot `idx`, para nascer exatamente no
   * espaço em que o operador clicou — e não no primeiro buraco da grade.
   */
  function materializeSlot(idx) {
    var p = createPanel(null, panesEl, false);
    p.slot = idx;
    focusPanel(p);
    layoutPanes();
    renderPaneRow();
    renderAllHeads();
    return p;
  }
  /** "Criar terminal" de uma vaga. Desistir da caixa de nome desfaz o painel (quem cuida disso é o
   *  próprio createSessionFlow) — o espaço volta a ser vaga em vez de ficar um painel de enfeite. */
  async function slotCreate(idx) {
    await createSessionFlow(materializeSlot(idx));
  }
  /** "Escolher um terminal" de uma vaga: o seletor com alvo = ESTE espaço. Esc devolve a vaga (é o
   *  mesmo `forNew` do split). */
  function slotPick(idx) {
    openPaletteFor(materializeSlot(idx), true);
  }

  /**
   * Fecha a VISTA — inclusive a última.
   *
   * A recusa que morava aqui ("sempre fica pelo menos um painel aberto") obrigava o operador a
   * manter um terminal de pé para sempre: encerrar o último era negado, e a página ficava exibindo
   * um cartão de morto que ele não podia dispensar. A grade agora aceita ficar VAZIA — o espaço
   * vira uma VAGA, que é justamente onde ele cria ou escolhe o próximo. Ninguém é obrigado a nada.
   *
   * `opts.killed` diz que a sessão já foi encerrada por quem chamou: sem isso o aviso de saída
   * afirmaria "o terminal continua rodando" logo depois de matá-lo — a mesma frase que produziu a
   * confusão dos terminais fantasma, agora do lado errado.
   */
  function closePanel(p, opts) {
    var idx = -1; for (var i = 0; i < PANELS.length; i++) if (PANELS[i] === p) idx = i;
    if (idx < 0) return;
    var deadName = p.session || "";
    p.dispose();
    PANELS.splice(idx, 1);
    var nb = PANELS[idx - 1] || PANELS[idx] || PANELS[0] || null;   // vizinho anterior, senão próximo
    focusPanel(nb);                                          // grade vazia ⇒ null (focusPanel trata)
    if (zoomed && PANELS.length <= 1) zoomed = false;
    layoutPanes();
    renderPaneRow();
    renderAllHeads();
    // A barra fala do CONJUNTO ("3 de 4 conectados"), e fechar uma vista muda o conjunto. Sem isto
    // ela congelava no retrato anterior — e com a grade vazia continuaria anunciando "Conectado"
    // depois de o operador ter encerrado o último terminal.
    paintConn();
    if (opts && opts.killed) paneToast('[terminal] Encerrado: ' + deadName, "32");
    else if (deadName) paneToast('[painel] Fechei a vista. O terminal "' + deadName + '" continua rodando — ele está na lista.', "32");
  }

  /** Amplia (mostra só o focado) ↔ mostra todos. Sem efeito visível quando a largura já força 1. */
  function toggleZoom() {
    zoomed = !zoomed;
    layoutPanes();
    renderPaneRow();
    renderAllHeads();
  }

  /** Título/estado do botão ⛶ de cada painel conforme o modo atual. */
  function updateZoomButtons(single) {
    for (var i = 0; i < PANELS.length; i++) {
      var z = PANELS[i].hZoom;
      if (z) {
        z.title = single ? "Mostrar todos os painéis" : "Ampliar: mostra só este painel";
        z.innerHTML = svgIcon(single ? "minimize-2" : "maximize-2", 15);
      }
    }
  }

  /** Por que este painel não tem leitura de contexto — uma frase DIFERENTE por motivo (o contrato de
   *  honestidade do /api/terminal/meter). Um shell bash não vira "0%", e um agente que existe mas não
   *  foi identificado não vira silêncio. */
  var CTX_ABSENT_WHY = {
    unmapped: "Há um Claude neste terminal, mas não consegui identificar a sessão dele — sem sessão não há transcript, e sem transcript não há leitura honesta.",
    unreadable: "O transcript desta sessão não pôde ser lido.",
    "no-usage": "Sessão nova (ou recém-limpa com /clear): ela já tem um transcript, mas ainda não houve um turno do modelo para medir. O número aparece no primeiro turno."
  };

  /** Leitura de contexto mais velha que isto ganha marca de VELHA (o medidor roda a cada 15s). */
  var CTX_STALE_MS = 2 * 60 * 1000;

  /**
   * O chip de CONTEXTO deste painel. Devolve null só quando não há Claude nenhum ali (um shell bash
   * não tem contexto — "0%" seria mentira). Com Claude vivo o chip aparece SEMPRE: com o número
   * quando há leitura, e com "—" + o motivo no title quando não há.
   */
  function paneCtxChip(p) {
    var ms = (p && p.session) ? meterState.bySession[p.session] : null;
    if (!ms) return null;
    var narrow = !!(p.el && p.el.classList.contains("narrow"));
    var word = narrow ? "Ctx " : "Contexto ";     // estreito: encolhe o rótulo, nunca some o dado
    var ctx = ms.context;

    if (!ctx || ctx.pct == null) {
      if (!ms.claude && ms.contextAbsentReason === "no-claude") return null;
      // "—" queria dizer DUAS coisas incompatíveis: "não consegui ler" (defeito) e "esta sessão é
      // nova / você acabou de dar /clear" (normal). Com o mesmo símbolo, limpar a sessão parecia o
      // medidor quebrando. A sessão nova diz o próprio nome; o "—" fica só para a ignorância.
      var fresh = ms.contextAbsentReason === "no-usage";
      var dim = mkPhChip("ctx dim", word + (fresh ? "novo" : "—"));
      dim.title = CTX_ABSENT_WHY[ms.contextAbsentReason]
        || "Sem leitura de contexto para este terminal.";
      return dim;
    }

    var pct = Math.round(ctx.pct);
    // Uma leitura velha continua sendo a melhor que existe — mas ela não pode se passar por atual.
    // O caso comum: /clear troca o transcript da sessão e o número anterior sobrevive até o próximo
    // ciclo do medidor. Sem esta marca, o operador lê "83%" logo depois de limpar e conclui que a
    // limpeza não funcionou.
    var ageMs = ctx.at ? (Date.now() - Date.parse(ctx.at)) : NaN;
    var old = isFinite(ageMs) && ageMs >= CTX_STALE_MS;
    var cls = "ctx" + (pct >= 90 ? " hot" : pct >= 70 ? " warm" : "") + (old ? " old" : "");
    var c = mkPhChip(cls, word + (old ? "~" : "") + pct + "%");
    var why = [pct + "% da janela de contexto em uso"];
    if (ctx.limit) why[0] += " — " + fmtTokens(ctx.tokens) + " de " + fmtTokens(ctx.limit) + " tokens";
    why[0] += ".";
    if (ctx.model) why.push("Modelo: " + ctx.model + ".");
    if (ctx.compacted) why.push("A sessão já foi compactada — a conta é da janela ATUAL.");
    if (ctx.at) {
      var age = shortAge(Date.parse(ctx.at));
      if (age) why.push("Última leitura de " + age + " atrás" + (old ? " — pode não refletir a sessão de agora." : "."));
    }
    // O caminho `registry` é um transcript PINADO no spawn: ele não acompanha um /clear. Dizer isso é
    // o mínimo — é a única leitura daqui que pode descrever outra conversa.
    if (ctx.source && ctx.source !== "pidfile") {
      why.push("Origem indireta (" + ctx.source + "): pode não acompanhar uma limpeza de sessão.");
    }
    c.title = why.join(" ");
    return c;
  }

  /**
   * O chip de ESTADO deste painel — trabalhando / aguardando você / ocioso / falhou, pela régua do
   * servidor (deriveWorkState). `null` quando não há agente: um bash puro não tem estado a exibir.
   *
   * As palavras repetem `labels.ts` de propósito — esta página é um asset estático que não importa TS.
   * Se a gramática mudar lá, muda aqui: são as duas superfícies do MESMO vocabulário.
   */
  var STATE_WHY = {
    cli: "o próprio Claude reportou este estado",
    run: "processo headless em execução — um turno em andamento",
    stale: "a tela e o transcript deste terminal estão parados — o último estado que o Claude reportou não vale mais",
    status: "só sabemos que o processo existe (sem agente para perguntar)"
  };
  function paneStateChip(p) {
    var ms = (p && p.session) ? meterState.bySession[p.session] : null;
    var w = ms && ms.work;
    if (!w) return null;
    var needsYou = w.state === "waiting" && w.source === "cli";
    // Estreito (3-4 painéis): cai a palavra mais longa, nunca o dado — mesma regra do contexto.
    var narrow = !!(p.el && p.el.classList.contains("narrow"));
    var word, cls;
    if (w.state === "working") { word = "trabalhando"; cls = "work"; }
    else if (w.state === "failed") { word = "falhou"; cls = "err"; }
    else if (w.state === "done") { word = "concluído"; cls = "idle"; }
    else if (needsYou) { word = narrow ? "aguardando" : "aguardando você"; cls = "you"; }
    else { word = "ocioso"; cls = "idle"; }
    var c = mkPhChip("state " + cls, word);
    c.title = (needsYou ? "aguardando você" : word) + " — " + (STATE_WHY[w.source] || "origem desconhecida") + ".";
    return c;
  }

  /** Pinta o cabeçalho de um painel: contexto/nome/branch/custo (da sessão) e conexão. O contexto é
   *  de CADA painel — o medidor pede todos os abertos de uma vez. Split desabilita em n=4. */
  function renderPaneHead(p) {
    if (!p || !p.hConn) return;
    var it = p.currentSession();
    p.hConn.className = "ph-conn " + p.connKind;
    if (p.hNameTxt && !p._renaming) p.hNameTxt.textContent = (it ? it.label : (p.session || "novo"));
    p.hFocus.style.display = (p === focusedPane() && PANELS.length > 1) ? "" : "none";
    p.hInfo.innerHTML = "";
    if (!p.dead) {
      // O CONTEXTO vem primeiro, e de CADA painel — não só do focado. É o número que decide se o
      // agente daquele painel ainda aguenta a próxima tarefa ou está prestes a compactar, e com 3-4
      // painéis abertos ele só serve se estiver nos 3-4 cabeçalhos. É também o único chip que
      // sobrevive à largura estreita (ver o corte de chips no CSS): ali ele encolhe para "Ctx 63%",
      // nunca some.
      var ctxChip = paneCtxChip(p);
      if (ctxChip) p.hInfo.appendChild(ctxChip);
      // O ESTADO vem logo depois do contexto: as duas leituras respondem "como vai este agente", e
      // separá-las com a frase no meio faria o olho ler duas coisas soltas em vez de um par.
      var stChip = paneStateChip(p);
      if (stChip) p.hInfo.appendChild(stChip);
      // A frase "o que está fazendo" é o chip elástico: é o que se lê de relance ao lado do
      // nome/branch. Fonte: derivePhrase (título do pane · detalhe do run · task · comando).
      // Some só quando o próprio rótulo já a contém (ex.: "Agente · <task>" vs frase "<task>").
      if (it && it.phrase && (!it.label || it.label.indexOf(it.phrase) < 0)) {
        var phc = mkPhChip("phrase", it.phrase);
        phc.title = it.phrase;
        p.hInfo.appendChild(phc);
      }
      // O BOARD vem depois da frase e ANTES de branch/custo: é identidade ("de quem é este
      // terminal"), e os dois seguintes são detalhe de execução. Aparece SEMPRE que há uma sessão —
      // inclusive, e principalmente, quando não há board: era esse silêncio que deixava o operador
      // sem entender por que o terminal não estava na home de lugar nenhum.
      var bc = boardChip(it);
      if (bc) p.hInfo.appendChild(bc);
      if (it && it.branch) p.hInfo.appendChild(mkPhChip("branch" + (it.dirty ? " dirty" : ""), "⎇ " + it.branch));
      if (it && it.cost) p.hInfo.appendChild(mkPhChip("cost", "$" + Number(it.cost.usd).toFixed(2)));
    }
    if (p.hSplit) {
      var full = PANELS.length >= 4;
      p.hSplit.disabled = full;
      p.hSplit.title = full ? "Máximo de 4 terminais ao mesmo tempo" : "Dividir: abre outro terminal ao lado";
    }
    if (p.hClose) {
      // O ✕ passou a ser sobre a SESSÃO, não sobre a contagem de painéis — por isso ele NÃO é mais
      // desabilitado no último painel: com um painel só, encerrar o terminal é justamente o caso
      // comum. Quem garante que sempre sobra uma vista aberta é o `closePanel`.
      p.hClose.disabled = false;
      p.hClose.title = p.session ? "Encerrar este terminal" : "Fechar este painel";
    }
  }
  function renderAllHeads() { for (var i = 0; i < PANELS.length; i++) renderPaneHead(PANELS[i]); }

  // ── Fileira de PAINÉIS — a NAVEGAÇÃO entre painéis quando só um cabe na tela (celular/zoom).
  //    Com os painéis lado a lado cada um já tem seu próprio cabeçalho, então a fileira seria
  //    redundante e some; a ação de criar mora no topo (#newterm). ──
  function renderPaneRow() {
    tabbar.innerHTML = "";
    var collapsed = zoomed || PANELS.length > displayCapacity();
    if (PANELS.length <= 1 || !collapsed) { tabbar.classList.remove("show"); fitIfChromeChanged(); return; }
    var cur = focusedPane();
    PANELS.forEach(function (p) {
      var it = p.currentSession();
      var t = document.createElement("button");
      t.type = "button";
      t.className = "tab" + (p === cur ? " current" : "");
      t.title = (it ? it.label : (p.session || "painel novo"));
      var d = document.createElement("span");
      d.className = "tdot" + (p.connKind === "ok" ? " on" : "");
      t.appendChild(d);
      var lbl = document.createElement("span");
      lbl.className = "tlabel";
      lbl.textContent = it ? it.label : (p.session || "novo");
      t.appendChild(lbl);
      t.addEventListener("click", function () { focusPanel(p); layoutPanes(); renderPaneRow(); renderAllHeads(); });
      var x = document.createElement("span");
      x.className = "tclose";
      x.innerHTML = svgIcon("x", 13);
      x.title = "Encerrar este terminal";
      x.addEventListener("click", function (e) { e.stopPropagation(); void closeTerminalFlow(p); });
      t.appendChild(x);
      tabbar.appendChild(t);
    });
    tabbar.classList.add("show");
    fitIfChromeChanged();                        // a fileira de painéis mudou a altura útil
  }

  // ── Operações de sessão (criar / encerrar / fixar / renomear) ─
  /** Sugere `term-2`, `term-3`… — o primeiro livre. Quem só quer mais um terminal aperta Enter. */
  function suggestSessionName() {
    var taken = {};
    sortedSessions().forEach(function (s) { taken[s.name] = 1; });
    for (var i = 2; i < 99; i++) if (!taken["term-" + i]) return "term-" + i;
    return "term";
  }

  /**
   * CRIAR um terminal — a ação que o botão primário da barra faz, direto, sem passar pelo seletor.
   *
   * Antes: "＋ Novo terminal" (barra) chamava splitPanel(), que abria um painel VAZIO e o seletor
   * "qual terminal mostrar aqui"; criar de verdade era um SEGUNDO botão com o MESMO rótulo, no
   * rodapé daquele seletor, atrás de um window.prompt() nativo. Dois botões idênticos fazendo
   * coisas diferentes, e o primário não fazia o que o rótulo dizia — sair no Esc apagava o painel
   * recém-criado e nada acontecia, que é o "não consigo criar o quarto" relatado.
   *
   * Agora: cria a sessão e a abre num painel novo (ou no painel alvo, quando veio do seletor).
   * O nome vem preenchido; Enter basta.
   */
  async function createSessionFlow(targetPane) {
    var name = await askName({
      title: "Novo terminal",
      kind: "slug",
      // Diz POR QUE o formato é restrito aqui — é o que separa esta caixa da de renomear, que não
      // restringe nada. Sem essa frase, as duas eram a mesma caixa com títulos diferentes.
      hint: "Abre um bash na VPS. Este é o nome REAL da sessão (tmux, e vai na URL): letras, números, "
        + "_ e - , até 80. Para um nome bonito, renomeie depois — lá vale qualquer texto.",
      value: suggestSessionName(),
      ok: "Criar",
    });
    // O painel ALVO (o do split, o da vaga) foi aberto para RECEBER este terminal. Se a criação não
    // acontece — cancelou o nome, nome inválido, o servidor recusou, a rede caiu — ele não pode
    // ficar de pé vazio. Um dono só para todos os caminhos de saída: antes cada `catch` lembrava do
    // seu e o CANCELAMENTO não lembrava de nenhum.
    var desfazAlvo = function () { if (targetPane && targetPane.session == null) closePanel(targetPane); };
    if (name == null) { desfazAlvo(); return; }
    name = name.trim();
    if (!name) { desfazAlvo(); return; }
    if (!isSlug(name)) { paneToast("[terminal] Nome inválido. Use letras, números, _ e - (até 80 caracteres).", "31"); desfazAlvo(); return; }
    // Um painel para receber o terminal novo: o alvo que veio do seletor, senão divide a tela.
    // Se a grade já está cheia, o terminal AINDA é criado — ele só abre no painel em foco, em vez
    // de a criação ser recusada por falta de espaço na tela (que é o erro que o operador via).
    var tgt = targetPane || paletteTarget || (PANELS.length < MAX_PANES ? splitPanel(focusedPane(), true) : focusedPane());
    try {
      var r = await fetch("/api/terminal/sessions", {
        method: "POST", credentials: "include", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name }),
      });
      var j = await r.json().catch(function () { return { ok: false }; });
      if (j && j.ok) {
        paletteForNew = false;                               // criou o terminal: o painel novo NASCE
        await afterMutation();
        closePalette();
        if (tgt) { tgt.attach(name); focusPanel(tgt); }       // abre o novo terminal no painel alvo (in-place)
        paneToast("[terminal] Criado: " + name, "32");
      }
      else {
        // A criação falhou → o painel que eu tinha aberto para recebê-la não deve ficar órfão. Vale
        // para o painel que veio de fora também (vaga/split): ele existe SÓ para este terminal.
        paneToast("[terminal] Não consegui criar: " + ((j && j.error) || r.status), "31");
        if (tgt && tgt.session == null) closePanel(tgt);
      }
    } catch (e) {
      paneToast("[terminal] A rede falhou ao criar o terminal.", "31");
      if (tgt && tgt.session == null) closePanel(tgt);
    }
  }
  /** DELETE cru de uma sessão → {ok} ou {ok:false, reason}. O veredito é do SERVIDOR: o `protected`
   *  que a lista traz é só para a interface se explicar antes, nunca a permissão (a rota re-deriva). */
  async function deleteSession(name) {
    try {
      var r = await fetch("/api/terminal/sessions", {
        method: "DELETE", credentials: "include", headers: { "content-type": "application/json" },
        body: JSON.stringify({ name: name }),
      });
      var j = await r.json().catch(function () { return { ok: false }; });
      if (j && j.ok) return { ok: true };
      return { ok: false, reason: (j && (j.reason || j.error)) || ("HTTP " + r.status) };
    } catch (e) { return { ok: false, reason: "a rede falhou" }; }
  }

  /** A frase da pergunta — uma só, para o ✕ e para o Encerrar do seletor dizerem a MESMA coisa. */
  function killQuestion(it, name) {
    return 'Encerrar “' + ((it && it.label) || name) + '”? Tudo que estiver rodando dentro morre.' +
      (it && it.dirty ? " Há alterações não commitadas nesse diretório." : "");
  }

  async function killSessionFlow(it) {
    var p = focusedPane();
    if (it.protected) { paneToast("[terminal] Este terminal é protegido — " + (it.protectReason || "não pode ser encerrado."), "33"); return; }
    // Sem painel (a grade está vazia) não há onde desenhar a pergunta inline — e o `: true` que
    // morava aqui MATAVA sem perguntar. O confirm do navegador é feio, mas a objeção que o proibia
    // ("ele não sabe dizer QUAL painel perguntou") não existe quando não há painel nenhum.
    var yes = p ? await p.confirm(killQuestion(it, it.name), "Encerrar")
                : window.confirm(killQuestion(it, it.name));
    if (!yes) return;
    var r = await deleteSession(it.name);
    if (!r.ok) { paneToast("[terminal] O servidor recusou encerrar: " + r.reason, "31"); return; }
    paneToast("[terminal] Encerrado: " + it.name, "32");
    // Todo painel que exibia o morto FECHA — o espaço vira vaga. Antes ele caía no `shell` em
    // silêncio, que é trocar o terminal que o operador acabou de matar por outro que ele não pediu
    // (e só existia porque um painel era obrigado a mostrar alguma coisa).
    for (var i = PANELS.length - 1; i >= 0; i--) if (PANELS[i].session === it.name) closePanel(PANELS[i]);
    await afterMutation();
  }

  /**
   * O ✕ de um painel: ENCERRA o terminal (com confirmação inline) em vez de só sumir com ele da vista.
   *
   * ERA a origem dos terminais fantasma: fechar deixava a sessão tmux VIVA no servidor, então o
   * operador fechava três terminais, e semanas depois a home listava três nomes que ele não reconhecia
   * — cada um segurando um Claude, contexto e memória. "Fechar" agora quer dizer o que parece querer.
   *
   * Duas saídas continuam sendo só LAYOUT, e nenhuma pergunta nada:
   *   • painel sem sessão (recém-aberto, ainda escolhendo) → só fecha;
   *   • a MESMA sessão aberta em OUTRO painel → fecha só este (dividir e desfazer a divisão é arrumar
   *     a tela, não destruir trabalho).
   * E a sessão protegida não é encerrada: o painel diz o motivo e oferece apenas fechar a vista.
   */
  async function closeTerminalFlow(p) {
    if (!p) return;
    var name = p.session;
    if (!name) { closePanel(p); return; }
    var elsewhere = PANELS.some(function (o) { return o !== p && o.session === name; });
    if (elsewhere) { closePanel(p); return; }

    var it = p.currentSession && p.currentSession();
    if (it && it.protected) {
      var justClose = await p.confirm(
        "“" + (it.label || name) + "” é protegido — " + (it.protectReason || "não pode ser encerrado") + ".",
        "Fechar a vista",
      );
      if (justClose) closePanel(p);
      return;
    }

    var yes = await p.confirm(killQuestion(it, name), "Encerrar");
    if (!yes) return;
    var r = await deleteSession(name);
    if (!r.ok) { p.toast("[terminal] O servidor recusou encerrar: " + r.reason, "31"); return; }
    await afterMutation();
    // A vista vai junto com o terminal — INCLUSIVE quando é a última. Antes o último painel ficava
    // de pé exibindo o cartão "Este terminal foi encerrado", porque fechá-lo era proibido: o
    // operador matava o terminal e continuava com um painel morto na tela que não conseguia
    // dispensar. Agora o espaço vira uma vaga, que oferece criar ou escolher o próximo.
    closePanel(p, { killed: true });
  }
  async function patchSession(name, patch) {
    try {
      var r = await fetch("/api/terminal/sessions", {
        method: "PATCH", credentials: "include", headers: { "content-type": "application/json" },
        body: JSON.stringify(Object.assign({ name: name }, patch)),
      });
      return (await r.json().catch(function () { return { ok: false }; }));
    } catch (e) { return { ok: false }; }
  }
  async function togglePin(it) {
    var r = await patchSession(it.name, { pinned: !it.pinned });
    if (!r || !r.ok) paneToast("[terminal] Não consegui " + (it.pinned ? "desafixar" : "fixar") + ".", "31");
    await afterMutation();
  }
  /**
   * Um campo de texto NOSSO, no lugar do window.prompt(): o nativo não aceita estilo, não cabe o
   * "para que serve", e em algumas janelas o navegador simplesmente o engole — o operador clicava
   * e nada acontecia. Promise<string|null>: null = cancelou.
   */
  function askName(opts) {
    return new Promise(function (resolve) {
      var back = document.createElement("div");
      back.className = "ask-back";
      var box = document.createElement("div");
      // `kind` separa as duas caixas que antes eram indistinguíveis: "slug" (criar — o formato é
      // restrito porque o nome vira sessão tmux e vai para a URL) e "text" (renomear — texto livre).
      box.className = "ask-box " + (opts.kind === "text" ? "text" : "slug");
      var h = document.createElement("div"); h.className = "ask-title"; h.textContent = opts.title;
      var inp = document.createElement("input");
      inp.type = "text"; inp.value = opts.value || ""; inp.spellcheck = false;
      inp.autocapitalize = "off"; inp.autocomplete = "off";
      // O limite existe dos dois lados (o servidor corta em 80); o campo o torna VISÍVEL em vez de
      // deixar o corte acontecer em silêncio depois de salvar.
      inp.maxLength = 80;
      if (opts.placeholder) inp.placeholder = opts.placeholder;
      var hint = document.createElement("div"); hint.className = "ask-hint"; hint.textContent = opts.hint || "";
      var row = document.createElement("div"); row.className = "ask-row";
      var cancel = document.createElement("button"); cancel.type = "button"; cancel.textContent = "Cancelar";
      var ok = document.createElement("button"); ok.type = "button"; ok.className = "primary"; ok.textContent = opts.ok || "OK";
      // "Limpar" só aparece quando há o que limpar. Sem ele, voltar ao nome original era um segredo:
      // apagar o campo inteiro e salvar (dito só numa frase de dica, para quem a lesse).
      if (opts.clearLabel) {
        row.className += " has-clear";
        var clr = document.createElement("button");
        clr.type = "button"; clr.className = "ghost"; clr.textContent = opts.clearLabel;
        clr.addEventListener("click", function () { finish(""); });
        row.appendChild(clr);
      }
      row.appendChild(cancel); row.appendChild(ok);
      box.appendChild(h); box.appendChild(inp); if (opts.hint) box.appendChild(hint); box.appendChild(row);
      back.appendChild(box);
      document.body.appendChild(back);
      var done = false;
      function finish(v) {
        if (done) return; done = true;
        try { document.body.removeChild(back); } catch (e) {}
        var p = focusedPane(); if (p && v == null) p.focus();
        resolve(v);
      }
      ok.addEventListener("click", function () { finish(inp.value); });
      cancel.addEventListener("click", function () { finish(null); });
      back.addEventListener("click", function (e) { if (e.target === back) finish(null); });
      inp.addEventListener("keydown", function (e) {
        e.stopPropagation();                            // o terminal não pode receber estas teclas
        if (e.key === "Enter") { e.preventDefault(); finish(inp.value); }
        if (e.key === "Escape") { e.preventDefault(); finish(null); }
      });
      setTimeout(function () { inp.focus(); inp.select(); }, 0);
    });
  }

  /**
   * Escolher UM item de uma lista — o irmão do askName para quando a resposta não é digitada.
   * MESMO contrato de Promise, para não haver duas convenções na mesma página:
   *   null = cancelou · "" = escolheu a opção de DESVINCULAR · <valor> = escolheu aquele item.
   *
   * opts: { title, items: [{value, label, sub}], value (o atual), hint, detachLabel }
   */
  function askChoice(opts) {
    return new Promise(function (resolve) {
      var back = document.createElement("div");
      back.className = "ask-back";
      var box = document.createElement("div");
      box.className = "ask-box";
      var h = document.createElement("div"); h.className = "ask-title"; h.textContent = opts.title;
      var list = document.createElement("div"); list.className = "ask-list";

      var items = opts.items || [];
      items.forEach(function (item) {
        var b = document.createElement("button");
        b.type = "button";
        var isCurrent = item.value === opts.value;
        b.className = isCurrent ? "current" : "";
        var tick = document.createElement("span");
        tick.className = "tick"; tick.setAttribute("aria-hidden", "true");
        tick.textContent = isCurrent ? "✓" : "";
        var nm = document.createElement("span");
        nm.textContent = item.label;                       // textContent: nome de board é dado externo
        b.appendChild(tick); b.appendChild(nm);
        if (item.sub) {
          var s = document.createElement("span");
          s.className = "sub"; s.textContent = item.sub;
          b.appendChild(s);
        }
        if (isCurrent) b.setAttribute("aria-current", "true");
        b.addEventListener("click", function () { finish(item.value); });
        list.appendChild(b);
      });

      // Desvincular é uma ESCOLHA da lista, não o botão de cancelar: "sem board" é um estado
      // legítimo do terminal, e confundi-lo com "deixa como está" era o jeito de nunca conseguir
      // desfazer um vínculo.
      if (opts.detachLabel) {
        var d = document.createElement("button");
        d.type = "button"; d.className = "detach" + (opts.value ? "" : " current");
        var dt = document.createElement("span");
        dt.className = "tick"; dt.setAttribute("aria-hidden", "true");
        dt.textContent = opts.value ? "" : "✓";
        var dl = document.createElement("span"); dl.textContent = opts.detachLabel;
        d.appendChild(dt); d.appendChild(dl);
        d.addEventListener("click", function () { finish(""); });
        list.appendChild(d);
      }

      var row = document.createElement("div"); row.className = "ask-row";
      var cancel = document.createElement("button");
      cancel.type = "button"; cancel.textContent = "Cancelar";
      row.appendChild(cancel);

      box.appendChild(h); box.appendChild(list);
      if (opts.hint) {
        var hint = document.createElement("div");
        hint.className = "ask-hint"; hint.textContent = opts.hint;
        box.appendChild(hint);
      }
      box.appendChild(row);
      back.appendChild(box);
      document.body.appendChild(back);

      var done = false;
      function finish(v) {
        if (done) return; done = true;
        try { document.body.removeChild(back); } catch (e) {}
        var p = focusedPane(); if (p && v == null) p.focus();
        resolve(v);
      }
      cancel.addEventListener("click", function () { finish(null); });
      back.addEventListener("click", function (e) { if (e.target === back) finish(null); });
      // As teclas param AQUI — o xterm do painel de baixo não pode recebê-las (a mesma razão do
      // askName e do confirmInline). Setas navegam; Esc cancela.
      box.addEventListener("keydown", function (e) {
        e.stopPropagation();
        if (e.key === "Escape") { e.preventDefault(); finish(null); return; }
        if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
        e.preventDefault();
        var btns = Array.prototype.slice.call(list.querySelectorAll("button"));
        if (!btns.length) return;
        var i = btns.indexOf(document.activeElement);
        var next = e.key === "ArrowDown" ? (i + 1) % btns.length : (i <= 0 ? btns.length - 1 : i - 1);
        btns[next].focus();
      });
      setTimeout(function () {
        var cur = list.querySelector("button.current") || list.querySelector("button");
        if (cur) cur.focus();
      }, 0);
    });
  }

  // ── BOARD do terminal ──────────────────────────────────────────────────────
  // A pergunta que esta tela não respondia. O operador via 3 terminais abertos aqui e NENHUM no bloco
  // "Terminais" da home de board nenhum — porque `servesBoard` é estrita e um tmux aberto à mão não
  // ganha board por nenhum caminho automático. Sem um lugar para dizer "este terminal é do board X",
  // não havia como sair desse estado.

  /** O nome legível de um board id (cai no próprio id quando a lista ainda não chegou). */
  function boardName(id) {
    for (var i = 0; i < knownBoards.length; i++) if (knownBoards[i].id === id) return knownBoards[i].name;
    return id;
  }
  /** Vínculo ESTRUTURAL (veio do card ou do claim da frota) ⇒ não se troca — só se lê. */
  function boardLocked(it) { return !!it && (it.boardSource === "card" || it.boardSource === "fleet"); }
  function boardLockReason(it) {
    if (!it) return "";
    if (it.boardSource === "card") {
      return "Vínculo do CARD" + (it.card && it.card.cardId ? " " + it.card.cardId : "")
        + " — este terminal é do board “" + boardName(it.board) + "” porque é o terminal desse card.";
    }
    return "Vínculo da FROTA — a sessão foi aberta para o board “" + boardName(it.board) + "”.";
  }

  /**
   * Abre o seletor e grava a escolha. O servidor é quem manda: ele revalida o id E recusa (409)
   * trocar um vínculo estrutural, então uma recusa aqui é informação, não um erro a esconder.
   */
  async function chooseBoard(it) {
    if (!it || !it.name || boardLocked(it)) return;
    if (!knownBoards.length) { paneToast("[terminal] Não consegui carregar a lista de boards.", "31"); return; }
    var picked = await askChoice({
      title: "A qual board este terminal pertence?",
      items: knownBoards.map(function (b) { return { value: b.id, label: b.name, sub: b.id }; }),
      value: it.board || "",
      detachLabel: "Sem board",
      hint: "O board decide em qual home este terminal aparece no bloco “Terminais”. Sem board ele "
        + "continua aqui e em /processes — só não entra no recorte de nenhuma home.",
    });
    if (picked === null) return;                            // cancelou
    if ((picked || "") === (it.board || "")) return;        // nada mudou — nenhuma escrita
    var r = await patchSession(it.name, { board: picked || null });
    if (!r || !r.ok) {
      paneToast("[terminal] " + ((r && r.error) || "Não consegui vincular este terminal."), "31");
      return;
    }
    paneToast(picked
      ? "[terminal] " + it.name + " agora aparece na home de " + boardName(picked) + "."
      : "[terminal] " + it.name + " ficou sem board.", "32");
    await afterMutation();
  }

  /** O chip de board do cabeçalho: fato quando travado, botão quando o operador pode escolher. */
  function boardChip(it) {
    if (!it) return null;
    var has = !!it.board;
    var c = mkPhChip("board" + (has ? "" : " none"), "◈ " + (has ? boardName(it.board) : "sem board"));
    if (boardLocked(it)) { c.title = boardLockReason(it); return c; }
    c.className += " pick";
    c.tabIndex = 0;
    c.setAttribute("role", "button");
    c.title = has
      ? "Board deste terminal: " + boardName(it.board) + ". Clique para trocar ou desvincular."
      : "Este terminal não aparece na home de nenhum board. Clique para vincular a um.";
    c.addEventListener("click", function (e) { e.stopPropagation(); chooseBoard(it); });
    c.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;
      e.stopPropagation(); e.preventDefault(); chooseBoard(it);
    });
    return c;
  }

  async function renameSession(it) {
    var current = (it && it.alias) || "";
    var next = await askName({
      title: "Renomear terminal",
      kind: "text",
      // O que o operador perguntou ao esbarrar nas regras de CRIAÇÃO: aqui não há regra de formato.
      // O apelido é só exibição — quem tem formato restrito é o nome real (tmux), que não muda.
      hint: "Escreva como quiser: acentos, espaços e maiúsculas valem. É só o nome de exibição — o "
        + "terminal continua sendo “" + it.name + "” para o sistema.",
      placeholder: it.label || it.name,
      value: current,
      clearLabel: current ? "Limpar apelido" : "",
      ok: "Salvar",
    });
    if (next === null) return;                            // cancelou
    var v = next.trim();
    if (v === current) return;                            // nada mudou — nenhuma escrita, nenhum aviso
    var r = await patchSession(it.name, { alias: v });
    if (!r || !r.ok) paneToast("[terminal] Não consegui renomear.", "31");
    else if (!v) paneToast("[terminal] Apelido removido: " + it.name + " volta ao nome derivado.", "32");
    await afterMutation();
  }
  /** Renomear INLINE: duplo-clique (ou toque longo) no nome do painel vira um campo.
   *  Enter salva (alias), Esc cancela, sair do campo salva. Campo vazio limpa o apelido. */
  function beginRename(p) {
    if (!p || p._renaming || !p.hNameTxt) return;
    var it = p.currentSession && p.currentSession();
    if (!it || !it.name) return;
    p._renaming = true;
    var txt = p.hNameTxt;
    // O campo abre com o APELIDO — não com o rótulo derivado ("Agente · <tarefa>"), que era o que ele
    // pré-preenchia. Aquilo tinha um efeito colateral silencioso: salvar CONGELAVA o rótulo derivado
    // como apelido manual, e o nome parava de acompanhar o que a sessão faz. Sem apelido, o campo
    // nasce VAZIO e o rótulo vira placeholder: dá para ver o que ele é hoje sem transformá-lo em texto
    // fixo, e a tecla Enter num campo vazio significa "sem apelido", que é a verdade anterior.
    var current = it.alias || "";
    var input = document.createElement("input");
    input.type = "text"; input.className = "ph-name-edit";
    input.value = current;
    input.placeholder = it.label || it.name;
    input.maxLength = 80;                                 // o servidor corta em 80; o campo não deixa chegar lá
    input.setAttribute("aria-label", "Apelido deste terminal"); input.spellcheck = false;
    txt.style.display = "none";
    txt.parentNode.insertBefore(input, txt.nextSibling);
    input.focus(); input.select();
    var closed = false;
    function finish(commit) {
      if (closed) return; closed = true;
      p._renaming = false;
      var v = input.value.trim();
      if (input.parentNode) input.parentNode.removeChild(input);
      txt.style.display = "";
      if (!commit || v === current) return;               // cancelou ou nada mudou
      patchSession(it.name, { alias: v }).then(function (r) {
        if (!r || !r.ok) paneToast("[terminal] Não consegui renomear.", "31");
        // Limpar é uma ação de resultado invisível (o nome volta a ser o derivado, que pode ser
        // parecido) — então ela se anuncia, senão parece que não salvou.
        else if (!v) paneToast("[terminal] Apelido removido: " + it.name + " volta ao nome derivado.", "32");
        afterMutation();
      });
    }
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") { e.preventDefault(); finish(true); }
      else if (e.key === "Escape") { e.preventDefault(); finish(false); }
      e.stopPropagation();                                 // não deixa atalhos globais capturarem a digitação
    });
    input.addEventListener("blur", function () { finish(true); });
    input.addEventListener("click", function (e) { e.stopPropagation(); });
  }

  // Os tons do aviso, compartilhados pelo aviso do PAINEL (`toast`, dentro de createPanel) e pelo
  // da PÁGINA logo abaixo — os dois falam a mesma língua.
  var TOAST_TONE = { "31": "err", "32": "ok", "33": "warn", "36": "info" };

  /**
   * O aviso da PÁGINA — para quando não há painel algum para falar por ele (a grade ficou vazia
   * porque o operador encerrou o último terminal). Mesma pele do aviso de painel; só o dono muda.
   * Sem isto, o gesto mais definitivo da tela seria o único mudo.
   */
  var pageToastLayer = null;
  function pageToast(msg, color) {
    if (!pageToastLayer) {
      pageToastLayer = document.createElement("div");
      pageToastLayer.id = "pagetoasts";
      document.body.appendChild(pageToastLayer);
    }
    var t = document.createElement("div");
    t.className = "pane-toast " + (TOAST_TONE[String(color == null ? "33" : color)] || "warn");
    t.textContent = msg;
    t.title = "Clique para dispensar";
    var killer = null;
    function drop() {
      if (killer) { clearTimeout(killer); killer = null; }
      t.classList.add("out");
      setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 200);
    }
    t.addEventListener("click", drop);
    pageToastLayer.appendChild(t);
    while (pageToastLayer.childElementCount > 3) pageToastLayer.removeChild(pageToastLayer.firstElementChild);
    killer = setTimeout(drop, String(color) === "31" ? 9000 : 5000);
  }

  /** toast no painel em foco (para mensagens vindas do cromo global); sem painel, na página. */
  function paneToast(msg, color) { var p = focusedPane(); if (p) p.toast(msg, color); else pageToast(msg, color); }

  // ── Seletor de sessões (linhas enriquecidas) ───────────────
  function iconBtn(cls, glyph, title, disabled, handler) {
    var b = document.createElement("button");
    b.type = "button";
    b.className = "iconbtn " + cls;
    b.textContent = glyph;
    b.title = title;
    if (disabled) b.disabled = true;
    else b.addEventListener("click", function (e) { e.stopPropagation(); haptic(8); handler(); });
    return b;
  }

  async function refreshSessions() {
    try {
      var r = await fetch("/api/terminal/sessions", { credentials: "include", cache: "no-store" });
      if (!r.ok) { sessionsProbeOk = false; return; }
      var j = await r.json();
      knownSessions = (j && j.sessions) || [];
      // Uma resposta sem `boards` (servidor antigo, ou listBoards degradado) NÃO apaga a lista que já
      // temos: o seletor sumiria no meio de um uso por causa de um poll ruim.
      if (j && Array.isArray(j.boards) && j.boards.length) knownBoards = j.boards;
      sessionsProbeOk = true;
    } catch (e) {
      sessionsProbeOk = false;                            // mantém o retrato anterior, mas marca a falha
    }
  }

  // ── Poll: mantém barra + abas em dia ───────────────────────
  var pollInFlight = false;
  async function pollSessions() {
    if (pollInFlight) return;
    pollInFlight = true;
    try {
      await refreshSessions();
      renderIdentity();
      renderPaneRow();
      renderAllHeads();
    } finally {
      pollInFlight = false;
    }
  }
  async function afterMutation() {
    await refreshSessions();
    renderIdentity();
    renderPaneRow();
    renderAllHeads();
    if (!palette.hidden) renderPalette();
  }

  // ── Paleta de comando (Cmd/Ctrl+K) ─────────────────────────
  var palette = document.getElementById("palette");
  var paletteInput = document.getElementById("palette-input");
  var paletteList = document.getElementById("palette-list");
  var paletteActive = 0;

  function paletteItems(q) {
    var items = [];
    // O ALVO é o painel que recebe a escolha — o em foco no caso geral, ou o painel específico de
    // quem abriu (▾ do cabeçalho, split, dois dedos, cartão de encerrado).
    var p = paletteTarget || focusedPane();
    // O alvo é CAPTURADO aqui, na montagem: `runPalette` fecha a paleta — e zera `paletteTarget` —
    // ANTES de executar a linha escolhida. Lendo o global lá dentro, a escolha caía no painel
    // vizinho: dividir a tela e escolher um terminal trocava o terminal do painel de ORIGEM e
    // descartava o painel novo, ou seja, o split não fazia nada.
    var alvo = p;
    var curName = p ? p.session : null;
    // dedup: um terminal já aberto em OUTRO painel aparece indisponível (a mesma sessão tmux em dois
    // painéis faz os clientes brigarem pelo tamanho — window-size latest — e piscarem a cada clique).
    var openElsewhere = {};
    for (var pi = 0; pi < PANELS.length; pi++) {
      if (PANELS[pi] !== p && PANELS[pi].session) openElsewhere[PANELS[pi].session] = true;
    }
    sortedSessions().forEach(function (s) {
      var busy = !!openElsewhere[s.name];
      var sub = [];
      if (busy) sub.push("já aberto em outro painel");
      else if (s.phrase) sub.push(s.phrase);
      if (s.board) sub.push("◈ " + boardName(s.board));
      if (s.branch) sub.push("⎇ " + s.branch + (s.dirty ? " ●" : ""));
      var ageTxt = shortAge(s.createdAt);
      if (ageTxt) sub.push("aberto há " + ageTxt);
      items.push({
        icon: s.status === "running" ? "●" : "○",
        text: s.label,
        // `hint` some quando há sub-linha: o nome tmux já entra nela pela busca (`match`), e repeti-lo
        // à direita roubava a largura de quem responde "o que este terminal está fazendo".
        hint: "",
        sub: sub.join(" · "),
        session: s,
        current: s.name === curName,
        busy: busy,
        live: !!s.attached,
        match: s.name,                                    // busca casa pelo nome REAL, não só pelo rótulo
        actions: [
          { cls: s.pinned ? "pinned" : "", glyph: s.pinned ? "★" : "☆",
            title: s.pinned ? "Não deixar mais no topo da lista" : "Deixar sempre no topo da lista",
            run: function () { togglePin(s); } },
          { cls: "", glyph: "✎", title: "Dar um nome mais fácil a este terminal",
            run: function () { renameSession(s); } },
          { cls: "kill", glyph: "⏻", disabled: !!s.protected,
            title: s.protected
              ? ("Protegido — " + (s.protectReason || "este terminal não pode ser encerrado"))
              : "Encerrar o terminal (mata o que estiver rodando)",
            run: function () { killSessionFlow(s); } },
        ],
        run: function () {
          if (busy) return;
          if (alvo && s.name !== alvo.session) alvo.attach(s.name);   // no painel CAPTURADO
        },
      });
    });
    var cur = p ? p.currentSession() : null;
    // Criar herda o alvo capturado SÓ quando ele é um espaço RESERVADO e ainda vazio (a vaga, o
    // painel recém-dividido): ali já há lugar guardado, e abrir um segundo ao lado seria dois
    // painéis por um clique. Com um terminal em cima, o alvo é ignorado — herdá-lo faria o "criar"
    // ATROPELAR o terminal do painel em foco em vez de abrir um do lado, que é o que ele promete.
    items.push({ icon: "＋", text: "Criar um terminal novo…", hint: "criar",
                 run: function () { void createSessionFlow(alvo && alvo.session == null ? alvo : null); } });
    items.push({ icon: "⤒", text: "Voltar ao prompt anterior", hint: "histórico",
                 run: function () { if (p) void p.jumpToLastPrompt(); } });
    items.push({ icon: "A", text: "Aumentar a fonte", hint: "A+",
                 run: function () { if (p) p.setFontSize(p.fontSize() + 1); } });
    items.push({ icon: "a", text: "Diminuir a fonte", hint: "A−",
                 run: function () { if (p) p.setFontSize(p.fontSize() - 1); } });
    items.push({ icon: "⊞", text: "Abrir outro terminal ao lado…", hint: "escolher um existente",
                 run: function () { splitPanel(focusedPane()); } });
    LAYOUTS.forEach(function (l) {
      if (l.id === layoutId) return;
      items.push({ icon: "▦", text: "Layout: " + l.label, hint: l.id === "auto" ? "automático" : l.slots + " painéis",
                   run: function () { layoutId = l.id; prefSet("webterm.layout", l.id); layoutPanes(); renderPaneRow(); } });
    });
    items.push({ icon: "⛶", text: (zoomed ? "Mostrar todos os painéis" : "Ampliar este painel"), hint: "zoom",
                 run: function () { toggleZoom(); } });
    // Sem o piso de um painel, fechar a vista vale para qualquer uma — inclusive a última (o
    // espaço vira vaga). Só some quando não há painel nenhum para fechar.
    if (p) items.push({ icon: "✕", text: "Fechar este painel", hint: "o terminal continua rodando",
                 run: function () { closePanel(focusedPane()); } });
    // Renomear / fixar / encerrar NÃO repetem aqui: agora são as ações ★ ✎ ⏻ da própria linha de
    // cada terminal (e ali valem para QUALQUER um, não só o do painel em foco). Copiar branch fica,
    // porque não é ação de linha.
    if (cur && cur.branch) {
      items.push({ icon: "⎇", text: "Copiar branch", hint: cur.branch, run: function () { if (navigator.clipboard) navigator.clipboard.writeText(cur.branch).catch(function () {}); } });
    }
    if (!q) return items;
    var ql = q.toLowerCase();
    // A busca varre também a sub-linha e o nome REAL do tmux: procurar por "acme" (board) ou pelo
    // nome da sessão é justamente como se acha o terminal certo numa lista longa.
    return items.filter(function (it) {
      return (it.text + " " + (it.hint || "") + " " + (it.sub || "") + " " + (it.match || ""))
        .toLowerCase().indexOf(ql) >= 0;
    });
  }
  function renderPalette() {
    var q = paletteInput.value.trim();
    var items = paletteItems(q);
    palette._items = items;
    if (paletteActive >= items.length) paletteActive = Math.max(0, items.length - 1);
    paletteList.innerHTML = "";
    if (!items.length) {
      var e = document.createElement("div");
      e.id = "palette-empty";
      e.textContent = "Nada encontrado.";
      paletteList.appendChild(e);
      return;
    }
    items.forEach(function (it, i) {
      var row = document.createElement("div");
      row.className = "pitem" + (i === paletteActive ? " active" : "")
        + (it.current ? " current" : "") + (it.busy ? " busy" : "");
      var ic = document.createElement("span"); ic.className = "picon"; ic.textContent = it.icon; row.appendChild(ic);
      if (it.live) {
        var lv = document.createElement("span");
        lv.className = "plive"; lv.title = "alguém está vendo este terminal agora";
        row.appendChild(lv);
      }
      // Linha de SESSÃO = duas linhas (rótulo + o que faz · board · branch · idade). Linha de AÇÃO
      // segue com uma só — são coisas diferentes e a lista fica legível justamente por isso.
      if (it.sub) {
        var col = document.createElement("span"); col.className = "pcol";
        var nm = document.createElement("span"); nm.className = "ptext"; nm.textContent = it.text;
        var sb = document.createElement("span"); sb.className = "psub"; sb.textContent = it.sub;
        col.appendChild(nm); col.appendChild(sb); row.appendChild(col);
      } else {
        var tx = document.createElement("span"); tx.className = "ptext"; tx.textContent = it.text;
        row.appendChild(tx);
      }
      if (it.hint) { var h = document.createElement("span"); h.className = "phint"; h.textContent = it.hint; row.appendChild(h); }
      if (it.actions && it.actions.length) {
        var acts = document.createElement("span"); acts.className = "pactions";
        it.actions.forEach(function (a) {
          // iconBtn já para a propagação, então clicar em ★/✎/⏻ não dispara o `run` da linha.
          acts.appendChild(iconBtn(a.cls, a.glyph, a.title, !!a.disabled, a.run));
        });
        row.appendChild(acts);
      }
      row.addEventListener("mousemove", function () { paletteActive = i; paintPaletteActive(); });
      row.addEventListener("click", function () { runPalette(i); });
      paletteList.appendChild(row);
    });
  }
  function paintPaletteActive() {
    var rows = paletteList.querySelectorAll(".pitem");
    for (var i = 0; i < rows.length; i++) rows[i].classList.toggle("active", i === paletteActive);
  }
  function runPalette(i) {
    var items = palette._items || [];
    var it = items[i];
    if (!it || it.busy) return;                           // linha indisponível não executa nada
    // Escolher uma linha NÃO é desistir. `closePalette` desfaz o painel reservado (split/vaga) que
    // ficou sem terminal — e fazia isso ANTES de a ação chegar nele, matando justamente o alvo que
    // a ação ia preencher. Aqui a reserva é suspensa, e o destino do painel passa a ser da AÇÃO.
    var reservado = paletteForNew ? paletteTarget : null;
    paletteForNew = false;
    closePalette();
    it.run();
    // …mas a linha escolhida pode ter sido para outra coisa (fonte, zoom, arranjo): aí o painel
    // reservado continua vazio e não deve ficar de pé. Adiado um tique, porque criar um terminal
    // pergunta o nome antes — enquanto a caixa estiver aberta, ele espera por ela.
    if (reservado) setTimeout(function () {
      if (reservado.session == null && reservado !== paletteTarget && !document.querySelector(".ask-back")) {
        closePanel(reservado);
      }
    }, 0);
  }

  // A paleta tem um ALVO (qual painel recebe o terminal escolhido) e sabe se foi aberta para um
  // painel NOVO (nascido no split) — nesse caso, fechar sem escolher NÃO deixa o painel nascer.
  // Herdado do #sessmenu: sem isso, cancelar um split deixava um painel vazio na tela.
  var paletteTarget = null;
  var paletteForNew = false;
  function openPalette() {
    if (!palette.hidden) return;
    palette.hidden = false;
    paletteInput.value = "";
    paletteActive = 0;
    renderPalette();
    // No DEDO o foco automático abre o teclado por cima da lista — e aqui a paleta é um SELETOR de
    // terminal (o que o modal fazia), não um campo de busca. No desktop o foco continua, porque ali
    // digitar é justamente como se filtra.
    if (!TOUCH) setTimeout(function () { paletteInput.focus(); }, 0);
    refreshSessions().then(function () { if (!palette.hidden) renderPalette(); });
  }
  /** Abre com alvo = painel `p` (▾ do cabeçalho, split, dois dedos, cartão de encerrado). */
  function openPaletteFor(p, forNew) {
    paletteTarget = p || focusedPane();
    paletteForNew = !!forNew;
    if (p) focusPanel(p);
    openPalette();
  }
  function closePalette() {
    if (palette.hidden) return;
    palette.hidden = true;
    // Painel NOVO (do split) que não escolheu terminal (Esc/clique fora) NÃO nasce — é removido.
    if (paletteForNew && paletteTarget && paletteTarget.session == null) {
      var t = paletteTarget; paletteForNew = false; paletteTarget = null;
      closePanel(t);
      return;
    }
    paletteForNew = false; paletteTarget = null;
    var p = focusedPane(); if (p) p.focus();
  }
  paletteInput.addEventListener("input", function () { paletteActive = 0; renderPalette(); });
  paletteInput.addEventListener("keydown", function (e) {
    var items = palette._items || [];
    if (e.key === "ArrowDown") { e.preventDefault(); paletteActive = Math.min(items.length - 1, paletteActive + 1); paintPaletteActive(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); paletteActive = Math.max(0, paletteActive - 1); paintPaletteActive(); }
    else if (e.key === "Enter") { e.preventDefault(); runPalette(paletteActive); }
    else if (e.key === "Escape") { e.preventDefault(); closePalette(); }
  });
  palette.addEventListener("click", function (e) { if (e.target === palette) closePalette(); });

  // ── Busca no scrollback (ligada ao painel em foco) ─────────
  var findBar = document.getElementById("find");
  var findInput = document.getElementById("find-input");
  var findCount = document.getElementById("find-count");
  var FIND_OPTS = { regex: false, wholeWord: false, caseSensitive: false, decorations: {
    matchOverviewRuler: "#c0c542", activeMatchColorOverviewRuler: "#ffffff",
  } };

  function bindFindResults(p) {
    if (!p || !p.searchAddon.onDidChangeResults) return;
    if (p._findBound) return;
    p._findBound = true;
    p.searchAddon.onDidChangeResults(function (r) {
      if (!r || r.resultCount === undefined) { findCount.textContent = ""; return; }
      findCount.textContent = r.resultCount ? (r.resultIndex + 1) + "/" + r.resultCount : "0";
    });
  }
  function findNext() { var p = focusedPane(); if (p && findInput.value) p.findNext(findInput.value, FIND_OPTS); }
